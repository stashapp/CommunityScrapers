name: FreeonesCommunity

performerByName:
  action: scrapeXPath
  queryURL: https://www.freeones.com/performers?q={}&v=teasers&s=relevance&l=96&m%5BcanPreviewFeatures%5D=0
  scraper: performerSearch

performerByURL:
  - action: scrapeXPath
    url:
      - freeones.xxx
      - freeones.com
    scraper: performerScraper

sceneByName:
  action: scrapeXPath
  queryURL: https://www.freeones.com/vod?q={}
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - www.freeones.com
    scraper: sceneScraper

groupByURL:
  - action: scrapeXPath
    url:
      - www.freeones.com
    scraper: movieScraper

xPathScrapers:
  performerSearch:
    performer:
      Name: //div[@id="search-result"]//p[@data-test="subject-name"]/text()
      URLs:
        selector: //div[@id="search-result"]//div[@data-test="teaser-subject"]/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.freeones.com
              - regex: /feed$
                with: /bio
  sceneSearch:
    common:
      $movieTitle: //div[@data-test="teaser-vod"]//img
    scene:
      Title: $movieTitle/@alt
      Image: $movieTitle/@src
      URLs:
        selector: //div[@data-test="teaser-vod"]/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.freeones.com"

  sceneScraper:
    common:
      $commonRoot: //*[@id="description"]
      $performerName: //a[@data-test="link_Cast"]
      $canonical: //link[@rel="alternate" and @hreflang="x-default"]/@href
    scene:
      Title: //h1
      URLs: $canonical
      Image: //*[@id="fxgp-gallery"]/a[1]/@href
      Details: $commonRoot//div[contains(concat(' ',normalize-space(@class),' '),' pb-2 ')]
      Studio:
        Name: $commonRoot//span[@data-test="link_span_Studio"]
      Director: $commonRoot//span[@data-test="link_span_Director"]
      Date:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' mid-content-pr-past-date ')]
        postProcess:
          - replace:
              - regex: .+?(\w+\s\d{1,2},\s\d{4}).+
                with: $1
          - parseDate: January 2, 2006
      Groups:
        Name: //h1
        URLs: $canonical
      Performers:
        Name: $performerName/span
      Tags:
        Name: //li[@class="list-inline-item"]/a

  movieScraper:
    common:
      $commonRoot: //*[@id="description"]
      $performerName: //a[@data-test="link_Cast"]
    group:
      Name: //h1
      Synopsis: $commonRoot//div[contains(concat(' ',normalize-space(@class),' '),' pb-2 ')]
      Duration: $commonRoot//span[@data-test="link_span_Duration"]
      Studio:
        Name: $commonRoot//span[@data-test="link_span_Studio"]
      Director: $commonRoot//span[@data-test="link_span_Director"]
      Date:
        selector: //div[contains(concat(' ',normalize-space(@class),' '),' mid-content-pr-past-date ')]
        postProcess:
          - replace:
              - regex: .+?(\w+\s\d{1,2},\s\d{4}).+
                with: $1
          - parseDate: January 2, 2006
      FrontImage: //*[@id="fxgp-gallery"]/a[1]/@href
      BackImage: //*[@id="fxgp-gallery"]/a[2]/@href

  performerScraper:
    performer:
      Name:
        selector: //h1
        postProcess:
          - replace:
              - regex: (.+)\sidentifies.+
                with: $1
      URLs: >
        //link[@rel="alternate" and @hreflang="x-default"]/@href
        | //form//a[contains(@href,'instagram.com/')]/@href
        | //form//a[contains(@href,'twitter.com/')]/@href
      Birthdate:
        selector: //span[@data-test="link_span_dateOfBirth"]/text()
        postProcess:
          - parseDate: January 2, 2006
      Ethnicity:
        selector: //span[@data-test="link_span_ethnicity"]
        postProcess:
          - map:
              Asian: Asian
              Caucasian: White
              Black: Black
              Latin: Hispanic
      Country:
        selector: //a[@data-test="link_placeOfBirth"][contains(@href, 'country')]/span/text()
        postProcess:
          - map:
              United States: "USA"
      EyeColor: //span[@data-test="link_span_eye_color"]
      Height:
        selector: //span[@data-test="link_span_height"]
        postProcess:
          - replace:
              - regex: \scm
                with: ""
          - map:
              Unknown: ""
              "12": ""
      Measurements:
        selector: //span[(@data-test='link_span_bra') or (@data-test='link_span_waist') or (@data-test='link_span_hip')]
        concat: "|"
        postProcess:
          - javascript: |
              return value
                .split("|")
                .map((part) => {
                  const cm = part.trim().match(/^(\d+)\s*cm$/);
                  return cm ? String(Math.round(Number(cm[1]) / 2.54)) : part.trim();
                })
                .filter((part) => part && part !== "Unknown")
                .join("-");
      FakeTits:
        selector: //span[@data-test="link_span_boobs"]
        postProcess:
          - map:
              Unknown: ""
              Fake: "Yes"
              Natural: "No"
      CareerStart: //span[@data-test="link_span_careerStart"]
      CareerEnd: //span[@data-test="link_span_careerEnd"][not(normalize-space(//span[@data-test="link_span_careerStatus"])="Active")]
      Aliases:
        selector: //span[@data-test='link_span_aliases']/text()
        concat: ", "
      Tattoos:
        selector: //span[@data-test="link_span_tattooLocations"]
        postProcess:
          - map:
              Unknown: ""
      Piercings:
        selector: //span[@data-test="link_span_piercingLocations"]
        postProcess:
          - map:
              Unknown: ""
      Images:
        selector: //div[contains(@class,'image-container')]//a/img/@src
      Gender:
        selector: //h1/*[1]/*[1]/text()
        postProcess:
          - replace:
              - regex: ".+ identifies as (.+)"
                with: "$1"
      #Details: //div[@data-test="biography"]
      DeathDate:
        selector: //div[contains(text(),'Passed away on')]
        postProcess:
          - replace:
              - regex: Passed away on (.+) at the age of \d+
                with: $1
          - parseDate: January 2, 2006
      HairColor: //span[@data-test="link_span_hair_color"]
      Weight:
        selector: //span[@data-test="link_span_weight"]
        postProcess:
          - replace:
              - regex: \skg
                with: ""

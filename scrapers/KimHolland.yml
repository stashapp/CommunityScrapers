name: Kim Holland

sceneByURL:
  - action: scrapeXPath
    url:
      - kimholland.com
      - kimholland.nl
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url: &toDutchSite
        - regex: ^https?://(?:www\.)?kimholland\.com/video/(\d+).*$
          with: https://www.kimholland.nl/-${1}.html
        - regex: ^(https?://(?:www\.)?kimholland\.nl/[^?#]+\.html).*$
          with: ${1}?lang=en
sceneByName:
  action: scrapeXPath
  queryURL: https://www.kimholland.com/search/{}/
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  queryURLReplace:
    url: *toDutchSite
  scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  scraper: sceneSearch
  queryURL: https://www.kimholland.com/search/{filename}

xPathScrapers:
  sceneScraper:
    common:
      $scene: //h1[@id="player-title"]
    scene:
      Title: $scene
      Details: //div[@class="player-description"][$scene]
      URLs:
        selector: //a[contains(@href, "web.whatsapp.com/send?text=")][$scene]/@href
        postProcess:
          - replace:
              - regex: ^.*?text=
                with: ""
      Image:
        selector: //video[@id="myvideo"][$scene]/@poster
        postProcess:
          - replace:
              - regex: ^/images/front/(\d+)/.*$
                with: https://www.kimholland.nl/images/${1}/1920x1080.jpg
      Tags:
        Name:
          selector: //a[@class="player-cat-link"][$scene]
          postProcess:
            - javascript: |
                return value.replace(/(^|\s)\S/g, (c) => c.toUpperCase());
      Studio:
        Name: //a[@id="logo"][$scene]/@title
  sceneSearch:
    scene:
      Image:
        selector: //a[@class="movie-item-search-image"]/img/@src
        postProcess:
          - replace:
              - regex: ^/images
                with: https://www.kimholland.com/images
      Title: //a[@class="movie-item-search-text-link"]
      Details: //div[@class="movie-item-description"]/p
      Date: //span[@class="movie-item-search-date"]
      Studio:
        Name:
          fixed: Kim Holland
      URLs:
        selector: //a[@class="movie-item-search-text-link"]/@href
        postProcess:
          - replace:
              - regex: ^/video
                with: https://www.kimholland.com/video

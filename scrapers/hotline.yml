name: hotline

sceneByURL:
  - action: scrapeXPath
    url:
      - gethotline.com/vid/
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $clip: //script[@id="__NEXT_DATA__"][contains(., '"clipData"')]
    scene:
      Title:
        selector: $clip
        postProcess:
          - javascript: |
              return JSON.parse(value).props.pageProps.data.clipData.title || "";
      Date:
        selector: $clip
        postProcess:
          - javascript: |
              return JSON.parse(value).props.pageProps.data.clipData.createdAt || "";
          - parseDate: 2006-01-02T15:04:05.000Z
      Details:
        selector: $clip
        postProcess:
          - javascript: return JSON.parse(value).props.pageProps.data.clipData.description || "";
      URLs: //link[@rel="canonical"][$clip]/@href
      Image: //meta[@property="og:image"]/@content
      Performers:
        Name:
          selector: $clip
          postProcess:
            - javascript: return JSON.parse(value).props.pageProps.data.clipData.models || "";
          split: ","
      Tags:
        Name:
          selector: $clip
          postProcess:
            - javascript: return JSON.parse(value).props.pageProps.data.clipData.tag || "";
          split: ","
      Studio:
        Name:
          selector: $clip
          postProcess:
            - javascript: |
                var o = JSON.parse(value).props.pageProps.data.clipData.ownerInfo;
                return o ? o.displayName || "" : "";

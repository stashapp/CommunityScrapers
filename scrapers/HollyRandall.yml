name: HollyRandall
sceneByURL:
  - action: scrapeXPath
    url:
      - hollyrandall.com/scenes/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="vidImgTitle"]/h4
      Date:
        selector: //ul[@class="videoInfo"]/li[contains(., "/")]
        postProcess:
          - parseDate: 01/02/2006
      Details: //div[contains(@class, "vidImgContent")]/p
      Performers:
        Name: //a[@class="link_bright infolink"]
      Tags:
        Name: //div[@class="blogTags"]//a
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: (-[1-4]x)?\.jpg
                with: "-full.jpg"
      Studio:
        Name:
          fixed: Holly Randall

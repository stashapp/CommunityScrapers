name: JavGuru
sceneByURL:
  - action: scrapeXPath
    url:
      - jav.guru/
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://jav.guru/?s={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - jav.guru/actress/
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    common:
      $info: //div[@class="infoleft"]
      $performers: //div[@class="infoleft"]//li[strong[contains(text(),"Actress") or contains(text(),"Actor")]]/a
    scene:
      Title:
        selector: //h1[@class="titl"]
        postProcess:
          - &cleanTitle
            javascript: |
              var unmasked = {
                "f*rced": "forced",
                "drugg*d": "drugged",
                "ch*king": "choking",
                "k*d": "kid",
                "l*li": "loli",
                "r*pe": "rape"
              };
              return value
                .replace(/^\s*\[[^\]]*\]\s*/, "")
                .replace(/[A-Za-z]*\*[A-Za-z]*/g, function (word) {
                  var full = unmasked[word.toLowerCase()];
                  return full ? word.charAt(0) + full.slice(1) : word;
                });
      URLs: //link[@rel="canonical"]/@href
      Code: $info//li[strong/span[contains(text(),"Code")]]/text()
      Date:
        selector: $info//li[strong/span[contains(text(),"Release Date")]]/text()
        postProcess:
          - parseDate: 2006-01-02
      Image:
        selector: //div[@class="large-screenimg"]/img/@src
        postProcess:
          - &ownCdn
            replace:
              - regex: cdn\.javmiku\.com
                with: cdn.javnorth.com
      Director: $info//li[strong[contains(text(),"Director")]]/a
      Studio:
        Name: $info//li[strong[contains(text(),"Studio")]]/a
        URLs: $info//li[strong[contains(text(),"Studio")]]/a/@href
      Tags:
        Name: $info//li[strong[contains(text(),"Tags")]]/a
      Performers:
        Name: $performers
        URLs: $performers/@href

  sceneSearch:
    common:
      $item: //div[@class="inside-article"][div[@class="imgg"]]
    scene:
      Title:
        selector: $item//div[@class="grid1"]/h2/a
        postProcess:
          - *cleanTitle
      URLs: $item//div[@class="imgg"]/a/@href
      Image:
        selector: $item//div[@class="imgg"]/a/img/@src
        postProcess:
          - *ownCdn

  performerScraper:
    performer:
      Name: //h1[@class="profile-h1"]
      Aliases: //strong[text()="Alias:"]/following-sibling::text()[1]
      Images:
        selector: //img[@class="cp-avatar"]/@src
        postProcess:
          - *ownCdn
      URLs: //link[@rel="canonical"]/@href

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

name: CruisingPorn
performerByURL:
  - action: scrapeXPath
    url:
      - cruisingporn.com/tour/models/
    scraper: performerScraper

xPathScrapers:
  performerScraper:
    performer:
      Name: //div[@class='modelname_new_diane']
      Gender:
        fixed: Male
      Country: //span[span[contains(.,'Nationality')]]/span[@class='modelfields_value_new']
      Height:
        selector: //span[span[contains(.,'Height')]]/span[@class='modelfields_value_new']
        postProcess:
          - feetToCm: true
      PenisLength:
        selector: //span[span[contains(.,'Cock Size')]]/span[@class='modelfields_value_new']
        postProcess:
          - replace:
              - regex: "([Uu]n)([Cc]ut)"
                with: ""
              - regex: ^
                with: "0' "
          - feetToCm: true
      Circumcised:
        selector: //span[span[contains(.,'Cock Size')]]/span[@class='modelfields_value_new']
        postProcess:
          - javascript: |
              const m = /(Uncut|Cut)/.exec(value);
              return m ? m[1] : "";
      Tags:
        Name: //span[span[contains(.,'Role')]]/span[@class='modelfields_value_new']
      Details: //div[@class='about_funfacts']/text()

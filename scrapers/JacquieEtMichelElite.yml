name: JacquieEtMichelElite

groupByURL:
  - action: scrapeXPath
    url:
      - jacquieetmichelelite.com/en/porn-movie
    scraper: movieScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - jacquieetmichelelite.com
    scraper: sceneScraper

xPathScrapers:
  movieScraper:
    group:
      Name: //h1[contains(@class,"content-detail__title")]
      Director:
        selector: //li[contains(@class,"content-detail__info") and contains(.,'Director')]
        postProcess:
          - replace:
              - regex: '^Director\s*:\s*'
                with:
      Duration:
        selector: //li[contains(@class,"content-detail__info") and contains(.,'Duration')]
        postProcess:
          - replace:
              - regex: '^Duration\s*:\s*'
                with:
              - regex: " min.*"
                with: ":00"
      Date:
        selector: //script[contains(.,"datePublished")]
        postProcess:
          - replace:
              - regex: ^.+datePublished":\s*"(\d\d\d\d-\d\d-\d\d).+$
                with: $1
      Synopsis: //div[contains(@class,"content-detail__description")]
      Studio:
        Name:
          fixed: Jacquie et Michel Elite
      FrontImage: //meta[@property="og:image"]/@content
  sceneScraper:
    scene:
      Title: //h1[contains(@class,"content-detail__title")]
      Details: //div[contains(@class,"content-detail__description")]
      Date:
        selector: //script[contains(.,"datePublished")]
        postProcess:
          - replace:
              - regex: ^.+datePublished":\s*"(\d\d\d\d-\d\d-\d\d).+$
                with: $1
      Image: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: Jacquie et Michel Elite
      Director:
        selector: //li[contains(@class,"content-detail__info") and contains(.,'Director')]
        postProcess:
          - replace:
              - regex: '^Director\s*:\s*'
                with:
      Performers:
        Name: //div[contains(@class,"actor-item__title")]

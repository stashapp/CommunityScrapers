name: TheNude
performerByName:
  action: scrapeXPath
  queryURL: https://www.thenude.com/index.php?page=search&action=searchModels&__form_name=navbar-search&m_aka=on&m_name={}
  scraper: performerSearch
performerByURL:
  - action: scrapeXPath
    url:
      - thenude.com
    scraper: performerScraper
sceneByURL: &coverByURL
  - action: scrapeXPath
    url:
      - thenude.com/cover
    scraper: coverScraper
galleryByURL: *coverByURL
imageByURL: *coverByURL

xPathScrapers:
  performerSearch:
    performer:
      Name:
        selector: //figcaption/span
        postProcess:
          - replace:
              - regex: "^AKA:"
                with: ""
      URLs:
        selector: //a[@class="model-name"]/@href
        postProcess:
          - replace:
              # Normalize to canonical /_NNNNN.htm form (strip name prefix)
              - regex: '(https://www\.thenude\.com/)[^_]*(_\d+\.htm)'
                with: "$1$2"
  performerScraper:
    performer:
      Name: //span[@class="model-name"]
      URLs:
        selector: //link[@rel="canonical"]/@href | //a[text()="INSTAGRAM"]//@href | //a[text()="TWITTER"]//@href
        postProcess:
          - replace:
              # Normalize to canonical /_NNNNN.htm form (strip name prefix)
              - regex: '(https://www\.thenude\.com/)[^_]*(_\d+\.htm)'
                with: "$1$2"
      Birthdate:
        selector: //li/span[@class="list-quest"][contains(text(),'Born')]/following-sibling::text()
        postProcess:
          - javascript: |
              var months = ["january", "february", "march", "april", "may", "june", "july",
                "august", "september", "october", "november", "december"];
              var pad = function (n) { return ("0" + n).slice(-2); };
              var month = function (name) { return months.indexOf(name.toLowerCase()) + 1; };
              var v = value.trim(), m;
              if ((m = v.match(/^(\d{1,2}) ([A-Za-z]+) (\d{4})$/)) && month(m[2]))
                return m[3] + "-" + pad(month(m[2])) + "-" + pad(m[1]);
              if ((m = v.match(/^([A-Za-z]+) (\d{1,2}), (\d{4})$/)) && month(m[1]))
                return m[3] + "-" + pad(month(m[1])) + "-" + pad(m[2]);
              if ((m = v.match(/^([A-Za-z]+) (\d{4})$/)) && month(m[1]))
                return m[2] + "-" + pad(month(m[1]));
              if ((m = v.match(/^(\?\?|\d{1,2})-(\?\?|\d{1,2})-(\d{4})$/)))
                return m[2] == "??" ? m[3] : m[1] == "??" ? m[3] + "-" + pad(m[2]) : m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
              if ((m = v.match(/^(\d{4})$/)))
                return m[1];
              return "";
      Ethnicity:
        selector: //li/span[@class="list-quest"][contains(text(),'Ethnicity')]/following-sibling::text()
        postProcess:
          - replace:
              - regex: "(?i)ebony"
                with: "Black"
              - regex: "(?i)white"
                with: "Caucasian"
              - regex: "(?i)hispanic"
                with: "Latin"
          - map:
              asian: Asian
              white: Caucasian
              black: Black
              hispanic: Latin
              Latina: Latin
              Arab: Middle Eastern
      Country:
        selector: //span[@itemprop="nationality"]/text()
        postProcess:
          - replace:
              - regex: '\bUnited\sStates\sof\sAmerica\b'
                with: "United States"
      HairColor:
        selector: //li/span[@class="list-quest"][contains(text(),'Hair')]/../text()
        postProcess:
          - replace:
              - regex: "Brown"
                with: Brunette
              - regex: '\bBrown\sHair\b'
                with: Brunette
              - regex: "Fair"
                with: Blonde
      Height:
        selector: //li/span[@class="list-quest"][contains(text(),'Height')]/following-sibling::text()
        postProcess:
          - replace:
              - regex: ^(\d+).+$
                with: "$1"
              # Height is an integer value. When the site returns "???" as the height value, replace it as if no value is returned
              - regex: \?\?\?
                with: ""
      Measurements:
        selector: //li/span[@class="list-quest"][contains(text(),'Measurements')]/../text()
        postProcess:
          - replace:
              - regex: \/.*$
                with: ""
      FakeTits:
        selector: //li/span[@class="list-quest"][contains(text(),'Breasts')]/../text()
        postProcess:
          - replace:
              - regex: ^[^\(]+\(([^\)]+)\).*$
                with: "$1"
              # "Real" maps to Stash internal value "Natural"
              - regex: Real
                with: "Natural"
              # "Fake" is already the correct Stash internal value — no mapping needed
              # "Medium" is not a breast enhancement value — blank it
              - regex: Medium
                with: ""
      CareerStart:
        selector: //li/span[@class="list-quest"][contains(text(),'Seen')]/following-sibling::text()
        concat: " - "
        postProcess:
          - javascript: |
              const m = value.match(/\d{4}/);
              return m ? m[0] : "";
      CareerEnd:
        selector: //li/span[@class="list-quest"][contains(text(),'Seen')]/following-sibling::text()
        concat: " - "
        postProcess:
          - javascript: |
              // only a real second year counts as an end - "Present"/"-" mean ongoing
              const years = value.match(/\d{4}/g) || [];
              return years.length > 1 ? years[years.length - 1] : "";
      Aliases:
        selector: //meta[@itemprop="additionalName"]/@content
        concat: ", "
      Images:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: https:\/\/www\.thenude\.com\/
                with: "https://static.thenude.com/models/"
              - regex: \.htm
                with: "/medhead.jpg"
              # Encode spaces in performer names for valid image URLs
              - regex: " "
                with: "%20"
      Gender: //meta[@itemprop="gender"]/@content
  coverScraper:
    scene:
      Title: &title
        selector: //h1/span[2]
        postProcess:
          - replace:
              - regex: ^\"(.*)\"$
                with: $1
      Date: &date
        selector: //h2[text()[contains(.,'Published on')]]
        postProcess:
          - replace:
              - regex: .*Published on\s(\d{4}-\d{2}-\d{2})
                with: $1
      Performers: &performers
        Name: //h1/span[1]/a
        URLs: //h1/span[1]/a/@href
      Tags: &tags
        Name:
          selector: //meta[@itemprop="keywords"]/@content
          split: ","
      Studio: &studio
        Name: //h1/span[3]/a
      Director: &director //h2/a
      Image: (//a[contains(@class, "gallery-image-link")]/img[not(contains(@src, "hc_warning"))]/@src)[1]
      URLs: &urls //link[@rel="canonical"]/@href
    gallery:
      Title: *title
      Date: *date
      Performers: *performers
      Tags: *tags
      Studio: *studio
      Photographer: *director
      URLs: *urls
    image:
      Title: *title
      Date: *date
      Performers: *performers
      Tags: *tags
      Studio: *studio
      Photographer: *director
      URLs: *urls

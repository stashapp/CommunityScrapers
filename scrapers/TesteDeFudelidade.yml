name: "Teste de Fudelidade"
sceneByURL:
  - action: scrapeXPath
    url:
      - testedefudelidade.com/
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - testedefudelidade.com/filmes/
    scraper: movieScrapper
performerByURL:
  - action: scrapeXPath
    url:
      - testedefudelidade.com/modelos/
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    common:
      $performer: //*[text()='Elenco:']/following-sibling::ul/li/a
      $movie: //div[contains(@class, 'filme')]/div[@class="capa"]/img
    scene:
      Title: //*[@class="title"]/h1
      Details: //*[@class="descript"]
      Date:
        selector: //meta[@property="article:published_time"]/@content
        postProcess:
          - parseDate: "2006-01-02T15:04:05Z07:00"
      Image:
        selector: //*[@id="playerFk"]/img/@src | //script[contains(text(), "poster:")]/text()
        postProcess:
          - replace:
              - regex: .*poster:\s*'([^']+)'.*
                with: $1
      Studio:
        Name:
          fixed: Teste de Fudelidade
      Groups:
        Name: $movie/@title
        FrontImage: $movie/@src
      Tags:
        Name: //*[text()='Categorias:']/following-sibling::p/a/text()
      Performers:
        Name: $performer/text()
        URLs: $performer/@href
        Image: $performer/div[@class="img"]/img/@src
  movieScrapper:
    common:
      $performer: //*[text()='Elenco:']/following-sibling::ul/li/a
      $movie: //div[contains(@class, 'filme')]/div[@class="capa"]/img
    group:
      Name: $movie/@title
      FrontImage: $movie/@src
  performerScraper:
    performer:
      Name: //div[@class="titleGeral"]/div[1]/text()
      Image: //div[@class="photo"]/img/@src

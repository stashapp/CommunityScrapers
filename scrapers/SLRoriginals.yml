name: "SLROriginals"
sceneByURL:
  - action: scrapeXPath
    url:
      - slroriginals.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $info: //div[contains(@class,"c-page--video-right")]
    scene:
      Title: $info//h1[1]
      Date:
        selector: $info//span[contains(@class,"u-inline-block")][1]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: $info//div[contains(@class,"u-mb--six")]
      Tags:
        Name: $info//div[contains(@class,"u-mt--four")]//li/a
      Performers:
        Name: $info//div[contains(@class,"u-mt--three")]//a
      Studio:
        Name: //meta[@name="application-name"]/@content
      Image:
        selector: //div[contains(@style,"background-image:")]/@style
        postProcess:
          - replace:
              - regex: .+url\((.+)\).+
                with: $1

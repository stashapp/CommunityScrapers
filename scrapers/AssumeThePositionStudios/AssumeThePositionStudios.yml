name: AssumeThePosition
# scrapes: Assume The Position Studios, Caned School Girls, Disciplinary Arts, Fetish Flixx, Good Spanking, Good Spanking Classics, Marked Butts, OTK Spank, Spank My Bottom, Spanked School Girl, Spanking Digital, Spanking Images, Spanking Online, SpankPass, Strict Spanking, Strictly English Online, Universal Spanking, Worst Behavior Productions
sceneByURL:
  - action: scrapeXPath
    url:
      - assumethepositionstudios.com/trailer
      - canedschoolgirls.com/trailer
      - disciplinaryarts.com/trailer
      - fetishflixx.com/trailer
      - goodspanking.com/trailer
      - goodspankingclassics.com/trailer
      - markedbutts.com/trailer
      - otkspank.com/trailer
      - spankedschoolgirl.com/trailer
      - spankingdigital.com/trailer
      - spankingimages.com/trailer
      - spankingonline.com/trailer
      - spankmybottom.com/trailer
      - spankpass.com/trailer
      - strictlyenglishonline.com/trailer
      - strictspanking.com/trailer
      - uspanking.com/trailer
      - worstbehaviorproductions.com/trailer
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[contains(@class,"atp-video-page-title")]
      Details:
        # Strip the trailing tags
        selector: //div[@class="atp-video-details"]/preceding-sibling::div[1]/p
        postProcess:
          - replace:
              - regex: ^(.*\.)\s+[A-Z][A-Z '/,]*$
                with: $1
      Date:
        selector: //span[text()="Release Date:"]/following-sibling::span/text()
        postProcess:
          - parseDate: Jan 2, 2006
      Image:
        selector: >-
          //img[contains(@class,"atp-video-thumb-fallback")]/@src |
          //p[contains(., "All Rights Reserved")]
        concat: __SEP__
        postProcess:
          - replace:
              - regex: ^(/.*)__SEP__\d{4} © ([a-zA-Z0-9.-]+)\..*$
                with: https://$2$1
      Performers:
        Name: //a[contains(@class,"atp-model-tag")]/span/text()
      Studio:
        Name:
          selector: //title
          postProcess:
            - replace:
                - regex: ^.+ - (.+)$
                  with: $1
      Tags:
        Name:
          selector: //div[@class="atp-video-details"]/preceding-sibling::div[1]/p
          postProcess:
            - replace:
                - regex: ^.*\.\s+([A-Z][A-Z '/,]*)$
                  with: $1
                - regex: ',\s+'
                  with: ","
                # Clear the result if there are no tags
                - regex: .*[a-z].*
                  with: ""
          split: ","

name: "StasyQVR"
sceneByURL:
  - action: scrapeXPath
    url:
      - stasyqvr.com/virtualreality
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://stasyqvr.com/virtualreality/scene/id/{filename}
  queryURLReplace:
    filename:
      - regex: ^(StasyQVR)_([^_]+)_(\d+)_(\d+)_([A-Z]+)_(\d+)\.([a-zA-Z0-9]+)$ # official site file naming scheme: StasyQVR_example scene name_2880_999_LR_180.mp4 # StasyQVR_scene name_resolution_code_LR_180.mp4
        with: $4-$2
      - regex: " "
        with: "_"
      - regex: "'"
        with: ""
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class='detail-right']/h1
      Details: //div[@class='detail-right']/p
      Date:
        selector: //div[@class='main-desc__date']
        postProcess:
          - parseDate: Jan 2, 2006
      Code:
        selector: //meta[@property='og:url']/@content
        postProcess:
          - replace:
              - regex: '.*/id/(\d+)-.*'
                with: $1
      Studio:
        Name:
          fixed: StasyQVR
      Performers:
        Name: //div[@class='main-desc__detail']/a[@class='detail-left']/p
        URLs: //div[@class='main-desc__detail']/a[@class='detail-left']/@href
      Image: //dl8-video/@poster
      URLs:
        selector: //meta[@property='og:url']/@content
        postProcess:
          - replace:
              - regex: "^http:"
                with: "https:"
driver:
  cookies:
    - CookieURL: "https://stasyqvr.com/"
      Cookies:
        - Name: age_confirmed

name: "GirlsRimming"
sceneByURL:
  - action: scrapeXPath
    url:
      - girlsrimming.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $details: //section[contains(@class, "wlgr-video-details")]
    scene:
      Title: $details/h1
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: $details/time/@datetime
        postProcess:
          - replace:
              - regex: T.*
                with: ""
      Details:
        selector: $details/div[contains(@class, "wlgr-description")]/p
        concat: "\n\n"
      Image: //video[@id="bs-video"]/@poster
      Studio:
        Name:
          fixed: Girls Rimming
      Performers:
        Name: $details//div[contains(@class, "wlgr-models")]/a
        URLs: $details//div[contains(@class, "wlgr-models")]/a/@href
      Groups:
        Name:
          selector: $details/h1[contains(., " Ep")]
          postProcess:
            - replace:
                - regex: (.+)(?:\sEp\d).*
                  with: $1
      Tags:
        Name: $details/div[contains(@class, "wlgr-tags")]/a

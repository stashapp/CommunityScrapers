# requires: Altwolia
name: PlayboyTV
sceneByURL:
  - action: script
    url:
      - playboytv.com/en/episode/
    script:
      - python
      - PlayboyTV.py
      - scene-by-url
  - action: scrapeXPath
    url:
      - playboy.tv/watch/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: >-
          //h2[@class="title"]/text()
          | //small[@class="subtitle"]
          | //meta[@name="title"][//div[@class="media-video"]]/@content
          | //div[@class="media-video"]/small
        concat: " - "
        postProcess:
          - replace:
              - regex: \s*•\s*Added on .+$
                with: ""
              - regex: " - Playboy TV"
                with: ""
      Date:
        selector: >-
          //small[@class="subtitle"][contains(., "Added on")]
          | //div[@class="media-video"]/p[contains(@class, "title-meta")]/strong[.="Added:"]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: (?s)^.*Added on (\d+) (\w+) (\d{4}).*$
                with: $2 $1, $3
              - regex: (?s)^.*?(\w+ \d+, \d{4}).*$
                with: $1
          - parseDate: January 2, 2006
      Details: //div[@class="media-video"]/p[@class="article-excerpt"]
      Image:
        selector: //video[@id="video"]/@poster | //video[@id="episode_video"]/@poster
        postProcess:
          - replace:
              - regex: ^https?://web\.archive\.org/web/\d+[a-z_]*/
                with: ""

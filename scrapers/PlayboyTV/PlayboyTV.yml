# requires: Altwolia
name: PlayboyTV
sceneByURL:
  - action: script
    url:
      - playboytv.com/en/episode/
    script:
      - python
      - PlayboyTV.py
      - scene-by-url
  # Legacy XPath scraper preserved for Wayback Machine / archived playboy.tv URLs
  - action: scrapeXPath
    url:
      - playboy.tv/watch/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h2[@class="title"]/text()
      Date:
        selector: //small[@class="subtitle"]/text()
        postProcess:
          - replace:
              - regex: .+(?:• Added on )(.+)
                with: $1
          - parseDate: 02 January 2006
      Details:
        selector: //small[@class="subtitle"]/text()
        postProcess:
          - replace:
              - regex: (.+)(?:• Added on )(?:.+)
                with: $1
      Image: //video[@id="video"]/@poster

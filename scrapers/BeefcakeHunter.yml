name: BeefcakeHunter
sceneByURL:
  - action: scrapeXPath
    url:
      - beefcakehunter.com/video/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h2[@class="sunday-funday-video-title"]
      Details:
        selector: >
          //div[@id="dslc-theme-content-inner"]
          |//div[@id="dslc-theme-content-inner"]//p
          |//div[@id="dslc-theme-content-inner"]//br/following-sibling::node()[1]
        concat: "\x01"
        postProcess:
          - javascript: |
              if (!value) return "";
              var parts = value.split("\x01");
              var full = "";
              for (var i = 0; i < parts.length; i++) {
                if (parts[i].length > full.length) full = parts[i];
              }
              var cuts = [0];
              for (var i = 0; i < parts.length; i++) {
                var anchor = parts[i].trim();
                if (!anchor || anchor === full) continue;
                var at = full.indexOf(anchor);
                if (at > 0 && at === full.lastIndexOf(anchor)) cuts.push(at);
              }
              cuts.sort(function (a, b) { return a - b; });
              var out = [];
              for (var i = 0; i < cuts.length; i++) {
                var end = i + 1 < cuts.length ? cuts[i + 1] : full.length;
                var block = full.slice(cuts[i], end).trim();
                if (block) out.push(block);
              }
              return out.join("\n\n");
      Date:
        selector: //meta[@property="article:published_time"]/@content
        postProcess:
          - replace:
              - regex: ^(\d{4}-\d{2}-\d{2}).*
                with: $1
      Image: //video[@class="wp-video-shortcode"]/@poster
      Tags:
        Name:
          selector: //div[contains(@class, "t7-video-single")]/@class
          postProcess:
            - javascript: |
                var tags = {
                  "anal": "Anal", "arabic": "Arabic", "asian": "Asian",
                  "black": "Black", "bwc": "BWC", "european": "European",
                  "glory-hole": "Glory Hole", "hairy": "Hairy", "latino": "Latino",
                  "mixed": "Mixed", "oral": "Oral", "solo": "Solo", "white": "White",
                  "bbc-keywords": "BBC", "construction-worker": "Construction Worker",
                  "doggy": "Doggy", "dominant": "Dominant", "edging": "Edging",
                  "face-fucking": "Face Fucking", "facial": "Facial", "feet": "Feet",
                  "group-sex": "Group Sex", "hairy-2": "Hairy", "hung": "Hung",
                  "kiss": "Kiss", "married": "Married", "missionary": "Missionary",
                  "moaning": "Moaning", "muscle": "Muscle", "pov": "POV",
                  "riding": "Riding", "rimming": "Rimming", "shower": "Shower",
                  "swallow": "Swallow", "verbal": "Verbal"
                };
                var out = [];
                (value || "").split(/\s+/).forEach(function (c) {
                  var name = tags[c.replace(/^video-category-/, "")];
                  if (c.indexOf("video-category-") === 0 && name && out.indexOf(name) < 0) {
                    out.push(name);
                  }
                });
                return out.join(",");
          split: ","
      Performers:
        Name:
          selector: //div[contains(@class, "t7-video-single")]/@class
          postProcess:
            - javascript: |
                var notPerformers = [
                  "anal", "arabic", "asian", "beefcakes", "black", "bwc", "european",
                  "glory-hole", "hairy", "keywords", "latino", "mixed", "oral", "solo",
                  "white", "bbc-keywords", "construction-worker", "doggy", "dominant",
                  "edging", "face-fucking", "facial", "feet", "group-sex", "hairy-2",
                  "hung", "kiss", "married", "missionary", "moaning", "muscle", "pov",
                  "riding", "rimming", "shower", "swallow", "verbal"
                ];
                var names = {
                  "jc": ["JC"],
                  "michael-s": ["Michael S."],
                  "prince-sergio": ["Prince", "Sergio"]
                };
                var classes = (value || "").split(/\s+/);
                var out =
                  classes.indexOf("video-category-solo") >= 0 ? [] : ["Victor"];
                classes.forEach(function (c) {
                  if (c.indexOf("video-category-") !== 0) return;
                  var slug = c.replace(/^video-category-/, "");
                  if (notPerformers.indexOf(slug) >= 0) return;
                  var guests = names[slug] || [
                    slug
                      .split("-")
                      .map(function (w) {
                        return w.charAt(0).toUpperCase() + w.slice(1);
                      })
                      .join(" "),
                  ];
                  guests.forEach(function (g) {
                    if (out.indexOf(g) < 0) out.push(g);
                  });
                });
                return out.join(",");
          split: ","
      Studio:
        Name:
          fixed: Beefcake Hunter
        URLs:
          fixed: https://beefcakehunter.com/

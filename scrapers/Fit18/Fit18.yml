name: Fit18
# requires: py_common
# scrapes: Fit18, Thicc18
sceneByURL:
  - action: script
    url:
      - fit18.com/video/
      - thicc18.com/videos/
    script:
      - python
      - Fit18.py
      - scene-by-url
performerByURL:
  - action: script
    url:
      - fit18.com/model/
      - fit18.com/models/
    script:
      - python
      - Fit18.py
      - performer-by-url
  - action: scrapeXPath
    url:
      - thicc18.com/models/
    scraper: performerScraper

xPathScrapers:
  performerScraper:
    common:
      $info: //div[@class="card info"]
    performer:
      Name: $info/h1
      Gender:
        fixed: Female
      Height:
        selector: $info/div[h3="Height"]/h4
        postProcess:
          - replace:
              - regex: cm
                with:
      Weight:
        selector: $info/div[h3="Weight"]/h4
        postProcess:
          - replace:
              - regex: kg
                with:
      Measurements: $info/div[h3="Measurements"]/h4

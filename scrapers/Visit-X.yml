name: Visit-X
sceneByURL:
  - action: scrapeJson
    url:
      - visit-x.net
    scraper: sceneScraper
    queryURL: https://www.visit-x.net/rest/v1/gallery/open?language=en&albumId={url}
    queryURLReplace:
      url:
        - regex: .+videos/(\d+).+
          with: $1
jsonScrapers:
  sceneScraper:
    common:
      $video: data.video
    scene:
      Title:
        selector: $video.albumTitle
        postProcess: &decodeHTML
          - javascript: >-
              if (value) {
                return value.replace(
                /&amp;|&lt;|&gt;|&#0?39;|&quot;/g,
                tag =>
                  ({
                    '&amp;': '&',
                    '&lt;': '<',
                    '&gt;': '>',
                    '&#39;': "'",
                    '&#039;': "'",
                    '&quot;': '"'
                    }[tag] || tag)
                ).replace(/<br\s*\/?>/gi, '\n');
              }
              return value

      Tags:
        Name: $video.videoTags
      Performers:
        Name:
          selector: $video.actorName
          postProcess:
            - replace:
                - regex: \-
                  with: " "
      Details:
        selector: $video.description
        postProcess: *decodeHTML
      Date:
        selector: $video.releaseDate
        postProcess:
          - parseDate: 02.01.2006
      Code: $video.id
      URLs: $video.absoluteUrl
      Image: $video.previewPictureUrls.0.pictureUrl
      Studio:
        Name: $video.actorName

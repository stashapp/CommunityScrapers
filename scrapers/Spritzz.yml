name: "Spritzz"
sceneByURL:
  - action: scrapeXPath
    url:
      - spritzz.com/video/
      - spritzz.com/showgal.php
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="videonewinfo"]/h2
      Details: //div[@class="videonewinfo"][h5]/p[not(contains(.,"Cast:"))]
      Performers:
        Name:
          selector: //p[contains(.,'Cast:')]
          postProcess:
            - replace:
                - regex: ',\s+'
                  with: ","
                - regex: ^Cast:\s+(.+)
                  with: $1
          split: ","
      Image:
        # The player poster is 960x540, the face image only 500x351
        selector: //script[contains(., "_player.jpg")] | //img[@id="scene_faceimage"][not(//script[contains(., "_player.jpg")])]/@src
        postProcess:
          - replace:
              - regex: (?s)^.*image:\s*'/([^']+_player\.jpg)'.*$
                with: ${1}
              - regex: ^
                with: https://spritzz.com/
      Date:
        selector: //div[@class="videonewinfo"]/h5
        postProcess:
          - replace:
              - regex: ^.+:\s([^:]+)+$
                with: $1
          - parseDate: January 2, 2006
      Studio:
        Name:
          fixed: "Spritzz"
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

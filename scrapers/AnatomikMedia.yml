name: Anatomik Media
sceneByURL:
  - action: scrapeXPath
    url:
      - customfetishvideos.com/videos/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class="product-title"]
      Image: //meta[@property="og:image"]/@content
      Details:
        selector: (//div[@class="description-excerpt"] | //div[@class="description-full"])[last()]/p
        concat: "\n\n"
      Date:
        selector: //script[@type="application/ld+json" and contains(., "uploadDate")]
        postProcess:
          - replace:
              - regex: .+?"uploadDate"\s*:\s*"([^"]+)".+
                with: $1
          - parseDate: "2006-01-02T15:04:05+00:00"
      Studio:
        Name:
          fixed: Anatomik Media
      Performers:
        Name: //span[@class="featuring-links"]/a
      Tags:
        Name: //div[@class="categories-expanded"]/a[@class="category-tag"]

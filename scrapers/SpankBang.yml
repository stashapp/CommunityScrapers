name: "SpankBang"
sceneByURL:
  - action: scrapeXPath
    url:
      - spankbang.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://spankbang.com/{filename}/video/
  queryURLReplace:
    filename: # expects an id in square brackets before extension, as saved by yt-dlp by default
      - regex: '.*\[([0-9a-z]{4,})\]\.[^\.]+$'
        with: $1
      - regex: .*\.[^\.]+$ # if no id is found in the filename
        with: # clear the filename so that it doesn't leak

xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@data-testid="video-title"]
      Details: //div[@data-testid="video-description"]//p
      Image:
        selector: //img[@id="player_cover_img"]/@src
        postProcess:
          - replace:
              # Get the highest res image they've got
              - regex: w:\d+
                with: w:9999
      Studio:
        Name: //div[@data-testid="profile"]//a/p
      Performers:
        Name: //div[@data-testid="video-tags"]//a[contains(@href, "/pornstar/")]
        URLs:
          selector: //div[@data-testid="video-tags"]//a[contains(@href, "/pornstar/")]/@href
          postProcess:
            - replace:
                - regex: ^
                  with: https://spankbang.com
      Tags:
        Name: //div[@data-testid="video-tags"]//a[starts-with(@href, "/s/")]
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: //time/@datetime
        postProcess:
          - replace:
              - regex: T.*
                with: ""

driver:
  # Cloudflare challenges every non-browser TLS fingerprint regardless of User-Agent
  useSurf: true

name: JAVDatabase

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/?post_type=movies&s={}"
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com/movies/
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/movies/{filename}/"
  queryURLReplace:
    filename:
      - regex: (.*@|.*[\s|\[|\(]|\b)(\w+-\d+)([\s|\]|\)]+.*|.*|\.\w+)
        with: $2
  scraper: sceneScraper

groupByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com
    scraper: movieScraper

performerByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com/idols/
    scraper: performerScraper

performerByName:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/?post_type=idols&s={}"
  scraper: performerSearch

xPathScrapers:
  movieScraper:
    common:
      $infobox: //div[contains(@class,'movietable')]

    group:
      Name: //header[contains(@class,'entry-header')]/h1

      Date: $infobox//p[b[contains(.,'Release Date:')]]/text()

      Duration:
        selector: $infobox//p[b[contains(.,'Runtime:')]]/text()
        postProcess:
          - replace:
              - regex: ^\D*(\d+).*
                with: ${1}:00

      Director: $infobox//p[b[contains(.,'Director:')]]//a

      FrontImage: //div[@id='poster-container']//img/@src

      Studio:
        Name: $infobox//p[b[contains(.,'Studio:')]]//a
        URLs: $infobox//p[b[contains(.,'Studio:')]]//a/@href

      URLs: //link[@rel='canonical']/@href

  performerScraper:
    performer:
      Name:
        selector: //h1[@class='idol-name']
        postProcess:
          - replace:
              - regex: '(.+)\s*-\s*JAV\sProfile$'
                with: "$1"

      Aliases: //b[normalize-space(.)='JP:']/following-sibling::text()[1]

      Gender:
        fixed: Female

      Image: //div[contains(@class,'idol-portrait')]//img/@src

      Birthdate:
        selector: //b[normalize-space(.)='DOB:']/following-sibling::*[1]/self::a
        postProcess:
          - replace:
              - regex: '^(\d{4})-\?\?-\?\?$'
                with: "$1"
          - replace:
              - regex: '^(\d{4}-\d{2})-\?\?$'
                with: "$1"

      HairColor: //b[normalize-space(.)='Hair Color(s):']/following-sibling::*[1]/self::a

      Tags:
        Name: //p[b[normalize-space(.)='Tags:']]//a[@class='idol-box-link']

      Height:
        selector: //b[normalize-space(.)='Height:']/following-sibling::*[1]/self::a
        postProcess:
          - replace:
              - regex: '[^\d]'
                with: ""

      Measurements:
        selector: //b[normalize-space(.)='Measurements:']/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: '^.*?(\d+-\d+-\d+).*$'
                with: "$1"
          - replace:
              - regex: '^.*\?.*$'
                with: ""

  sceneScraper:
    common:
      $movie: //div[contains(@class,'movietable')]

    scene:
      Title:
        selector: //header[contains(@class,'entry-header')]/h1
        postProcess:
          - replace:
              - regex: '^\s*[A-Za-z0-9]+-\d+\s*-\s*'
                with: ""

      Code: $movie//p[b[contains(.,'DVD ID:')]]/text()

      URLs: //link[@rel='canonical']/@href

      Date: $movie//p[b[contains(.,'Release Date:')]]/text()

      Director: $movie//p[b[contains(.,'Director:')]]//a

      Studio:
        Name: $movie//p[b[contains(.,'Studio:')]]//a
        URLs: $movie//p[b[contains(.,'Studio:')]]//a/@href

      Performers:
        Name: $movie//p[b[contains(.,'Idol(s)/Actress(es):')]]//a
        URLs: $movie//p[b[contains(.,'Idol(s)/Actress(es):')]]//a/@href

      Image: //div[@id='poster-container']//img/@src

      Tags:
        Name: $movie//p[b[contains(.,'Genre(s):')]]//a

  sceneSearch:
    scene:
      Title: //div[contains(@class,'card-body')]//div[contains(@class,'mt-auto')]/a

      Code: //div[contains(@class,'card-body')]//p[contains(@class,'pcard')]/a

      URLs: //div[contains(@class,'card-body')]//p[contains(@class,'pcard')]/a/@href

      Image: //div[contains(@class,'card-body')]//div[contains(@class,'movie-cover-thumb')]/a/img/@src

      Studio:
        Name: //div[contains(@class,'card-body')]/span[contains(@class,'btn')]//a
        URLs: //div[contains(@class,'card-body')]/span[contains(@class,'btn')]//a/@href

  performerSearch:
    performer:
      Name: //p[contains(@class,'pcard')]/a
      URLs: //p[contains(@class,'pcard')]/a/@href

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

name: JAVDatabase

sceneByName:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/?post_type=movies&s={}"
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com/movies/
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/?post_type=movies&s={filename}"
  queryURLReplace:
    filename:
      - regex: (.*@|.*[\s|\[|\(]|\b)(\w+-\d+)([\s|\]|\)]+.*|.*|\.\w+)
        with: $2
  scraper: sceneSearch

groupByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com
    scraper: movieScraper

performerByURL:
  - action: scrapeXPath
    url:
      - javdatabase.com/idols/
    scraper: performerScraper

performerByName:
  action: scrapeXPath
  queryURL: "https://www.javdatabase.com/?post_type=idols&s={}"
  scraper: performerSearch

xPathScrapers:
  movieScraper:
    common:
      $infobox: //div[contains(@class,'movietable')]

    group:
      Name: //header[contains(@class,'entry-header')]/h1

      Synopsis:
        selector: $infobox//p[b[contains(.,'Title:')]]/text()

      Date:
        selector: $infobox//p[b[contains(.,'Release Date:')]]/text()
        postProcess:
          - replace:
              - regex: '\s+'
                with: ' '
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Duration:
        selector: $infobox//p[b[contains(.,'Runtime:')]]/text()
        postProcess:
          - replace:
              - regex: '\s*\(.*?\)'
                with: ''
          - replace:
              - regex: '\s+'
                with: ' '
          - replace:
              - regex: 'min\.?'
                with: ':00'
          - replace:
              - regex: '\s+:'
                with: ':'
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Director:
        selector: $infobox//p[b[contains(.,'Director:')]]/a/text()

      FrontImage: //meta[@property='og:image']/@content

      Studio:
        Name:
          selector: $infobox//p[b[contains(.,'Studio:')]]//a/text()
        URL:
          selector: $infobox//p[b[contains(.,'Studio:')]]//a/@href

      URLs: //link[@rel='canonical']/@href

  performerScraper:
    performer:
      Name:
        selector: //h1[@class='idol-name']
        postProcess:
          - replace:
              - regex: '(.+)\s*-\s*JAV\sProfile$'
                with: '$1'

      Aliases:
        selector: //b[normalize-space(.)='JP:']/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Gender:
        fixed: Female

      Image: //div[contains(@class,'idol-portrait')]//img/@src

      Birthdate:
        selector: //b[normalize-space(.)='DOB:']/following-sibling::a[1]/text()
        postProcess:
          - replace:
              - regex: '^(\d{4})-\?\?-\?\?$'
                with: '$1'
          - replace:
              - regex: '^(\d{4}-\d{2})-\?\?$'
                with: '$1'

      HairColor:
        selector: //b[normalize-space(.)='Hair Color(s):']/following-sibling::a[1]/text()

      Tags:
        Name: //p[b[normalize-space(.)='Tags:']]//a[@class='idol-box-link']/text()

      Height:
        selector: //b[normalize-space(.)='Height:']/following-sibling::a[1]/text()
        postProcess:
          - replace:
              - regex: '[^\d]'
                with: ''

      Measurements:
        selector: //b[normalize-space(.)='Measurements:']/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: '^.*?(\d+-\d+-\d+).*$'
                with: '$1'
          - replace:
              - regex: '^.*\?.*$'
                with: ''
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

  sceneScraper:
    common:
      $movie: //div[contains(@class,'movietable')]

    scene:
      Title:
        selector: //header[contains(@class,'entry-header')]/h1/text()
        postProcess:
          - replace:
              - regex: '^\s*[A-Za-z0-9]+-\d+\s*-\s*'
                with: ''
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Code:
        selector: $movie//p[b[contains(.,'DVD ID:')]]/text()
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      URL: //link[@rel='canonical']/@href

      Date:
        selector: $movie//p[b[contains(.,'Release Date:')]]/text()
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      Director:
        selector: $movie//p[b[contains(.,'Director:')]]//a/text()

      Studio:
        Name:
          selector: $movie//p[b[contains(.,'Studio:')]]//a/text()
        URL:
          selector: $movie//p[b[contains(.,'Studio:')]]//a/@href

      Performers:
        Name:
          selector: $movie//p[b[contains(.,'Idol(s)/Actress(es):')]]//a/text()
        URLs:
          selector: $movie//p[b[contains(.,'Idol(s)/Actress(es):')]]//a/@href

      Image: //div[@id='poster-container']//img/@src

      Tags:
        Name:
          selector: $movie//p[b[contains(.,'Genre(s):')]]//a/text()

      Details:
        selector: $movie//p[b[contains(.,'Title:')]]/text()
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

  sceneSearch:
    scene:
      Title:
        selector: //div[contains(@class,'card-body')]//div[contains(@class,'mt-auto')]/a/text()
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''
                
      Code:
        selector: //div[contains(@class,'card-body')]//p[contains(@class,'pcard')]/a/text()
        postProcess:
          - replace:
              - regex: '^\s+|\s+$'
                with: ''

      URL: //div[contains(@class,'card-body')]//p[contains(@class,'pcard')]/a/@href

      Image: //div[contains(@class,'card-body')]//div[contains(@class,'movie-cover-thumb')]/a/img/@src

      Studio:
        Name: //div[contains(@class,'card-body')]/span[contains(@class,'btn')]//a/text()
        URL: //div[contains(@class,'card-body')]/span[contains(@class,'btn')]//a/@href

  performerSearch:
    performer:
      Name: //p[contains(@class,'pcard')]/a/text()
      URLs: //p[contains(@class,'pcard')]/a/@href

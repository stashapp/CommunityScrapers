name: "OldNanny"
sceneByURL:
  - action: scrapeXPath
    url:
      - oldnanny.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Studio:
        Name:
          fixed: Old Nanny
      Title:
        selector: //title/text()
        postProcess:
          - replace:
              - regex: ^.+\s:\s(.+)$
                with: $1
      Tags:
        Name:
          selector: //a[@class="public-media-detail__tag"]/text()
      Date:
        selector: //script[@type="application/ld+json" and contains(text(),"uploadDate")]
        postProcess:
          - replace:
              - regex: .+"uploadDate":"([^T]+).+
                with: $1
          - parseDate: 2006-01-02
      Performers:
        Name:
          selector: //a[contains(@class, "public-media-detail__model")]/text()
      Image:
        selector: //video[contains(@class, "public-media-detail__video")]/@poster

name: DieselVids
sceneByURL:
  - action: scrapeXPath
    url:
      - dieselvids.com/video/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $info: //div[contains(@class,"videoInfoLeft")]
      $description: //div[contains(@class,"description")]
    scene:
      Title: //div[contains(@class,"videoTitle")]/h1
      Code:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: ^.*-(\d+)\.html$
                with: $1
      URL: //link[@rel="canonical"]/@href
      Date:
        selector: $info//li[i[contains(@class,"fa-calendar")]]
        postProcess:
          - parseDate: 02/01/2006
      Details: $description/p
      Image: //meta[@property="og:image"]/@content
      Tags:
        Name: $description//a[@class="tag"]
      Performers:
        Name: //div[contains(@class,"videoTitle")]/h1
      Studio:
        Name:
          fixed: DieselVids

      Details:
        selector: //head/script[@type='application/ld+json' and contains(text(), '"@type":"VideoObject"')]
        postProcess:
          - javascript: return JSON.parse(value).description
      Image:
        selector: //head/script[@type='application/ld+json' and contains(text(), '"@type":"VideoObject"')]
        postProcess:
          - replace:
              - regex: '^.*"thumbnailUrl":"([^"]+)".*$'
                with: $1
      URLs: //link[@rel="canonical"][contains(@href, "/shoot/")]/@href
  performerSearch:
    common:
      # every result page also carries a fixed "featured models" carousel that
      # ignores the query - the real matches are the ones outside it
      $result: //a[contains(@href, "/model/") and not(ancestor::div[contains(@class, "swimlane")])]
    performer:
      Name:
        selector: $result/img/@alt
        postProcess:
          - replace:
              # alt text is "<name> BDSM - <tag>"
              - regex: '\s+BDSM\b.*$'
                with: ""
      URLs:
        selector: $result/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.kink.com

  performerScraper:
    performer:
      Name: //button[@data-type="performer"][//link[@rel="canonical"][contains(@href, "/model/")]]/@data-title
      # two copies of the portrait are emitted, one per breakpoint
      Images: (//div[contains(@class, "kink-slider-images")]//img/@data-src)[1]
      Tags:
        Name:
          # hrefs are /tag/<slug>-bdsm on kink.com and bare slugs on the other two
          selector: //span[contains(text(), "Tags")]/following-sibling::a[not(contains(., "*"))] | //span[contains(text(), "Tags")]/following-sibling::a[contains(., "*")]/@href
          postProcess: *tagName
      URLs: //link[@rel="canonical"][contains(@href, "/model/")]/@href | //div[contains(@class, "model-social-links")]/a/@href

driver:
  # TLS impersonation is enough to get past the bot check: pages are server-rendered
  useSurf: true
  cookies:
    # CookieURL is required outside of CDP: the cookie jar keys off it, not Domain
    - CookieURL: "https://www.kink.com"
      Cookies:
        - Name: "age_gate_accepted"
          Domain: "www.kink.com"
          Value: "1"
          Path: "/"
    - CookieURL: "https://www.kinkmen.com"
      Cookies:
        - Name: "age_gate_accepted"
          Domain: "www.kinkmen.com"
          Value: "1"
          Path: "/"
    - CookieURL: "https://www.kinktrans.com"
      Cookies:
        - Name: "age_gate_accepted"
          Domain: "www.kinktrans.com"
          Value: "1"
          Path: "/"

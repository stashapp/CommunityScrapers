name: "SG Video"
# scrapes: FETISH KING, SG Video
sceneByURL:
  - action: scrapeXPath
    url:
      - fetishking.com/details/
      - sg-video.com/details/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $description: //div[@class="videoDescription"]
      $canonical: //meta[@property="og:url"]/@content
      $absolute: &absolute |
        var parts = value.split("|");
        var host = parts[0].match(/^https?:\/\/[^\/]+/)[0];
        return parts.slice(1).map(function (path) { return host + path; }).join("|");
    scene:
      Studio:
        Name:
          selector: //meta[@property="og:site_name"]/@content
          postProcess:
            - map:
                fetishking.com: FETISH KING
                sg-video.com: SG Video
      Title: //div[@class="actorData"]/div/h2
      # TODO: enable when scrape dialog can show durations
      # Duration:
      #   selector: $description//div[@class="flex"][starts-with(normalize-space(), "Length:")]
      #   postProcess:
      #     - replace:
      #         - regex: ^Length:\s*
      #           with: ""
      URLs: $canonical
      Date:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - javascript: |
              var folder = value.match(/\/pictures\/(\d{4})\/(\d{2})\//);
              if (!folder) return "";
              var month = folder[1] + "-" + folder[2];
              var stamp = value.match(/_(\d{4})-?(\d{2})-?(\d{2})(?:\d{6})?_/);
              return stamp && stamp[1] + "-" + stamp[2] === month ? month + "-" + stamp[3] : month;
      Details:
        selector: $description/p
        concat: "\n\n"
      Tags:
        Name:
          selector: $description//a[starts-with(@href, "/results?q=")]
          postProcess: &stripSeparator
            - replace:
                - regex: ^,\s*
                  with: ""
      Performers:
        Name:
          selector: $description//a[starts-with(@href, "/pornstars/")]
          postProcess: *stripSeparator
        URLs:
          selector: $canonical | $description//a[starts-with(@href, "/pornstars/")]/@href
          concat: "|"
          postProcess:
            - javascript: *absolute
          split: "|"
      Image:
        selector: $canonical | //div[@id="thumbs"]/a/@href
        concat: "|"
        postProcess:
          - javascript: *absolute

name: "PinkLabelTV"
sceneByURL:
  - action: scrapeXPath
    url:
      - pinklabel.tv
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - pinklabel.tv
    scraper: movieScraper
sceneByName:
  action: scrapeXPath
  scraper: sceneSearch
  queryURL: "https://pinklabel.tv/on-demand/?s={}"
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  movieScraper:
    common:
      $filmDetails: //ul[@id="film_details"]
    group:
      Name: &title
        selector: //meta[@property='og:title']/@content
        postProcess:
          - replace:
              - regex: '\s- PinkLabel.*$'
                with: ""
      Duration:
        selector: $filmDetails/li[strong[contains(text(),"Runtime")]]/text()
        postProcess:
          - replace:
              - regex: '(\d+) min\.?'
                with: 00:$1:00
      Director: &director $filmDetails/li[strong[contains(text(),"Directed By")]]/a
      Date: &date
        selector: $filmDetails/li[strong[contains(text(),"Date Added")]]/text()
        postProcess:
          - replace:
              - regex: "/"
                with: "-"
          - parseDate: 2006-01-02
      Synopsis: &details
        selector: //small[contains(@class,"text-secondary") and contains(text(),"Description")]/following-sibling::p
        concat: "\n\n"
      URLs: &url //meta[@property='og:url']/@content
      FrontImage: &image //meta[@property='og:image']/@content
      Studio: &studio
        Name: $filmDetails/li[strong[contains(text(),"Studio")]]/a
  sceneSearch:
    common:
      $post: //li[@class="list-group-item media plEpisode search-result shameless_film"]
    scene:
      Title:
        selector: $post/a/@title
      URLs:
        selector: $post/a/@href
  sceneScraper:
    common:
      $filmDetails: //ul[@id="film_details"]
    scene:
      Title: *title
      Details: *details
      Date: *date
      URLs: *url
      Image: *image
      Studio: *studio
      Director: *director
      Tags:
        Name: //div[contains(@class,"film-tags-box")]/a
      Performers:
        Name: $filmDetails/li[strong[contains(text(),"Performers")]]/a

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

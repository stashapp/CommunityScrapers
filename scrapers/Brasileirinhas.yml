name: Brasileirinhas
sceneByURL:
  - action: scrapeXPath
    url:
      - brasileirinhas.com/video/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Code:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: .*?(\d+)\.html$
                with: $1
      # description is a bare text node directly under sinopseVideo, not
      # wrapped in its own element (only the title's h1 is a sibling)
      Details: //section[@id='videoSelecionado']//div[@class='sinopseVideo']/text()
      Image:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: .*?(\d+)\.html
                with: https://static1.brasileirinhas.com.br/Brasileirinhas/images/conteudo/cenas/player/$1.jpg
      Studio:
        Name:
          fixed: Brasileirinhas
      Tags:
        Name: //section[@id='videoSelecionado']//ul[@class='ulTaguer']/li[@class='liTaguer']/a/text()

name: ClubAmateurUSA
sceneByURL:
  - action: scrapeJson
    url:
      - clubamateurusa.com/video/
    queryURL: https://nats.puppycash.com/tour_api.php/content/sets?slug={url}&cms_block_id=100034&data_types=1
    queryURLReplace:
      url:
        - regex: .+/video/([^/?#]+).*
          with: $1
    scraper: sceneScraper
jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: sets.0.name
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Details: sets.0.description
      Date: sets.0.added_nice
      Image:
        selector: sets.0.preview_formatted.thumb.@values|@reverse.0.0.[fileuri,signature].@tostr
        postProcess:
          - replace:
              - regex: ^\["(.*)","(.*)"\]$
                with: $1?$2
              - regex: \\/
                with: /
              - regex: ^
                with: https://c8748e7fc4.mjedge.net
      Tags:
        Name: sets.0.data_types.#(shortname=="tags").data_values.#.name
      Performers:
        Name: sets.0.data_types.#(shortname=="models").data_values.#.name
      Studio:
        Name:
          fixed: ClubAmateurUSA
driver:
  headers:
    - Key: X-NATS-cms-area-id
      Value: 98d5a921-2ccd-48ed-be80-804a5c16ae40
    - Key: X-nats-entity-decode
      Value: "1"

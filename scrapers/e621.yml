name: e621
# fork of danbooru
sceneByURL:
  - action: scrapeJson
    url: &urls
      - https://e621.net/posts/
      # e926 - SFW
      - https://e926.net/posts/
    scraper: postScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .+/posts/(\d+).*
          with: https://e621.net/posts/$1.json?mode=extended

imageByURL:
  - action: scrapeJson
    url: *urls
    scraper: postScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .+/posts/(\d+).*
          with: https://e621.net/posts/$1.json?mode=extended

jsonScrapers:
  postScraper:
    image:
      Date: &date
        selector: created_at
        postProcess:
          - replace:
              - regex: "T.+"
                with: ""
          - parseDate: 2006-01-02
      Performers: &character
        Name: tags.character
      Studio: &artist
        Name: tags.artist
      Tags: &tags_general
        Name: tags.general
      URLs: &source sources
      Details: &description description
    scene:
      Date: *date
      Performers: *character
      Studio: *artist
      Tags: *tags_general
      URLs: *source
      Details: *description

# TODO: take these credentials from scraper settings once Stash supports them, see https://github.com/stashapp/stash/issues/4433
driver:
  headers:
    # see https://e621.net/wiki_pages/2425
    # for authentication type
    # needs posts:show ?
    #- Key: "Authorization"
    #  Value: "Basic ="

    # In accordance with api guidelines, do not remove
    - Key: "User-Agent"
      Value: "stashapp/CommunityScrapers (by feederbox826)"

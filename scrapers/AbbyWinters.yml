name: Abby Winters
sceneByURL:
  - action: scrapeXPath
    url:
      - abbywinters.com/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $url: //a[contains(@href,'#shoot-images')]/@href
    scene:
      Title: //div[starts-with(@class,'page-heading')]/div/h1
      Performers:
        Name: //td/a[contains(@href,'/nude_girl/')]
      Date:
        selector: //th[text()='Release date']/following-sibling::td/text()
        postProcess:
          - replace:
              - regex: '\x{a0}'
                with: " "
          - parseDate: 02 Jan 2006
      Details:
        selector: //div[@class[contains(.,'description')]]//text()
        concat: " "
      Tags:
        Name:
          selector: $url
          postProcess:
            - replace:
                - regex: "^https?://[^/]+/[^/]+/([^/]+)/[^/#]+.*$"
                  with: $1
                - regex: _
                  with: " "
      Image: //div[@class='video-player-container video-responsive']/@data-poster|//img[@class="img-responsive"]/@src
      Studio:
        Name:
          fixed: AbbyWinters

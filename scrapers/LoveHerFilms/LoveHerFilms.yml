name: LoveHerFilms
sceneByName:
  action: scrapeJson
  queryURL: "https://api.loveherfilms.com/v1/search/suggestions?q={}"
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeJson
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: \.html/?$
        with: ""
      - regex: .*/tour/trailers/([^/]+).*
        with: https://api.loveherfilms.com/v1/content-sets/$1
  scraper: sceneScraper
sceneByURL:
  - action: scrapeJson
    url:
      - loveherboobs.com/tour/trailers/
      - loveherfeet.com/tour/trailers/
      - loveherfilms.com/tour/trailers/
      - shelovesblack.com/tour/trailers/
    queryURLReplace:
      url:
        - regex: \.html/?$
          with: ""
        - regex: .*/tour/trailers/([^/]+).*
          with: https://api.loveherfilms.com/v1/content-sets/$1
    queryURL: "{url}"
    scraper: sceneScraper
performerByName:
  action: scrapeJson
  queryURL: "https://api.loveherfilms.com/v1/models?modelsNames[]={}"
  scraper: performerSearch
performerByURL:
  - action: scrapeJson
    url:
      - loveherboobs.com/tour/models/
      - loveherfeet.com/tour/models/
      - loveherfilms.com/tour/models/
      - shelovesblack.com/tour/models/
    queryURLReplace:
      url:
        - regex: .*/tour/models/([^/]+)\.html.*
          with: https://api.loveherfilms.com/v1/models/$1
    queryURL: "{url}"
    scraper: performerScraper
jsonScrapers:
  sceneSearch:
    scene:
      Title: '#(type=="video")#.title'
      Image: '#(type=="video")#.thumbUrl'
      URL:
        selector: '#(type=="video")#.slug'
        replace:
          - regex: "^"
            with: "https://www.loveherfilms.com/tour/trailers/"
          - regex: "$"
            with: "/"
  performerSearch:
    performer:
      Name: items.#.modelName
      Image:
        selector: items.#.thumb.sources.3.path
        postProcess:
          - replace:
              - regex: -4x\.jpg$
                with: "-full.jpg"
      URLs:
        selector: items.#.slug
        replace:
          - regex: "^"
            with: "https://www.loveherfilms.com/tour/models/"
          - regex: "$"
            with: ".html"
  performerScraper:
    performer:
      Name: modelName
      Gender:
        selector: gender
        postProcess:
          - map:
              F: Female
              M: Male
      Details: bio
      Image:
        selector: thumb.sources.3.path
        postProcess:
          - replace:
              - regex: -4x\.jpg$
                with: "-full.jpg"
      Ethnicity: ethnicity
      EyeColor: eyecolor
      HairColor: haircolor
      Measurements: measurements
      Tattoos: tattoos
      Piercings: piercings
      Twitter: twitterHandle
      Birthdate:
        selector: birthdate
        postProcess:
          - parseDate: January 2, 2006
      Height:
        selector: height
        postProcess:
          - replace:
              - regex: .+\((\d+) cm\)
                with: "$1"
      Weight:
        selector: weight
        postProcess:
          - replace:
              - regex: .+\((\d+) kg\)
                with: "$1"
  sceneScraper:
    scene:
      Title: title
      Details: description
      Date:
        selector: releaseDateVideo
        postProcess:
          - parseDate: "2006-01-02T15:04:05.000Z"
      Image:
        selector: thumbPhoto.sources.3.path
        postProcess:
          - replace:
              - regex: -4x\.jpg$
                with: "-full.jpg"
      URLs:
        selector: slug
        replace:
          - regex: "^"
            with: "https://www.loveherfilms.com/tour/trailers/"
          - regex: "$"
            with: "/"
      Studio:
        Name:
          selector: directory
          postProcess:
            - replace:
                - regex: ^([A-Za-z]+)_.*
                  with: "$1"
            - map:
                LHFilms: Love Her Films
                LHF: Love Her Feet
                LHB: Love Her Boobs
                LHBT: Love Her Butt
                SLB: She Loves Black
            - replace:
                - regex: ^[A-Za-z]+$
                  with: Love Her Films
      Tags:
        Name: categories.#.title
      Performers:
        Name: models.#.modelName
        URLs:
          selector: models.#.slug
          replace:
            - regex: "^"
              with: "https://www.loveherfilms.com/tour/models/"
            - regex: "$"
              with: ".html"
driver:
  headers:
    - Key: X-Site-Id
      Value: 677d3f422e587cf94d1a9e5d

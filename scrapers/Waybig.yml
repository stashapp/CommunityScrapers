name: Waybig
sceneByURL:
  - action: scrapeXPath
    url:
      - waybig.com/video/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - waybig.com/pornstars/
    scraper: performerScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.waybig.com/searchgate.php?type=models&q={}
  scraper: performerSearch
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Date:
        selector: //div/i[@class="far fa-calendar"]/../span
        postProcess:
          - parseDate: Jan 2, 2006
      Details: //div[@class="expand-inner"]
      Tags:
        Name: //div[@class="content-links -tags"]//a
      Performers:
        Name: //div[@class="models-box"]/a
        URLs: //div[@class="models-box"]/a/@href
      Image: //video/@poster
      Studio:
        Name:
          selector: //a[@class="hoverLink"]
          postProcess:
            - replace:
                - regex: '^Visit\s+'
                  with: ""
  performerSearch:
    performer:
      Name: //div[@class="item-col col -model"]/a/@title
      URLs: //div[@class="item-col col -model"]/a/@href
  performerScraper:
    common:
      $stats: //ul[@class="model-list"]/li
    performer:
      Name: //h1
      URLs:
        selector: >
          //link[@rel="canonical"]/@href
          | //ul[contains(@class, "-social")]//a/@href
        postProcess:
          - replace:
              - regex: \?.*$
                with: ""
      Gender:
        fixed: Male
      Height:
        selector: $stats[contains(., "Height:")]/span[@class="desc"]
        postProcess:
          - feetToCm: true
      Weight:
        selector: $stats[contains(., "Weight:")]/span[@class="desc"]
        postProcess:
          - lbToKg: true
      PenisLength:
        selector: $stats[contains(., "Penis Size:")]/span[@class="desc"]
        postProcess:
          - javascript: |
              const inches = parseFloat(value);
              if (isNaN(inches)) return "";
              return (inches * 2.54).toFixed(1);
      Circumcised: $stats[contains(., "Circumcision:")]/span[@class="desc"]
      Ethnicity: $stats[contains(., "Ethnicity:")]/span[@class="desc"]
      HairColor: $stats[contains(., "Hair:")]/span[@class="desc"]
      EyeColor: $stats[contains(., "Eyes:")]/span[@class="desc"]
      Country: $stats[contains(., "State:")]/span[@class="desc"]
      Images: //div[@class="model-avatar"]//img/@src
      Details:
        selector: //div[@class="model-desc"]/div[@class="expand-inner"]
        postProcess:
          - replace:
              - regex: ^Stats and bio for porn star .*$
                with: ""

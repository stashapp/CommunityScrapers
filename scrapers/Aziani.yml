name: Aziani
sceneByURL:
  - action: scrapeJson
    url:
      - aziani.com/video/
    # cms_block_id changes whenever the tour design is republished; the current one is in the
    # SPA's own call to tour_api.php/content/sets (capture it with a headless browser netlog)
    queryURL: https://azianistudios.com/tour_api.php/content/sets?cms_set_ids={url}&cms_block_id=147904&data_types=1
    queryURLReplace:
      url:
        - regex: .+/video/([^/?#]+).*
          with: $1
    scraper: sceneScraper
jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: sets.0.name
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Details: sets.0.description
      Date: sets.0.added_nice
      Image:
        selector: sets.0.preview_formatted.thumb.1920-1080.0.[fileuri,signature].@tostr
        postProcess:
          - replace:
              - regex: ^\["(.*)","(.*)"\]$
                with: $1?$2
              # gjson's @tostr re-serializes the array without unescaping the
              # forward slashes it JSON-escaped, so fileuri comes through as
              # "\/path\/to\/file" instead of "/path/to/file"
              - regex: \\/
                with: /
              - regex: ^
                with: https://c75c0c3063.mjedge.net
      Tags:
        Name: sets.0.data_types.#(shortname=="tags").data_values.#.name
      Performers:
        Name: sets.0.data_types.#(shortname=="models").data_values.#.name
      Studio:
        Name:
          fixed: Aziani
driver:
  headers:
    - Key: X-NATS-cms-area-id
      Value: 3b4c609c-6a0d-4cb9-9cce-0605f32b79ec
    - Key: X-nats-entity-decode
      Value: "1"

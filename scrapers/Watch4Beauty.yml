name: Watch4Beauty
sceneByURL:
  - action: scrapeJson
    url: &storiesURL
      - https://www.watch4beauty.com/stories/
    queryURL: &queryURL https://www.watch4beauty.com/api/{url}
    scraper: sceneStoriesScraper
    queryURLReplace: &storiesQueryURL
      url:
        - regex: ".+/stories/"
          with: "magazines/"
  - action: scrapeJson
    url: &updatesURL
      - https://www.watch4beauty.com/updates/
    queryURL: *queryURL
    scraper: sceneUpdatesScraper
    queryURLReplace: &updatesQueryURL
      url:
        - regex: ".+/updates/"
          with: "issues/"
galleryByURL:
  - action: scrapeJson
    url: *storiesURL
    queryURL: *queryURL
    scraper: galleryStoriesScraper
    queryURLReplace: *storiesQueryURL
  - action: scrapeJson
    url: *updatesURL
    queryURL: *queryURL
    scraper: galleryUpdatesScraper
    queryURLReplace: *updatesQueryURL

jsonScrapers:
  sceneStoriesScraper:
    scene:
      Title: &storiesTitle 0.magazine_title
      Details: &storiesDetails 0.magazine_text
      Date: &storiesDate
        selector: 0.magazine_datetime
        postProcess:
          - replace:
              - regex: T.+
                with: ""
      Image: &image
        selector: "0"
        postProcess:
          # Older issues do not have a wide-text image
          - javascript: |
              var issue = JSON.parse(value);
              var files = issue.cover_files || {};
              // swap "wide-text" for "wide-blank" to prefer textless covers
              var name = files["wide-text"];
              if (!name) {
                var keys = Object.keys(files);
                name = keys.length ? files[keys[0]] : null;
              }
              if (!issue.prefix || !name) return "";
              return "https://covers.watch4beauty.com/" + issue.prefix + "/" + name + "_2560.jpg";
      Performers: &storiesPerformers
        Name:
          selector: 0.magazine_simple_title
          postProcess:
            - replace:
                - regex: ^
                  with: "https://www.watch4beauty.com/api/magazines/"
                - regex: $
                  with: "/models"
            - subScraper:
                selector: "0.Models.#.model_nickname"
                concat: ","

          split: ","
      Studio: &studioAttr
        Name:
          fixed: Watch4Beauty
      Tags: &storiesTags
        Name:
          selector: 0.magazine_tags
          split: ", "
  sceneUpdatesScraper:
    scene:
      Title: &updatesTitle 0.issue_title
      Details: &updatesDetails 0.issue_text
      Date: &updatesDate
        selector: 0.issue_datetime
        postProcess:
          - replace:
              - regex: T.+
                with: ""
      Image: *image
      Performers: &updatesPerformers
        Name:
          selector: 0.issue_simple_title
          postProcess:
            - replace:
                - regex: ^
                  with: "https://www.watch4beauty.com/api/issues/"
                - regex: $
                  with: "/models"
            - subScraper:
                selector: "0.Models.#.model_nickname"
                concat: ","
          split: ","
      Studio: *studioAttr
      Tags: &updatesTags
        Name:
          selector: 0.issue_tags
          split: ", "
  galleryStoriesScraper:
    gallery:
      Title: *storiesTitle
      Details: *storiesDetails
      Date: *storiesDate
      Performers: *storiesPerformers
      Studio: *studioAttr
      Tags: *storiesTags
  galleryUpdatesScraper:
    gallery:
      Title: *updatesTitle
      Details: *updatesDetails
      Performers: *updatesPerformers
      Date: *updatesDate
      Studio: *studioAttr
      Tags: *updatesTags

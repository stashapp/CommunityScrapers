name: TrikePatrol
# Wordpress REST API for JSON
sceneByURL:
  - action: scrapeJson
    url:
      - trikepatrol.com/content/
      - trikepatrol.com/videos/
    queryURL: "https://trikepatrol.com/wp-json/wp/v2/rest-content?_embed&slug={url}"
    queryURLReplace:
      url:
        - regex: "^.*/([^/]+)/?$"
          with: $1
    scraper: sceneScraper
performerByName:
  action: scrapeJson
  queryURL: "https://trikepatrol.com/wp-json/wp/v2/model?search={}"
  scraper: performerSearch

performerByURL:
  - action: scrapeJson
    url:
      - trikepatrol.com/model/
    queryURL: "https://trikepatrol.com/wp-json/wp/v2/model?slug={url}"
    queryURLReplace:
      url:
        - regex: "^.*/([^/]+)/?$"
          with: $1
    scraper: performerScraper

jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: 0.title.rendered
        postProcess:
          - &decodeEntities
            javascript: |
              const named = { amp: "&", quot: '"', apos: "'", nbsp: " ", hellip: "…" };
              const numeric = { 8216: "‘", 8217: "’", 8220: "“", 8221: "”", 8211: "–", 8212: "—", 8230: "…", 39: "'", 160: " ", 38: "&" };
              const decoded = value.replace(/&(#\d+|[a-z]+);/g, (match, entity) =>
                entity[0] === "#" ? (numeric[parseInt(entity.slice(1), 10)] ?? match) : (named[entity] ?? match)
              );
              return decoded.replace(/\u00a0/g, " ");
      Details:
        selector: 0.content.rendered
        postProcess:
          - replace:
              - regex: (?i)</p>|<br\s*/?>
                with: "\n"
          - &stripTags
            replace:
              - regex: <[^>]+>
                with: ""
          - *decodeEntities
          - replace:
              - regex: '[^\S\n]+'
                with: " "
              - regex: '\s*\n\s*'
                with: "\n"
              - regex: '^\s+|\s+$'
                with: ""
      Date:
        selector: 0.date_gmt
        postProcess:
          - parseDate: "2006-01-02T15:04:05"
      Performers:
        Name:
          selector: 0.acf_data.models
          split: ","
      Tags:
        Name:
          selector: "0._embedded.wp:term|@flatten.#.name"
          postProcess:
            - *decodeEntities
      Image: 0.acf.poster_image.url
      URLs: 0.link
      Studio:
        Name:
          fixed: TrikePatrol

  performerSearch:
    performer:
      Name: "#.title.rendered"
      URLs: "#.link"

  performerScraper:
    performer:
      Name:
        selector: 0.title.rendered
        postProcess:
          - *decodeEntities
      Gender:
        fixed: Female
      Country:
        fixed: Philippines
      Ethnicity:
        fixed: Asian
      Image: 0.acf.portrait_image.url
      Birthdate:
        selector: 0.acf.date_of_birth
        postProcess:
          - parseDate: "01/02/2006"
      Details:
        selector: 0.content.rendered
        postProcess:
          - replace:
              - regex: (?i)</p>|<br\s*/?>
                with: "\n"
          - *stripTags
          - *decodeEntities
          - replace:
              - regex: '[^\S\n]+'
                with: " "
              - regex: '\s*\n\s*'
                with: "\n"
              - regex: '^\s+|\s+$'
                with: ""
      URLs: 0.link

name: Guys In Sweatpants
sceneByURL:
  - action: scrapeXPath
    url:
      - guysinsweatpants.com/tour/trailers/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - guysinsweatpants.com/tour/models/
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h3[@class="h1 highlight"]
      Details: //div[@class="update-info-block text-larger"]/p
      Date:
        selector: //span[@class="update-info-title" and contains(.,"RELEASE DATE:")]/following-sibling::span/text()
        postProcess:
          - parseDate: January 2, 2006
      Image:
        selector: //img[@class="update_thumb thumbs stdimage"]/@src0_1x
        postProcess:
          - replace:
              - regex: ^
                with: https://guysinsweatpants.com
              - regex: content//
                with: content/
              - regex: -1x\.jpg$
                with: -full.jpg
      Studio:
        Name:
          fixed: Guys In Sweatpants
      Performers:
        Name: //span[@class="update-info-title" and contains(.,"CAST:")]/following-sibling::span//a/text()
        URLs:
          selector: //span[@class="update-info-title" and contains(.,"CAST:")]/following-sibling::span//a/@href
  performerScraper:
    common:
      $content: //div[@class="col-12 col-xl-8"]
      $statsLine: //div[@class="col-12 col-xl-8"]//div[contains(@class,"section-title-fullwidth")]//div[@class="update-info-block"]/p/text()[1]
    performer:
      Name: $content//h2
      Image:
        selector: //base/@href | //img[contains(@class,"category_model_thumb")]/@src
        concat: __SEP__
        postProcess:
          - replace:
              - regex: ^(https://[^/]+)/tour/__SEP__/tour/(.+)$
                with: $1/tour/$2
              - regex: content//
                with: content/
      Details: $content//div[@class="update-info-block" and not(ancestor::*[contains(@class,"section-title-fullwidth")])]/p
      Height:
        selector: $statsLine
        postProcess:
          - replace:
              - regex: \s*(\d+)ft\s*(\d+)in\s*\|.*
                with: $1'$2
          - feetToCm: true
      Weight:
        selector: $statsLine
        postProcess:
          - replace:
              - regex: .*\|\s*(\d*)\D*\|.*
                with: $1
          - lbToKg: true
      Circumcised:
        selector: $statsLine
        postProcess:
          - replace:
              - regex: .*,\s*(\S*)\s*
                with: $1
      PenisLength:
        selector: $statsLine
        postProcess:
          - replace:
              - regex: .*\|\s+(\d*)\D*,.*
                with: "0'$1"
          # We do not have an inchToCm so we lose the fractional part
          - feetToCm: true

driver:
  cookies:
    - CookieURL: https://guysinsweatpants.com
      Cookies:
        - Name: pp-accepted
          Domain: .guysinsweatpants.com
          Value: "true"
          Path: "/"

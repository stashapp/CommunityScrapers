xPathScrapers:
  sceneScraper:
    scene:
      Title: &TitleSel //h1[@class="description"]
      Date: &DateSel
        selector: //div[@class="release-date"][1]/text()
        postProcess:
          - parseDate: Jan 02, 2006
      Details:
        selector: //div[@class="synopsis"]//text()
        concat: "\n\n"
      Tags:
        Name: >-
          //div[@class="tags"]/a |
          //div[@class="categories"]/a |
          //a[@data-label="Attribute"]
      Performers:
        Name: >-
          //a[@label="Clip Attribute - Performer"] |
          //div[@class="video-performer"]/a[not(//a[@label="Clip Attribute - Performer"])]
      Studio:
        Name:
          selector: &studioSel >-
            //div[@id="video-container-details"]//div[@class="studio"]/a |
            //div[@class="studio"]/span[not(@class)]
          postProcess: &PP # Override studio name only when needed
            - replace:
                # trim whitespace first so the map below matches exactly
                - regex: ^\s+|\s+$
                  with:
            - map:
                Evil Angel - Joey Silvera: Joey Silvera
                Evil Angel - LeWood: LeWood
                Jay Rock Clips: Jay's POV
                LeWood Productions: LeWood
                LeWood Selects: LeWood
            - replace:
                # 'Jane Doe Clips' => 'Jane Doe'
                - regex: \sClips$
                  with:
      Image:
        selector: >-
          //style[contains(.,"empire-player-video-container") and contains(.,"url(")] |
          //link[@rel="image_src"][not(//style[contains(.,"empire-player-video-container") and contains(.,"url(")])]/@href
        postProcess:
          - replace:
              - regex: '(?s).*?\.empire-player-video-container\s*\{[^}]*background(?:-image)?:\s*url\([''"]?([^''"\)]+)[''"]?\).*'
                with: $1
      URLs: &urlSel //meta[@name="og:url"]/@content
      Groups:
        Name: //h1[@class="description"]/following-sibling::p/a
      Director: &directorSel
        selector: //div[@class="director"]/node()[self::a or self::text()]
        concat: " "
        postProcess:
          - replace:
              - regex: \s{2,}
                with: " "
              - regex: " ,"
                with: ","
      Code:
        selector: //meta[@name="og:url"]/@content
        postProcess:
          - replace:
              - regex: ^https?://[^/]+/(?:shop/)?(\d+)/.+
                with: $1
              - regex: ^http.*
                with:

  movieScraper:
    group:
      Name: *TitleSel
      Date: *DateSel
      Synopsis:
        selector: //div[@class="synopsis"]//text()
        concat: "\n\n"
      Director: *directorSel
      Duration:
        selector: //div[@class="release-date"][2]/text()
        postProcess:
          - replace:
              - regex: " hrs. "
                with: ":"
              - regex: " mins."
                with: ":00"
      Studio:
        Name:
          selector: *studioSel
          postProcess: *PP
      FrontImage: //link[@rel="image_src"]/@href
      BackImage: //div[@class="carousel-item"]/img/@data-src
      URLs: *urlSel

name: StraponDreamer
sceneByURL:
  - action: scrapeXPath
    url:
      - strapondreamer.com/videos
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Image: //div[@class="videoCover"]/img/@src
      Details: //div[@id="description"]
      Studio:
        Name:
          fixed: Strapon Dreamer

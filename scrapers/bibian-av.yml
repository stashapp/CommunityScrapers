name: Bibian-AV
sceneByURL:
  - action: scrapeXPath
    url:
      - bibian-av.com
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://bibian-av.com/search/list?keyword={}
  scraper: sceneSearchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $infoTable: //div[@class='p-workPage__table']
      $code: //div[@class='p-workPage__table']//div[text() = '品番']/../div[@class='td']//p/text()
    scene:
      URLs:
        selector: $code
        postProcess:
          - replace:
              - regex: ^
                with: https://bibian-av.com/works/detail/
      Code:
        selector: $code
        postProcess:
          - replace:
              - regex: ^([A-Za-z]+)(\d+)$
                with: $1-$2
      Title: //h2[@class='p-workPage__title']
      Date:
        selector: $infoTable//div[text() = '発売日']/../div[@class='td']//a
        postProcess:
          - replace:
              - regex: (\d+)年(\d+)月(\d+)日
                with: $1-$2-$3
          - parseDate: 2006-1-2
      Director:
        selector: $infoTable//div[text() = '監督']/../div[@class='td']//p
        postProcess:
          - replace:
              - regex: ^-+$
                with: ""
      Studio:
        Name: $infoTable//div[text() = 'レーベル']/../div[@class='item']//a
        URLs:
          fixed: https://bibian-av.com
      Performers:
        Name: $infoTable//div[text() = '女優']/../div[@class='td']//a
      Tags:
        Name: $infoTable//div[text() = 'ジャンル']/..//div[@class='item']//a
      Details: //p[@class='p-workPage__text']
      Image: //div[@class='swiper-wrapper']/div[1]/img/@data-src | //section[@class='l-slider']//img/@src
  sceneSearchScraper:
    common:
      $scene: //div[@class='swiper-wrapper']//div[@class='item']/div[1]/a[contains(@href, "/works/detail/")]
    scene:
      Title: $scene/div[@class='hover__child']/p[@class='text']
      Code:
        selector: $scene/@href
        postProcess:
          - replace:
              - regex: .*/([A-Za-z]+)(\d+)$
                with: $1-$2
      Image: $scene/img/@data-src
      URLs: $scene/@href

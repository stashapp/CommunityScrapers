name: AVEntertainments
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.aventertainments.com/dvd/search?lang=1&cat=29&culture=en-US&searchby=keyword&page=1&keyword={filename}
  queryURLReplace:
    filename:
      - regex: \..+$
        with: ""
  scraper: sceneSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - aventertainments.com/
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.aventertainments.com/dvd/search?lang=1&cat=29&culture=en-US&searchby=keyword&page=1&keyword={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  sceneSearch:
    common:
      $videoItem: //div[@class="single-slider-product grid-view-product"]
    scene:
      Title: $videoItem/div[@class="single-slider-product__content"]/p/a
      URLs: $videoItem/div[@class="single-slider-product__content"]/p/a/@href
      Image: $videoItem/div[@class="single-slider-product__image"]/a/img/@src
  sceneScraper:
    common:
      $singleInfo: //div[@class="single-info"]
      $performer: //div[@class="single-info"][contains(span,"主演女優") or contains(span,"Starring")]/span[@class="value"]/a
    scene:
      Title:
        selector: //div[@class="section-title"]/h3
        postProcess:
          - replace:
              - regex: (?i)\s*\(\s*(?:full\s*hd|blu-?ray[^)]*)\s*\)\s*$
                with: ""
      URLs: //meta[@property="og:url"]/@content
      Code: $singleInfo[contains(span,"商品番号") or contains(span,"Item")]/span[@class="tag-title"]
      Date:
        selector: $singleInfo[contains(span,"発売日") or contains(span,"Date")]/span[@class="value"]
        postProcess:
          - replace:
              - regex: (\d{1,2}\/\d{1,2}\/\d{4}).*
                with: $1
          - parseDate: 1/2/2006
      Details:
        selector: //div[contains(@class,"product-description")]
        postProcess:
          - replace:
              - regex: \s*\.+\s*(?:すべて読む|Read More)
                with: ""
      Performers:
        Name: $performer
        URLs: $performer/@href
      Tags:
        Name: $singleInfo[contains(span,"カテゴリ") or contains(span,"Category")]/span[@class="value-category"]/a
      Studio:
        Name:
          selector: $singleInfo[contains(span,"スタジオ") or contains(span,"Studio")]/span[@class="value"]/a
          postProcess:
            - map:
                ムゲンエンターテインメント: MUGEN Entertainment
                ケイ・エム・プロデュース: K M Produce
                オペラ: OPERA
                SODクリエイト: SOD Create
                三和出版: Sanwa Shuppan
                セレブの友: Celeb no Tomo
                AVS collector’s: AVS collector's
                クィーンロード: SmQueenRoad
                キャットウォーク: Catwalk
                ステージ 2 メディア: Stage 2 Media
                スカイハイエンターテインメント: Sky High Entertainment
      Image: //span[@class="grid-gallery"]/a/@href|//div[@id="PlayerCover"]/img/@src

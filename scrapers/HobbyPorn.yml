name: HobbyPorn
sceneByURL:
  - action: scrapeXPath
    url:
      - hobby.porn
    scraper: sceneScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://hobby.porn/search/{}/
  scraper: sceneSearch
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="title-block"]/h1
      Performers:
        Name: //span[@itemprop="author" or @itemprop="actor"]/a
      Studio:
        Name: //span[@itemprop="author"]/a
      Date:
        selector: //div[@class="video-data"]/span/text()[contains(.,'/')]
        postProcess:
          - parseDate: 01/02/2006
      Tags:
        Name: //a[@itemprop="genre"]
      URLs:
        selector: //link[@rel="canonical"]/@href | //iframe[contains(@src, 'pornhub.com')]/@src
        postProcess:
          - replace:
              - regex: https://www\.pornhub\.com/embed/
                with: "https://www.pornhub.com/view_video.php?viewkey="
      Image: //meta[@itemprop="thumbnailUrl"]/@content
      Details: //div[@itemprop="description"]
  sceneSearch:
    common:
      $scenecard: //div[contains(@class,"item item-video")]
    scene:
      Details: $scenecard//div[@class="item-title"]
      URLs: $scenecard//a/@href
      Image: $scenecard//img/@src

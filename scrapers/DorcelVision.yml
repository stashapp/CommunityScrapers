name: DorcelVision
sceneByURL:
  - action: scrapeXPath
    url:
      - https://www.dorcelvision.com/en/movies
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - https://www.dorcelvision.com/en/movies
    scraper: movieScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.dorcelvision.com/en/search/contentsAjax?query={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $movie: //div[contains(@class, "inner-slider") and contains(@class, "slider-xs")]//a[contains(@class, "rolloverv2")]
    scene:
      Title: $movie/@aria-label
      URLs:
        selector: $movie/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.dorcelvision.com
      Image:
        selector: $movie/img/@data-src
        postProcess:
          - replace:
              - regex: ^
                with: https://www.dorcelvision.com

  sceneScraper:
    scene:
      Title: &titleSel //meta[@property="og:title"]/@content
      Details: &detailsAttr
        selector: //div[@id="biography"]/*
        concat: "\n\n"
      Image:
        selector: (//img[contains(@data-src, "/bannerfullxl1200/")]/@data-src)[1]
        postProcess:
          - replace:
              - regex: ^
                with: https://www.dorcelvision.com
      Date: &dateAttr
        selector: //div[@class="row informations"]/div/div/h3[contains(., "Production year")]/parent::div/following-sibling::div
        postProcess:
          - parseDate: 2006-01-02
      Performers:
        Name: //div[contains(@class, "casting")]//div[contains(@class, "slider-xl")]//div[@class="col-xs-2"]//a/p/span
      Studio: &studioAttr
        Name: //div[@class="row informations"]/div/div/h3[contains(., "Studio")]/parent::div/following-sibling::div
      Groups:
        Name: *titleSel
        URLs: &ogUrlSel //meta[@property="og:url"]/@content
      URLs: *ogUrlSel
  movieScraper:
    group:
      Name: *titleSel
      Date: *dateAttr
      Duration:
        selector: //div[contains(@class, "informations")]//span[@class="duration"]
        postProcess:
          - replace:
              - regex: \smin\.?
                with: ":00"
      Studio: *studioAttr
      Director: //div[contains(@class, "informations")]//h3[contains(., "Directed by")]/parent::div/following-sibling::div/a
      FrontImage:
        selector: //button[@class="cover"]/@data-href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.dorcelvision.com
      BackImage:
        selector: //button[@class="back fix-hard"]/@data-href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.dorcelvision.com
      Synopsis: *detailsAttr
      URLs: *ogUrlSel

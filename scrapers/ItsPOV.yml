name: It's POV
sceneByURL:
  - action: scrapeXPath
    url:
      - itspov.com/en/videos
      - itspov.com/videos
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $scene: //div[@id="scenes"][contains(@class, "show")]
    scene:
      Title: //meta[@property="og:title"][$scene]/@content
      URLs: //meta[@property="og:url"][$scene]/@content
      Details: //meta[@name="description"][$scene]/@content
      Date:
        selector: $scene//span[@class="publish_date"]
        postProcess:
          - parseDate: January 2, 2006
      Performers:
        Name: $scene/div[@class="player"]/div[@class="actress"]/a
      Studio:
        Name:
          selector: //meta[@property="og:site_name"][$scene]/@content
          postProcess:
            - map:
                It'sPOV: It's POV
      Image:
        selector: $scene/div[@class="player"]//picture/source[last()]/@data-srcset
        postProcess:
          - replace:
              - regex: (.+1x, )(.+)( 2x)
                with: $2

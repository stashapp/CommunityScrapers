name: Hypnotube
sceneByURL:
  - action: scrapeXPath
    url:
      - hypnotube.com/video/
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $studio: //a[starts-with(@href,'https://hypnotube.com/user/')]
    scene:
      Title: //div[@class='item-tr-inner-col inner-col']/h1
      Details: //div[@class='main-description']
      Image: //meta[@property='og:image']/@content
      Studio:
        Name: $studio/@title
        URLs: $studio/@href
      Date:
        selector: //li/span[@class="icon i-calendar"]/following-sibling::span
        postProcess:
          - replace:
              - regex: \s.*$
                with: ""
      Tags:
        Name: //div[@class='tags-block']/a
      URLs: //link[@rel='canonical']/@href

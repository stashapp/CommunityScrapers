name: CrashpadSeries
sceneByURL:
  - action: scrapeXPath
    url:
      - crashpadseries.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[contains(@class,"link-pl-primary")]
      Date:
        selector: //script[@type="application/ld+json"]
        postProcess:
          - replace:
              - regex: .+(?:"datePublished":")([^T]+).+
                with: $1
          - parseDate: 2006-01-02
      Performers:
        Name: //div[contains(@class,"performer-thumb")]//a[contains(@href,"/character/")]
      Tags:
        Name: //a[contains(@href,"/content-tag/")]
      Details:
        selector: //span[@class="ep-description"]/p
        concat: "\n\n"
      Image:
        selector: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: CrashPad Series

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

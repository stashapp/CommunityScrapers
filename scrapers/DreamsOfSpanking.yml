name: DreamsOfSpanking
sceneByURL:
  - action: scrapeXPath
    url:
      - dreamsofspanking.com/scene/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - dreamsofspanking.com/scene/
    scraper: galleryScraper
xPathScrapers:
  sceneScraper:
    common:
      $post: //div[contains(@class, "elementor-location-single")]
    scene:
      Title: &title
        selector: //meta[@property="og:title"]/@content
        postProcess:
          - replace:
              - regex: \s+-\s+Dreams of Spanking$
                with: ""
      URLs: &urls //link[@rel="canonical"]/@href
      Date: &date
        selector: //*[contains(@class, "elementor-post-info__item--type-date")]
        postProcess:
          - parseDate: January 2, 2006
      Details:
        selector: >-
          ($post//div[contains(@class, "elementor-widget-text-editor")]
          [string-length(normalize-space(.)) > 200])[1]//p
        concat: "\n\n"
      Performers: &performers
        Name: $post//a[contains(@href, "/performers/")][normalize-space()]
      Tags: &tags
        Name: >-
          $post//a[contains(@href, "/orientation/")]
          | $post//a[contains(@href, "/implements/")]
          | $post//a[contains(@href, "/genres/")]
          | $post//a[contains(@href, "/atmosphere/")]
          | $post//a[contains(@href, "/details/")]
      Studio: &studio
        Name:
          fixed: Dreams of Spanking
      Image: //meta[@property="og:image"]/@content
  galleryScraper:
    common:
      $post: //div[contains(@class, "elementor-location-single")]
    gallery:
      Title: *title
      URLs: *urls
      Date: *date
      Performers: *performers
      Tags: *tags
      Studio: *studio

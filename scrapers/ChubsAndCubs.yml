name: ChubsAndCubs
# similar to SpunkWorthy.yml
sceneByURL:
  - action: scrapeXPath
    url:
      - chubsandcubs.com/tour/view_video/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - chubsandcubs.com/tour/view_guy/
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //p[@class="h1"]
      Details:
        selector: //div[@class="content"][1]/p/text()
        concat: "\n\n"
      Image:
        selector: //img[contains(@src,"poster.jpg")]/@src
        postProcess:
          - replace:
              - regex: "^"
                with: https://chubsandcubs.com/
      Studio:
        Name:
          fixed: Chubs & Cubs
      Performers:
        Name:
          selector: //div[@class="scene_models"]//p/a/text()
          postProcess:
            - replace:
                - regex: "More of "
                  with: ""
  performerScraper:
    performer:
      Name: //p[contains(@class, 'h1')]
      Gender:
        fixed: Male
      Weight:
        selector: //div[@class='model_left']/p[1]/text()[contains(.,'Weight')]
        postProcess:
          - replace:
              - regex: .*Weight:\s*(\d+).*
                with: $1
          - lbToKg: true
      Height:
        selector: //div[@class='model_left']/p[1]/text()[contains(.,'Height')]
        postProcess:
          - replace:
              - regex: "Height: "
                with: ""
          - feetToCm: true
      PenisLength:
        selector: //div[@class='model_left']/p/text()[contains(., 'Cock')]
        postProcess:
          - replace:
              - regex: .*Cock:\s*(\d+).*
                with: 0'$1
          - feetToCm: true
      Images:
        selector: //div[@class='mod_pic']/img/@src
        postProcess:
          - replace:
              - regex: "^"
                with: https://chubsandcubs.com

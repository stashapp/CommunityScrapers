name: private
# scrapes: Private, Private Black, Private Castings
sceneByURL:
  - action: scrapeXPath
    url:
      - private.com
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - privateblack.com/scene/
      - privatecastings.com/scene/
    scraper: siteScraper
groupByURL:
  - action: scrapeXPath
    url:
      - private.com
    scraper: movieScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.private.com/search.php?query={}
  scraper: performerSearch
performerByURL:
  - action: scrapeXPath
    url:
      - private.com
    scraper: performerScraper
xPathScrapers:
  movieScraper:
    group:
      Name: &movieName //div[@class="dvds-wrapper"]/h1
      Director: &movieDirector //p[@class="director"]/span[@itemprop="name"]/text()
      Duration:
        selector: &movieDuration //p[em[contains(text(), "Duration:")]]/text()
        postProcess:
          - replace:
              - regex: ^(\d+).+$
                with: 00:$1:00
      Date: &movieDate //span[@itemprop="datePublished"]
      Studio:
        Name: &movieStudioName //div[@class="dvds-wrapper"]/p[@class="line-dvd"]
      Synopsis: &movieSynopsis //p[@class="sinopsys"]
      FrontImage: &movieFrontImage //div[@class="dvds-wrapper"]//img[@class="img-responsive"]/@src
  performerSearch:
    common:
      $searchData: //a[@data-track="PORNSTAR_NAME"]
    performer:
      Name: $searchData
      URLs: $searchData/@href
  sceneScraper:
    common:
      $content: //section[@class="video-description-and-tags clearfix"]
    scene:
      Title: //div[@class="title-zone"]/h1
      Code:
        selector: //meta[@property="og:video"]/@content
        postProcess:
          - replace:
              - regex: .+\/(.+)\/trailers\/.+
                with: $1
      Date:
        selector: //meta[@itemprop="uploadDate"]/@content
        postProcess:
          # The format changes when another language is selected
          - replace:
              - regex: (?:T.+)
                with:
          - parseDate: 2006-01-02
      Details: $content//p[@id="description-section"]
      Tags:
        Name: //li[@class="tag-tags"]//a
      Performers:
        Name: //li[@class="tag-models"]//a
      Groups:
        Name:
          selector: //strong[contains(.,'Full Movie')]/../@href
          postProcess:
            - subScraper: *movieName
        Director:
          selector: //strong[contains(.,'Full Movie')]/../@href
          postProcess:
            - subScraper: *movieDirector
        Duration:
          selector: //strong[contains(.,'Full Movie')]/../@href
          postProcess:
            - subScraper: *movieDuration
            - replace:
                - regex: ^(\d+).+$
                  with: 00:$1:00
        URLs: //strong[contains(.,'Full Movie')]/../@href
        Synopsis:
          selector: //strong[contains(.,'Full Movie')]/../@href
          postProcess:
            - subScraper: *movieSynopsis
        FrontImage:
          selector: //strong[contains(.,'Full Movie')]/../@href
          postProcess:
            - subScraper: *movieFrontImage

      Studio:
        Name:
          selector: //div[@class="title-zone"]//li/a/span[@class="title-site"] | /html/@lang
          postProcess:
            - replace:
                - regex: ^en$
                  with: Private
      Image: //meta[@property="og:image"]/@content
  siteScraper:
    scene:
      Title: //meta[@itemprop="name"]/@content
      Date:
        selector: //meta[@itemprop="uploadDate"]/@content
        postProcess:
          - replace:
              - regex: (?:T.+)
                with:
      URLs: //link[@rel="canonical"]/@href
      Details: //meta[@itemprop="description"]/@content
      Performers:
        Name: //ul[@class="scene-models-list"]//a
      Tags:
        Name: //ul[@class="scene-tags"]//li
      Image: //meta[@itemprop="thumbnailUrl"]/@content
      Studio:
        Name:
          selector: //link[@rel="canonical"]/@href
          postProcess:
            - replace:
                - regex: ^https?://(?:www\.)?([^./]+)\..*$
                  with: $1
            - map:
                privateblack: Private Black
                privatecastings: Private Castings
  performerScraper:
    common:
      $performerData: //div[contains(concat(' ',normalize-space(@class),' '),' pornstar-wrapper ')]
    performer:
      Name: $performerData//h1
      URLs: //meta[@property="og:url"]/@content
      Aliases: //em[text()="Aka:"]/../text()
      Details: //li[@class="model-facts-long"]/div
      Measurements:
        selector: //em[text()="Measurements:"]/../text()
        postProcess:
          - map:
              -: ""
      Height:
        selector: //em[text()="Height:"]/../text()
        postProcess:
          - replace:
              - regex: (\d+)cm.+
                with: $1
          - map:
              -: ""
      Weight:
        selector: //em[text()="Weight:"]/../text()
        postProcess:
          - replace:
              - regex: (\d+)kg.+
                with: $1
          - map:
              -: ""
      Country: //em[text()="Nationality:"]/../text()
      HairColor: //em[text()="Hair Color:"]/../text()
      EyeColor:
        selector: //em[text()="Eye color:"]/../text()
        postProcess:
          - map:
              -: ""
      Tattoos:
        selector: //em[text()="Tattoos:"]/../text()
        postProcess:
          - map:
              -: ""
      Piercings:
        selector: //em[text()="Piercings:"]/../text()
        postProcess:
          - map:
              -: ""
      Images: $performerData//img/@data-src
      Gender:
        selector: //em[text()="Measurements:"] | //html[not(//em[text()="Measurements:"])]/@lang
        postProcess:
          - map:
              "Measurements:": Female
              en: Male
driver:
  cookies:
    - CookieURL: https://private.com
      Cookies:
        - Name: "customLang"
          Domain: ".private.com"
          Value: "en"
          Path: "/"
        - Name: "agreed18"
          Domain: ".private.com"
          Value: "true"
          Path: "/"
  headers:
    - Key: User-Agent
      Value: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:79.0) Gecko/20100101 Firefox/79.0)

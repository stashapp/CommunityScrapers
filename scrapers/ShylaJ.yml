name: ShylaJ
sceneByURL:
  - action: scrapeXPath
    url:
      - shylaj.com/shop/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - shylaj.com/shop/
    scraper: galleryScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: &title //div[@class="title_bar"]/span
      Date: &date
        selector: //div[@class="cell update_date"]
        postProcess:
          - parseDate: 01/02/2006
      Performers: &performers
        Name: //span[@class="update_models"]/a
      Tags: &tags
        Name: //span[@class="update_tags"]/a
      Details: &details //span[contains(@class, "update_description")]
      Image: //meta[@property="og:image"]/@content
      URLs:
        selector: //div[@class="player_options"]/div[contains(@class, "options_block")]/a[not(contains(@href, "type="))]/@href
        postProcess: &absoluteUrl
          - replace:
              - regex: ^
                with: https://shylaj.com/shop/
      Studio: &studio
        Name:
          fixed: ShylaJ
  galleryScraper:
    gallery:
      Title: *title
      Date: *date
      Performers: *performers
      Tags: *tags
      Details: *details
      Studio: *studio
      URLs:
        selector: //li[@class="active"]/a[contains(@href, "gallery.php")]/@href
        postProcess: *absoluteUrl

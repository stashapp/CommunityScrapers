name: AdultDvdMarketPlace
groupByURL:
  - action: scrapeXPath
    url:
      - adultdvdmarketplace.com/xcart/adult_dvd/dvd_view.php?adult_dvd_id=
      - adultdvdmarketplace.com/dvd_view
    scraper: movieScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.adultdvdmarketplace.com/search?type=title&search={}
  scraper: sceneSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - adultdvdmarketplace.com/dvd_view
    scraper: sceneScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  movieScraper:
    group:
      Name: &title //meta[@property="og:title"]/@content
      URLs: &urls //meta[@property="og:url"]/@content
      Director: &director //dt[text()="Director"]/following-sibling::dd[1]/a
      Date: &date
        selector: //dt[text()="Released"]/following-sibling::dd[1]
        postProcess:
          - replace:
              - regex: ^(\d{2})/(\d{4})$
                with: $2-$1
      Synopsis: &details //div[@x-ref="descBody"]/text()
      Studio: &studio
        Name: //dt[text()="Studio"]/following-sibling::dd[1]/a
      FrontImage: &image //meta[@property="og:image"]/@content
  sceneSearch:
    common:
      $result: //div[@x-show="view === 'list'"]/div
    scene:
      Title: $result//h3/a
      URLs:
        selector: $result//h3/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.adultdvdmarketplace.com
      Image: $result//img/@src
  sceneScraper:
    scene:
      Title: *title
      URLs: *urls
      Details: *details
      Date: *date
      Director: *director
      Image: *image
      Studio: *studio
      Performers:
        Name: //div[text()="Cast"]/following-sibling::p[1]/a
      Tags:
        Name: //dt[text()="Category"]/following-sibling::dd[1]/a

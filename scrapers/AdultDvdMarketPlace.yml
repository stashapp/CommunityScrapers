name: AdultDvdMarketPlace

groupByURL:
  - action: scrapeXPath
    url:
      - adultdvdmarketplace.com/xcart/adult_dvd/dvd_view.php?adult_dvd_id=
      - adultdvdmarketplace.com/dvd_view
    scraper: movieScraper

sceneByName:
  action: scrapeXPath
  queryURL: https://www.adultdvdmarketplace.com/xcart/adult_dvd/dvd_search.php?type=title&search={}
  scraper: sceneSearch

sceneByURL:
  - action: scrapeXPath
    url:
      - adultdvdmarketplace.com/dvd_view
    scraper: sceneScraper

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  movieScraper:
    group:
      Name: &title //meta[@property="og:title"]/@content
      URLs: &urls //meta[@property="og:url"]/@content
      Director: &director //span[contains(text(),"Director")]/following-sibling::a/text()
      Date: &date
        selector: //span[contains(text(),"Released")]/following-sibling::text()
        postProcess:
          - parseDate: 01/2006
      Synopsis: &details //h3[contains(text(), "Description")]/following-sibling::p
      Studio: &studio
        Name: //span[@itemprop="brand"]/text()
      FrontImage: &frontImage //a[contains(@href,"large_front_image")]/@href
      BackImage:
        selector: *frontImage
        postProcess:
          - replace:
              - regex: large_front_image
                with: large_back_image

  sceneSearch:
    common:
      $selection: //div[contains(concat(' ',normalize-space(@class),' '),' product-col ')]
    scene:
      Title: $selection//h4/a
      URLs:
        selector: $selection//h4/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.adultdvdmarketplace.com
      Image: $selection//a/img/@src

  sceneScraper:
    scene:
      Title: *title
      Details: *details
      Date: *date
      Director: *director
      Image: *frontImage
      Studio: *studio
      Performers:
        Name: //h3[text()="Cast"]/following-sibling::a
      Tags:
        Name: //span[text()="Category:"]/following-sibling::a

driver:
  useCDP: true
  clicks:
    - xpath: //a[contains(text(), "ENTER")]

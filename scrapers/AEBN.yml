name: "AEBN"
performerByURL:
  - action: scrapeXPath
    url:
      - aebn.com/straight/stars
      - aebn.com/gay/stars
    scraper: performerScraper
sceneByURL:
  - action: scrapeXPath
    url: &urls
      - aebn.com/straight/movies
      - aebn.com/gay/movies
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url: *urls
    scraper: movieScraper
xPathScrapers:
  performerScraper:
    performer:
      Name: //div[contains(@class,"dts-star-name")]/h1
      Gender:
        selector: //li[@class="section-detail-list-item-gender"]/text()
        postProcess:
          - map:
              TS: transgender_female
      URLs: //link[@rel="canonical"]/@href | //section[contains(@class,"dts-star-details")]//a[i[contains(@class,"dts-icon-twitter")]]/@href
      Birthdate:
        selector: //div[contains(@class,"dts-star-attributes-bio")]//li[contains(.,"Birth Date")]
        postProcess:
          - replace:
              - regex: .+:\s(.+)
                with: $1
              - regex: "Sept"
                with: "Sep"
          - parseDate: Jan 2, 2006
      Height:
        selector: //li[@class="section-detail-list-item-height"]
        postProcess:
          - replace:
              - regex: .+\((\d+).+\)
                with: $1
      Weight:
        selector: //li[@class="section-detail-list-item-weight"]
        postProcess:
          - replace:
              - regex: .+\((\d+).+\)
                with: $1
      EyeColor: //li[@class="section-detail-list-item-eye-color"]/text()
      Ethnicity:
        selector: //li[@class="section-detail-list-item-ethnicity"]/text()
        postProcess:
          - map:
              White: Caucasian
      HairColor: //li[@class="section-detail-list-item-hair-color"]/text()
      Details: //div[contains(@class,"dts-star-bio")]
      Images:
        selector: //div[contains(@class,"dts-star-detail-avatar")]/picture/img[not(contains(@src,"gender_symbols"))]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
              - regex: \?.*$
                with: ""
  sceneScraper:
    scene:
      Title: &title //div[@class="dts-section-page-heading-title"]/h1
      URLs: &urls //link[@rel="canonical"]/@href
      Date: &date
        selector: //li[@class="section-detail-list-item-release-date"]/text()
        postProcess:
          - replace:
              - regex: "Sept"
                with: "Sep"
          - parseDate: Jan 2, 2006
      ProductionDate:
        selector: //a[@id="footerMovieSpecific2257Link"]/@href
        postProcess:
          - replace:
              - regex: .*\/movies\/(\d+).*
                with: "https://m.aebn.net/movie/2257/$1"
          - subScraper:
              selector: //div[contains(text(), "Production Date")]/span[@class="description"]
          - parseDate: Jan 2, 2006
      Details: &details //div[@class="dts-section-page-detail-description-body"]
      Director: &director
        selector: //li[@class="section-detail-list-item-director"]//a
        concat: ", "
      Duration: &duration //li[@class="section-detail-list-item-duration"][contains(span,"Running Time")]/text()
      Studio: &studio
        Name: //li[@class="section-detail-list-item-studio"]//a
      Performers:
        Name: //div[contains(@class,"movie-meta-information")]//a[contains(@class,"dts-movie-star-wrapper")]
      Tags: &tags
        Name: //div[contains(@class,"dts-detail-movie-categories-content")]/a
      Image: &image
        selector: //img[contains(@class,"dts-modal-boxcover-front")]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
  movieScraper:
    group:
      Name: *title
      URLs: *urls
      Director: *director
      Duration: *duration
      Date: *date
      Synopsis: *details
      Studio: *studio
      Tags: *tags
      FrontImage: *image
      BackImage:
        selector: //img[contains(@class,"dts-modal-boxcover-back")]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
driver:
  cookies:
    - CookieURL: "https://vod.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "vod.aebn.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://gay.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "gay.aebn.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://straight.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "straight.aebn.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://m.aebn.net"
      Cookies:
        - Name: "ageGated"
          Domain: "m.aebn.net"
          Value: "true"
          Path: "/"

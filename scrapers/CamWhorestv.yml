name: CamWhores.tv
sceneByURL:
  - action: scrapeXPath
    url:
      - camwhores.tv
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $info: //div[@id="tab_video_info"]
    scene:
      Title: //meta[@property="og:title"][$info]/@content
      URLs: //link[@rel="canonical"][$info]/@href
      Image: //meta[@property="og:image"][$info]/@content
      Details: //meta[@property="og:description"][$info]/@content
      # TODO: enable when scrape dialog can show durations
      # Duration: $info//span[starts-with(normalize-space(), "Duration")]/em
      Tags:
        Name: $info//a[contains(@href, "/tags/")] | $info//a[contains(@href, "/categories/")]
      Performers:
        Name: $info//a[contains(@href, "/models/")]
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper

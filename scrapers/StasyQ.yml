name: "StasyQ"
sceneByURL:
  - action: scrapeXPath
    url:
      - stasyq.com/r/
      - stasyq.com/releases/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - stasyq.com/models/
    scraper: performerScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.stasyq.com/search?q={}
  scraper: performerSearch
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //div[contains(@class,"release-card__title")]/h1
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Details: //div[@class="about-section__text"]
      Image: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: StasyQ
      Tags:
        Name: //div[contains(@class,"about-section__title-text")]//a[@class="tag"]
      Performers:
        Name: //div[@class="release-card__model"]//a[@class="custom-link-footer"]
        URLs: //div[@class="release-card__model"]//a[@class="custom-link-footer"]/@href
      URLs: //link[@rel="canonical"]/@href
  performerSearch:
    performer:
      Name: //div[@class="model-preview-card__info"]//a[contains(@href,'/models/')]
      URLs: //div[@class="model-preview-card__info"]//a[contains(@href,'/models/')]/@href
  performerScraper:
    performer:
      Name: //li[@itemtype="https://www.stasyq.com/models/modelItem"]//span[@itemprop="name"]
      Aliases:
        selector: //li[p[text()="Name:"]]/p[@class="ml-auto"]
        postProcess:
          - replace:
              - regex: ^([^(]+)\(.*$
                with: $1
      Country: //li[p[text()="Nationality:"]]/p[@class="ml-auto"]
      Height:
        selector: //li[p[text()="Height:"]]/p[@class="ml-auto"]
        postProcess:
          - replace:
              - regex: ^(\d+).*$
                with: $1
      Weight:
        selector: //li[p[text()="Weight:"]]/p[@class="ml-auto"]
        postProcess:
          - replace:
              - regex: ^(\d+).*$
                with: $1
      Image: //div[@class="model-card__img"]/img/@src
      Details: //div[@class="model-bio__text"]
      URLs: //link[@rel="canonical"]/@href
driver:
  cookies:
    - CookieURL: "https://www.stasyq.com/"
      Cookies:
        - Name: stasyq_session
          Domain: ".stasyq.com"
          Path: "/"
          Value: "%3D"

name: X-Art
sceneByURL:
  - action: scrapeXPath
    url:
      - x-art.com/videos/
      - x-art.com/members/videos/
    scraper: sceneScraper
    # the members path needs a login but the same scenes are publically available
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: /members/
          with: /

galleryByURL:
  - action: scrapeXPath
    url:
      - x-art.com/galleries/
    scraper: galleryScraper

xPathScrapers:
  sceneScraper:
    common:
      $info: //div[contains(@class, "columns info")]
      $featuring: //div[contains(@class, "columns info")]/h2[span[contains(., "featuring")]]
    scene:
      Title: //div[contains(@class, "vid-title")]/h1 | //div[@class="row info"]//h1
      Date:
        selector: $featuring/preceding-sibling::h2[1]
        postProcess:
          - parseDate: Jan 02, 2006
      Details:
        selector: $info/p[normalize-space()]
        concat: "\n\n"
      Performers:
        # scenes with no credited model still render an empty link
        Name: $featuring/a[normalize-space()]
        URLs: $featuring/a[normalize-space()]/@href
      Image: //div[contains(@class, "flex-video")]//img[not(contains(@class, "start"))]/@src
      Studio:
        Name:
          fixed: X-Art

  galleryScraper:
    common:
      $info: //div[contains(@class, "columns info")][h2]
      $models: //div[contains(@class, "columns info")]/h2[span[contains(., "Model")]]
    gallery:
      Title: $info/h1
      Date:
        selector: $info/h2[span[contains(., "Date")]]/text()
        postProcess:
          - parseDate: Jan 02, 2006
      Details:
        # the first paragraph is members-only download boilerplate
        selector: $info//div[contains(@class, "description-format")]/p[normalize-space()][not(.//a[contains(@href, "/members/")])] | $info/p[@id="desc"]
        concat: "\n\n"
      Performers:
        Name: $models/a
        URLs: $models/a/@href
      Studio:
        Name:
          fixed: X-Art

name: "sweetfemdom"
sceneByURL:
  - action: scrapeXPath
    url:
      - sweetfemdom.com/detail/
      - sweetfemdom.com/videos/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Date:
        selector: //div[@class="detail-stats"]/span[i[contains(@class,"fa-calendar")]]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: //div[contains(@class,"detail-desc")]
      Tags:
        Name: //div[@class="detail-niches"]/a
      Performers:
        Name: //div[@class="detail-cast"]/a/span
      Image: //meta[@property="og:image"]/@content

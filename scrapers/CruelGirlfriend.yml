name: Cruel Girlfriend
sceneByURL:
  - action: scrapeXPath
    url:
      - cruelgf.com/Clip.php
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://cruelgf.com/Clip.php?clip_no={filename}
  queryURLReplace:
    filename:
      - regex: ^(\d+).mp4$
        with: $1
      - regex: .*[a-z]CG(\d+)H?.mp4
        with: $1
xPathScrapers:
  sceneScraper:
    common:
      $script: //script[@type="application/ld+json"]
    scene:
      Title: //div[@class="media-video-copy"]/h3
      Date:
        selector: //span[contains(text(),"Added:")]
        postProcess:
          - replace:
              - regex: "Added:\\s(\\d{2}-\\d{2}-\\d{4})"
                with: "$1"
          - parseDate: "02-01-2006"
      Performers:
        Name: //div[@class="media-video-copy"]/p
      Details:
        selector: //div[@class="clip-description"]/text()
        concat: "\n\n"
      Tags:
        Name: //a[contains(@href,"category=")]
      Image:
        selector: //img[@id="videoPosterOverlay"]/@src
        postProcess:
          - replace:
              - regex: ^
                with: https://cruelgf.com/
      Studio:
        Name:
          fixed: Cruel Girlfriend
      Code:
        selector: $script
        postProcess:
          - replace:
              - regex: '.+"contentUrl": "[^"]+/(\d+)\.mp4".+'
                with: $1
              - regex: "^{.+" #cleanup on non matches
                with:

name: "AmateureXtreme"
sceneByURL:
  - action: scrapeXPath
    url:
      - amateure-xtreme.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class='info-section--title']
      URL: //link[@rel="canonical"]/@href
      Date: //span[@title='Production year']/span[@class='fa5-text']
      Tags:
        Name: //a[contains(@href,'collections?')]
      Performers:
        Name: //span[@class='models']/span[@class='fa5-text']/a
      Studio:
        Name:
          fixed: AmateureXtreme
      Image:
        selector: //script
        postProcess:
          - replace:
              - regex: .+image":\["(.+)\?.+
                with: $1

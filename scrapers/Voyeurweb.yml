name: HomeClips
sceneByURL:
  - action: scrapeXPath
    url:
      - www.funbags.com/contributions/view/
      - www.homeclips.com/contributions/view/
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.homeclips.com/contributions/view/{filename}
  scraper: sceneScraper
  queryURLReplace:
    filename:
      - regex: ^.*[/\\](\d*)-\d*\..*
        with: $1

xPathScrapers:
  sceneScraper:
    common:
      $self: //textarea[@name="request"]
    scene:
      Title: //p[@class="contribution-title"]
      Date:
        selector: //p[@class="posted-date"]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: //p[@class="contribution-text"]
      URLs: $self
      Tags:
        Name: //div[@class="contribution-tags"]/a
      Image: //div[@class="contri-photos"]//img/@src
      Studio:
        Name:
          selector: //title
          postProcess:
            - replace:
                - regex: ^.* at (\S+)$
                  with: $1
        URL:
          selector: $self
          postProcess:
            - replace:
                - regex: ^(https?://[^/]+/).*$
                  with: $1

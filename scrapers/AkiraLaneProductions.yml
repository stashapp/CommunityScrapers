name: AkiraLaneProductions
sceneByURL:
  - action: scrapeXPath
    url:
      - akiralane.com/tour/
      - akiralanebound.com/tour/
      - nikkiphoenixxx.com/tour/
      - pantyhoselane.com/tour/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Details: //div[@class="videocontent"]/p
      Image:
        selector: >-
          //base/@href | //script[contains(., "poster")] |
          //img[contains(@class, "update_thumb thumbs stdimage")][not(//script[contains(., "poster")])]/@src0_1x
        concat: __SEP__
        postProcess:
          - replace:
              - regex: .*/$
                with: ""
              - regex: ^.*(https://[^/]+).+src0_1x="([^"]+)-1x\.jpg".+
                with: ${1}${2}-full.jpg
              - regex: ^(https?://[^/]+)[^_]*__SEP__(/.+?)(?:-1x)?\.jpg$
                with: ${1}${2}-full.jpg
      Date:
        selector: //div[@class="videodetails"]/p[@class="date"]
        postProcess:
          - replace:
              - regex: "^([0-9/]+).*"
                with: $1
          - parseDate: 01/02/2006
      Tags:
        Name: //div[@class="videodetails"]//a[contains(@href,"categories")]
      Performers:
        Name:
          selector: //span[@class="tour_update_models"]/a | //p[@class="modelname"]/comment()
          concat: "|"
          postProcess:
            - replace:
                # Try to extract model names from comment
                # https://regex101.com/r/IF0T90/1
                - regex: .*?>([A-Z][^<>]+).*?(:?</a>\s*</span>\s*-->)?
                  with: "$1|"
                # Default to Akira Lane if the comment is empty (it's hardcoded in the site as well)
                - regex: "<!-- -->"
                  with: "Akira Lane"
          split: "|"
      Studio:
        Name:
          selector: //base/@href
          postProcess:
            - replace:
                - regex: ^.*https://(www\.)?([^\.]+).+
                  with: $2
            - map:
                akiralane: Akira Lane
                akiralanebound: Akira Lane Bound
                nikkiphoenixxx: Nikki Phoenix Official Site
                pantyhoselane: Pantyhose Lane

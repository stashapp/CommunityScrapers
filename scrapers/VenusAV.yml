name: VenusAV
sceneByURL:
  - action: scrapeXPath
    url:
      - venus-av.com/products
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class='hero']/h1
      Details: //dt[contains(.,'作品紹介')]/following-sibling::dd[1]
      Date:
        selector: //dt[contains(.,'発売日')]/following-sibling::dd[1]
        postProcess:
          - parseDate: 2006年1月2日
      Performers:
        Name: >-
          //dt[contains(.,'出演女優')]/following-sibling::dd[1]//a |
          //dt[contains(.,'出演女優')]/following-sibling::dd[1][not(.//a)]
      Image:
        selector: //div[@class='productsImg']//img/@src
        postProcess:
          - replace:
              - regex: ^
                with: https://www.venus-av.com/
      Code: //dt[contains(.,'品番')]/following-sibling::dd[1]
      Studio:
        Name: //dt[contains(.,'レーベル')]/following-sibling::dd[1]

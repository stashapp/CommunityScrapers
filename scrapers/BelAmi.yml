name: BelAmi
sceneByURL:
  - action: scrapeXPath
    url:
      - belamionline.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - belamionline.com/movie_detail.aspx
    scraper: movieScraper
performerByURL:
  - action: scrapeXPath
    url:
      - belamionline.com
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    common:
      $performer: //div[@class="actors_list"]//a[div[@class="name"]]
      $scene: //*[@id="ContentPlaceHolder1_LabelTitle"]
    scene:
      Title: $scene
      Details:
        selector: >-
          //p[span[@id="ContentPlaceHolder1_LabelDescription"]]/following-sibling::p
          | //span[@id="ContentPlaceHolder1_LabelDescription"][normalize-space()]
          | //p[span[@id="ContentPlaceHolder1_LabelDescription"]]/following-sibling::p//br/following-sibling::node()[1]
          | //span[@id="ContentPlaceHolder1_LabelDescription"]//br/following-sibling::node()[1]
        concat: "\x01"
        postProcess:
          # Because Stash doesn't respect internal whitespace when it converts
          # nodes to text we need to do our own little hack to reconstruct the details
          - javascript: |
              if (!value) return "";
              var parts = [];
              value.split("\x01").forEach(function (p) {
                p = p.trim();
                if (p) parts.push(p);
              });
              // a part wholly inside a longer one is a <br> anchor, not a block
              var blocks = parts.filter(function (p) {
                return !parts.some(function (q) {
                  return q.length > p.length && q.indexOf(p) !== -1;
                });
              });
              var anchors = parts.filter(function (p) {
                return blocks.indexOf(p) === -1;
              });
              var out = [];
              blocks.forEach(function (full) {
                var cuts = [0];
                anchors.forEach(function (a) {
                  var at = full.indexOf(a);
                  if (at > 0 && at === full.lastIndexOf(a)) cuts.push(at);
                });
                cuts.sort(function (a, b) { return a - b; });
                for (var i = 0; i < cuts.length; i++) {
                  var end = i + 1 < cuts.length ? cuts[i + 1] : full.length;
                  var block = full.slice(cuts[i], end).trim();
                  if (block) out.push(block);
                }
              });
              return out.join("\n\n");
      Date:
        selector: //*[@id="ContentPlaceHolder1_LabelReleased"]
        postProcess:
          - parseDate: 1/2/2006
      URLs: //link[@rel="canonical"][$scene]/@href
      Image: //meta[@property="og:image"][$scene]/@content
      Studio:
        Name:
          selector: $scene
          postProcess:
            - replace:
                - regex: ^.+$
                  with: BelAmi
      Performers:
        Name: $performer/div[@class="name"]
        URLs:
          selector: //meta[@property="og:url"][$scene]/@content | $performer/@href
          concat: "|"
          postProcess:
            - javascript: |
                const [page, ...models] = value.split("|");
                const base = page.replace(/[^/]*$/, "");
                return models.map((m) => base + m).join("|");
          split: "|"
      Tags:
        Name:
          selector: //*[@id="ContentPlaceHolder1_LabelTags"]/a
          postProcess: &tagMap
            - map:
                Castings: "Casting"
                Condom Free: "No Condom"
                Condom Free Archive: "No Condom"
                Condom Archive: "Condom"
                Photosession Videos: "Photoshoot"
                Oral: "Blowjob"
                Orgies: "Orgy (Gay)"
                Remastered: "Remaster"
                Solos: "Solo Male"
                Sex Scenes: "Gay"
                Three Way: "Threesome (Gay)"
      Code:
        selector: //form[@method="post"][$scene]/@action
        postProcess:
          - replace:
              - regex: .*VideoID=(\d+).*
                with: $1
  movieScraper:
    common:
      $movie: //div[@class="movie_h"]
    group:
      Name: $movie/h1
      Synopsis: $movie/p
      Date:
        selector: //script[@type="application/ld+json"][contains(., "datePublished")]
        postProcess:
          - replace:
              - regex: .*"datePublished":"(\d{4}-\d{2}-\d{2})".*
                with: $1
      Duration:
        selector: $movie/small
        postProcess:
          - javascript: |
              const h = /(\d+)\s*h/.exec(value);
              const m = /(\d+)\s*m/.exec(value);
              if (!h && !m) return "";
              return [h ? h[1] : 0, m ? m[1] : 0, 0]
                .map((n) => String(n).padStart(2, "0"))
                .join(":");
      URLs: //meta[@property="og:url"][$movie]/@content
      Tags:
        Name:
          selector: //div[contains(@class, "tags")][$movie]/a
          postProcess: *tagMap
      Studio:
        Name:
          selector: $movie/h1
          postProcess:
            - replace:
                - regex: ^.+$
                  with: BelAmi
      FrontImage: //div[@class="movie_poster"]/img[not(contains(@class, "poster_back"))]/@src
      BackImage: //div[@class="movie_poster"]/img[contains(@class, "poster_back")]/@src
  performerScraper:
    common:
      $model: //div[@class="head top_head"]/h1
    performer:
      Name: $model
      URLs: //link[@rel="canonical"][$model]/@href
      Gender:
        selector: $model
        postProcess:
          - replace:
              - regex: ^.+$
                with: Male
      HairColor: //td[contains(text(), "Hair color:")]/following-sibling::td
      EyeColor: //td[contains(text(), "Eye color:")]/following-sibling::td
      Weight: //td[contains(text(), "Weight:")]/following-sibling::td
      Height: //td[contains(text(), "Height:")]/following-sibling::td
      PenisLength: //td[contains(text(), "Dick size:")]/following-sibling::td
      Details: //div[@class="model_des"]
      Images: //div[@class="main_card"]//div[@class="img"]/img[$model]/@src

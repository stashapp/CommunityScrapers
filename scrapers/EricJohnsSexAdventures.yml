name: EricJohnsSexAdventures
sceneByURL:
  - action: scrapeXPath
    url:
      - ericjohnssexadventures.com/trailers/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h2[@class="section-title"]
      URLs: //link[@rel="canonical"]/@href
      Details: //h3[contains(.,"Description:")]/following-sibling::text()
      Performers:
        Name: //div[contains(@class,"models-list-thumbs")]//a/span
      Tags:
        Name: //ul[@class="tags"]/li/a
      Image:
        selector: //img[contains(@class,"update_thumb")]/@src0_1x
        postProcess:
          - replace:
              - regex: '(-[1-4]x)?\.jpg$'
                with: "-full.jpg"
              - regex: ^
                with: "https://www.ericjohnssexadventures.com"
      Studio:
        Name:
          fixed: Eric John's Sex Adventures

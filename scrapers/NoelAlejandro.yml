name: NoelAlejandro
sceneByURL:
  - action: scrapeXPath
    url:
      - noelalejandrofilms.com/product
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //meta[@property="og:title"]/@content
      Image:
        selector: //meta[@property="og:image"]/@content
      Date:
        selector: //script[@class="yoast-schema-graph"]
        postProcess:
          - replace:
              - regex: .+datePublished\"\:\"(\d{4}-\d{2}-\d{2}).+
                with: $1
      Director:
        selector: //li[contains(.,"Director:")]
        postProcess:
          - replace:
              - regex: ^\s*Director:\s*
                with: ""
      Details:
        selector: //div[@class="film-prologue"]/p[not(a)] | //div[@class="film-prologue"]/div[@class="collapse"]/p
        concat: "\n\n"
      Performers:
        Name:
          selector: //li[contains(.,"Cast:")]/a
      Studio:
        Name:
          fixed: Noel Alejandro Films

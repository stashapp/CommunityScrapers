name: "HarmonyVision"
sceneByURL:
  - action: scrapeXPath
    url:
      - harmonyvision.com/watch/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="gqHeading"]/span[@class="gqText"]
      Details: //div[@class="gqHeading"]/span[@class="gqSubtitle"]
      Image:
        selector: //div[@class="gqVideoPlayer"]/@style
        postProcess:
          - replace:
              - regex: ^.*url\(([^)]+)\).*$
                with: $1
      Studio:
        Name:
          fixed: HarmonyVision

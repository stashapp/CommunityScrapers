name: Secret Circle
sceneByURL:
  - action: scrapeJson
    url:
      - secretcircle.com/seksfilms/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^.*/seksfilms/([^/?#]+).*$
          with: https://apiv2.sysero.nl/api/sc/resource/${1}/nl?query=(content%3Avideo%2Cinclude%3A((resources%3A(filters%3A((types%3A(0%3Amodel)%2Cstatus%3Apublished)))%2Cimages%3A())))

jsonScrapers:
  sceneScraper:
    scene:
      Title: data.title
      Details:
        selector: data.description
        postProcess:
          - javascript: |
              const entities = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: " " };
              return value
                .replace(/<\/p>\s*<p[^>]*>/gi, "\n\n")
                .replace(/<br\s*\/?>/gi, "\n")
                .replace(/<[^>]+>/g, "")
                .replace(/&(#x?[0-9a-f]+|\w+);/gi, (m, e) =>
                  e[0] === "#"
                    ? String.fromCodePoint(e[1].toLowerCase() === "x" ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10))
                    : entities[e.toLowerCase()] ?? m)
                .trim();
      Date:
        selector: data.active_from
        postProcess:
          - replace:
              - regex: ^(\S+).*$
                with: $1
      Image:
        selector: data.images.data.cover.0.path
        postProcess:
          - replace:
              - regex: ^
                with: https://cdndo.sysero.nl
      Performers:
        Name: data.resources.data.#(type=="model")#.title
      URLs:
        selector: data.slug
        postProcess:
          - replace:
              - regex: ^
                with: https://secretcircle.com/seksfilms/
      Studio:
        Name:
          fixed: Secret Circle

driver:
  headers:
    - Key: credentials
      Value: sysero 1-1842ebdd9ddf148123a0402dfc1a2a0f7360e8477db22f871c8aa7bef230b6de-sc
    - Key: checkdomain-header
      Value: https://secretcircle.com
    - Key: User-Agent
      Value: stash-scraper/1.0

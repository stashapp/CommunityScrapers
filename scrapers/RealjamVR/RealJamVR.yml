# requires: py_common
name: RealJamVR
sceneByName:
  action: script
  script:
    - python
    - RealJamVR.py
    - scene-by-name
sceneByQueryFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: "{url}"
sceneByURL: &byURL
  - action: scrapeXPath
    url:
      - realjamvr.com/scene/
      - porncornvr.com/scene
    scraper: sceneScraper

galleryByURL: *byURL

performerByURL:
  - action: scrapeXPath
    url:
      - porncornvr.com/actor/
      - realjamvr.com/actor/
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: &title
        selector: //h1
        postProcess:
          - replace:
              - regex: ^\s+(.+)\s+$
                with: $1
      URLs:
        selector: //img[contains(@src, "address.png")]/@alt | //a[@class='btn btn-m1']/@href
        concat: "|"
        postProcess:
          - replace:
              - regex: (.+)\|.+\?next=(.+)
                with: https://$1.com$2
          - javascript: |
              return value.toLowerCase()
      Date: &date
        selector: //script[@type="application/ld+json" and contains(., "VideoObject")]
        postProcess:
          - javascript: |
              return JSON.parse(value).uploadDate.split("T")[0]
      Performers: &performers
        Name:
          selector: //script[@type="application/ld+json" and contains(., "VideoObject")]
          postProcess:
            - javascript: |
                return JSON.parse(value).actor.map(a => a.name).join(", ")
          split: ", "
      Tags: &tags
        Name:
          selector: //a[starts-with(@href, "/scenes") and @class="tag"] | //div[not(@class)]/div[@class="specs-icon"]
          postProcess:
            - replace:
                - regex: \d+:\d+:\d+
                  with: Virtual Reality
      Details: &details //div[contains(@class, "collapse-content-wrapper")]/div[contains(@class, "collapse-content")]
      Image: //*[@id="video-player"]//@poster
      Studio: &studio
        Name:
          selector: //title
          postProcess:
            - replace:
                - regex: '(.*)\| ([^\|]+VR)$'
                  with: $2
    gallery:
      Title: *title
      Date: *date
      Performers: *performers
      Tags: *tags
      Details: *details
      Studio: *studio
  performerScraper:
    performer:
      Name: //h1
      Gender: //div[span[text()="Gender:"]]/text()
      Country:
        selector: //div[span[text()="Birth Place:"]]/text()
        postProcess:
          - replace:
              - regex: .*,
                with: ""
      Birthdate:
        selector: //div[span[text()="Date of Birth:"]]/text()
        postProcess:
          - parseDate: Jan. 2, 2006
          - parseDate: January 2, 2006
      Height:
        selector: //div[span[text()="Height:"]]/text()
        postProcess:
          - replace:
              - regex: .*\ (\d+)\ cm.*
                with: $1
      Weight:
        selector: //div[span[text()="Weight:"]]/text()
        postProcess:
          - replace:
              - regex: .*\ (\d+)\ kg.*
                with: $1
      HairColor: //div[span[text()="Hair color:"]]/text()
      EyeColor: //div[span[text()="Eyes color:"]]/text()
      Tags:
        Name: //div[span[text()="Tags:"]]/a
      Images: //div[contains(@class, "actor-view")]//img/@src
      Piercings: //div[span[text()="Piercing:"]]/text()
      Tattoos: //div[span[text()="Tattoo:"]]/text()

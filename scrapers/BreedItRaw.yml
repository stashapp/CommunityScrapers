name: BreedItRaw
sceneByURL:
  - action: scrapeXPath
    url:
      - breeditraw.net/tour/trailers/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - breeditraw.net/tour/models/
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    common:
      $performer: //li[@class="update_models"]/a
    scene:
      Title: //div[@class="videoDetails clear"]//h3/text()
      Date:
        selector: //span[contains(., "Date Added:")]/following-sibling::text()
        postProcess:
          - replace:
              - regex: ^\s*
                with:
          - parseDate: January 2, 2006
      Details: //div[@class="videoDetails clear"]/p
      Tags:
        Name: //li[contains(text(), "Tags:")]/following-sibling::li/a/text()
      Performers:
        Name: $performer
        URLs: $performer/@href
      Image:
        selector: >-
          //img[@class="update_thumb thumbs stdimage"][@src0_4x]/@src0_4x |
          //img[@class="update_thumb thumbs stdimage"][@src0_3x][not(@src0_4x)]/@src0_3x |
          //img[@class="update_thumb thumbs stdimage"][@src0_2x][not(@src0_3x)][not(@src0_4x)]/@src0_2x |
          //img[@class="update_thumb thumbs stdimage"][@src0_1x][not(@src0_2x)][not(@src0_3x)][not(@src0_4x)]/@src0_1x |
          //script[contains(text(),"poster")]/text()
        postProcess:
          - replace:
              - regex: '.+poster="([^"]+)".+'
                with: $1
              - regex: ^/
                with: https://www.breeditraw.net/
              - regex: (1|2|3|4)x\.jpg
                with: "full.jpg"
      Studio:
        Name:
          fixed: Breed it Raw
  performerScraper:
    performer:
      Name:
        selector: //meta[@property="og:title"]/@content
        postProcess:
          - replace:
              - regex: \s*-\s*.*$
                with:
      Gender:
        fixed: Male
      Height:
        selector: //strong[contains(., "Height:")]/following-sibling::text()
        postProcess:
          - feetToCm: true
      Weight:
        selector: //strong[contains(., "Weight:")]/following-sibling::text()
        postProcess:
          - lbToKg: true
      Measurements:
        selector: //strong[contains(., "Dick Size:")]/following-sibling::text()
        postProcess:
          - replace:
              - regex: ^
                with: 0'
          - feetToCm: true
      Image:
        selector: //div[@class="profile-pic"]/img/@src0_2x # 3x is either too big or an upscale so imho not worth it
        postProcess:
          - replace:
              - regex: ^
                with: https://www.breeditraw.net/
              - regex: (1|2|3|4)x\.jpg
                with: "full.jpg"

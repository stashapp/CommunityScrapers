name: "StripzVR"
sceneByURL:
  - action: scrapeJson
    url:
      - stripzvr.com
    queryURL: &sceneQuery "https://www.stripzvr.com/wp-json/wp/v2/pages?_embed=up&slug={url}"
    queryURLReplace: &sceneQueryReplace
      url:
        - regex: "^.*/([^/]+)/?$"
          with: $1
    scraper: sceneScraper
groupByURL:
  - action: scrapeJson
    url:
      - stripzvr.com
    queryURL: *sceneQuery
    queryURLReplace: *sceneQueryReplace
    scraper: movieScraper
jsonScrapers:
  sceneScraper:
    scene:
      Title: 0.yoast_head_json.og_title
      Date: &dateSel
        selector: 0.date_gmt
        postProcess:
          - parseDate: "2006-01-02T15:04:05"
      Details: 0.yoast_head_json.og_description
      Studio:
        Name: &studioName 0.yoast_head_json.og_site_name
      Performers:
        Name:
          selector: 0._embedded.up.0.title.rendered
          postProcess:
            - javascript: |
                const named = { amp: "&", quot: '"', apos: "'", nbsp: " ", hellip: "…" };
                const decoded = value.replace(/&(#\d+|amp|quot|apos|nbsp|hellip);/g, (m, e) =>
                  e[0] === "#" ? String.fromCharCode(parseInt(e.slice(1), 10)) : (named[e] || m)
                );
                return decoded.replace(/\s*[-–—]\s*Tour$/, "");
        URLs: 0._embedded.up.0.link
      Image: 0.yoast_head_json.og_image.0.url
      Groups:
        Name: 0.yoast_head_json.og_title
        Date: *dateSel
        URLs: 0.link
  movieScraper:
    group:
      Name: 0.yoast_head_json.og_title
      Date: *dateSel
      Studio:
        Name: *studioName
      Synopsis: 0.yoast_head_json.og_description
      FrontImage: 0.yoast_head_json.og_image.0.url

name: JacquieEtMichelStars
sceneByURL:
  - action: scrapeXPath
    url:
      - jacquieetmichelstars.com
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[contains(@class,"content-detail__title")]
      Details: //div[contains(@class,"content-detail__description")]
      Image: //meta[@property="og:image"]/@content
      Date:
        selector: //div[contains(@class,"content-detail__infos__el") and contains(.,"Publication date")]/p
        postProcess:
          - parseDate: January 2, 2006
      Performers:
        Name: //li[contains(@class,"content-detail__tag")]/a[contains(@href,"/actors/")]
      Studio:
        Name:
          fixed: Jacquie et Michel Stars
      Tags:
        Name: //li[contains(@class,"content-detail__tag")]/a[contains(@href,"/tags/")]

    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      # Many different versions of the same tour pages
      # selectors must work across all of them
      Title: >-
        //div[@class="update_title"]
        | //div[@class="indScene"]/h1
        | //div[@class="indScene"]/h2
        | //div[@class="trailerMInfo"]/h2
      Date:
        selector: >-
          //div[@class="cell update_date"]
          | //div[@class="sceneDateP"]/span[1]
          | //div[contains(@class,"released2")]
        postProcess:
          - replace:
              - regex: Released:\s
                with:
              - regex: ^(\d{2}/\d{2}/\d{4}).+
                with: $1
          - parseDate: 01/02/2006
      Details: >-
        //span[@class="update_description"]
        | //div[@class="description"]/p[contains(span,"Description:")]
        | //div[@class="description"]/h2
        | //div[@class="videoDetails"]/p
      Tags:
        Name: //span[@class="update_tags"]/a/text()
      Performers:
        Name: >-
          //span[@class="update_models"]/a
          | //div[@class="sceneTextLink"]/p/span[@class="tour_update_models"]/a
          | //div[@class="trailerMInfo"]//div[contains(@class,"textLink")]/p/span[@class="tour_update_models"]/a
      Image: >-
        //video[@id]/@poster
        | //img[@alt="Join Today!" and not(//video[@id]/@poster)]/@src
      Studio:
        Name:
          selector: //base/@href
          postProcess:
            - replace:
                - regex: .*/(tour_[a-z0-9]+)/?$
                  with: $1
                # Retired tours redirect to a join funnel with no tour_ segment:
                # blank it so Stash is not offered a URL as a studio name
                - regex: ^https?://.*
                  with: ""
            - map:
                tour_ab: Ashlynn Brooke
                tour_famxxx: FamilyXXX
                tour_ffc: Four Finger Club
                tour_fohs: Fresh Out Of Highschool
                tour_girlgirlxxx: Girl Girl XXX
                tour_hh: Heavy Handfuls
                tour_hwxxx: Hot Wife XXX
                tour_jb: Jizz Bomb
                tour_pp: Parody Pass
                tour_rs: The Romance Series
                tour_sdbb: Shane Diesel's Bangin Babes
                tour_sdxxx: Shane Diesel's Bangin Babes
                tour_sos: Stretched Out Snatch
                tour_tle: The Lesbian Experience
                tour_tt: The Tabu Tales

name: Heyzo-JP
sceneByURL:
  - action: scrapeXPath
    url:
      - www.heyzo.com/moviepages
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.heyzo.com/moviepages/{filename}
  # constructs the movie URL from the filename, provided that the filename includes the movie id
  queryURLReplace:
    filename:
      # heyzo uses a 4 digit number for ids, preferred next to the brand token
      # so a resolution or year elsewhere in the name cannot win
      - regex: (?i).*heyzo\D*(\d{4}).*
        with: $1/index.html
      - regex: (.*[^a-zA-Z\d])*(\d{4})[^a-zA-Z\d].*
        with: $2/index.html
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $table: //div[@class="info-bg"]/table/tbody/tr
      $metadata: //div[@id="movie"]/script[@type="application/ld+json"]
    scene:
      Title:
        selector: $metadata
        postProcess:
          - javascript: |
              return JSON.parse(value)?.name ?? null;
      URLs:
        selector: /html/head/meta[@property="og:url"]/@content
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
      Details: //p[@class="memo"]
      Date:
        selector: $table/td[contains(.,"Released") or contains(., "公開日")]/following-sibling::td
        postProcess:
          - parseDate: 2006-01-02
      Performers:
        Name: $table/td[contains(.,"Actress") or contains(.,"出演")]/following-sibling::td/a/span
      Code:
        selector: //script[contains(.,"movieId =")]
        postProcess:
          - replace:
              - regex: .*movieId\s=\s\'(\d+)\'.*
                with: Heyzo-$1
      Tags:
        Name: //tr[@class="table-tag-keyword-small"]//ul[@class="tag-keyword-list"]/li
      Image:
        selector: /html/head/meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: .*(www.*jpg).*
                with: https://$1
      Studio:
        Name:
          fixed: Heyzo

name: MFVideoxx
sceneByURL:
  - action: scrapeXPath
    url:
      - mfvideoxxx.com/
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://mfvideoxxx.com/?s={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: "{url}"
sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://mfvideoxxx.com/{title}
  queryURLReplace:
    title:
      - regex: "[^0-9A-Za-z]"
        with: "-"
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Date:
        selector: //time
        postProcess:
          - parseDate: 02/01/2006
      Details: //div[@class="entry-content"]/p[span]
      Tags:
        Name: //div[@class="column2"]//a[@rel="category tag"]
      Performers:
        Name: //div[@class="column2"]//a[@rel="tag"]
      Image: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: MFVideoXXX
      URLs: //link[@rel="canonical"]/@href
  sceneSearch:
    common:
      $card: //article
    scene:
      Title: $card//h5
      Date:
        selector: $card//time[@class="entry-date published"]
        postProcess:
          - parseDate: 02/01/2006
      Image: $card//img[@class="attachment-post-thumbnail size-post-thumbnail wp-post-image"]/@src
      URLs: $card/div[1]/a/@href

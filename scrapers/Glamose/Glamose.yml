name: Glamose
sceneByURL:
  - action: scrapeXPath
    url:
      - damselsinperil.com
      - femmefight.com
      - f-f-fights.com
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class='info']/h2[@class='name']
      Details: //div[@class='info']/p/text()
      Tags:
        Name: //div[@class='extrainfo']//a[contains(@href,'search')]
      Performers:
        Name: //div[@class='modelstop']//text()
      Date:
        selector: //div[@class='date']
        postProcess:
          - parseDate: "Added: January 2, 2006"
      Image:
        selector: //div[@class='playerholder']//img/@src
        postProcess:
          - replace:
              - regex: ^
                with: https://damselsinperil.com/
      Studio:
        Name:
          selector: //img[starts-with(@src, "content/")]/@src
          postProcess:
            - replace:
                - regex: ^content/([^/]+)/.*
                  with: $1
            - map:
                DIP: Damsels in Peril
                FF: Femme Fight
                FFF: Fantasy Fetish Fights

# This is a sub-studio of Evil Erotic, but it has a separate search API, so it gets its own scraper.
name: TGirls House
performerByName:
  action: scrapeJson
  queryURL: "https://tgirlshouse.com/api/search?q={}"
  scraper: performerSearchScraper
performerByURL:
  - action: scrapeXPath
    url:
      - tgirlshouse.com/models/
    scraper: performerScraper
sceneByName:
  action: scrapeJson
  queryURL: "https://tgirlshouse.com/api/search?q={}"
  scraper: sceneSearchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - tgirlshouse.com/videos/
    scraper: sceneScraper
jsonScrapers:
  performerSearchScraper:
    performer:
      Name: models.#.name
      Images: models.#.image
      URLs:
        selector: models.#.slug
        postProcess:
          - replace:
              - regex: "^(.+)$"
                with: "https://tgirlshouse.com/models/${1}"
  sceneSearchScraper:
    scene:
      Title: videos.#.title
      Image: videos.#.image
      URLs:
        selector: videos.#.slug
        postProcess:
          - replace:
              - regex: "^(.+)$"
                with: "https://tgirlshouse.com/videos/${1}"
xPathScrapers:
  performerScraper:
    common:
      $info: //span[@class="model-info-label"
    performer:
      Name: //h1[@class="model-info-heading"]
      Images: //div[contains(@class, "model-info-photo")]/img/@src
      URLs: //meta[@property="og:url"]/@content
      Country: $info and text()="Country:"]/following-sibling::span
      Ethnicity: $info and text()="Ethnicity:"]/following-sibling::span
      Height:
        selector: $info and text()="Height:"]/following-sibling::span
        postProcess:
          - replace:
              - regex: (?i)(\d+)\s*cm.*
                with: $1
      Weight:
        selector: $info and text()="Weight:"]/following-sibling::span
        postProcess:
          - replace:
              - regex: (?i)(\d+)\s*kg.*
                with: $1
      PenisLength:
        selector: $info and text()="Endowment / Penis Size:"]/following-sibling::span
        postProcess:
          - replace:
              - regex: (?i)(\d+)\s*cm.*
                with: $1
      Gender:
        fixed: transgender_female
  sceneScraper:
    common:
      $models: //div[contains(@class, "vd-meta-models")]
    scene:
      Title: //h1[@class="vd-title"]
      Details:
        selector: //div[contains(@class, "vid-desc-inner")]/p | //div[contains(@class, "vid-desc-inner")][not(p)]
        concat: "\n\n"
        postProcess:
          # Stash drops newlines inside a text node, running the sentences on either side together
          - replace:
              - regex: ([\p{Ll}\d][.!?…]["”’)]*)(\p{Lu})
                with: "${1}\n${2}"
      URLs: //meta[@property="og:url"]/@content
      Date: $models/time/@datetime
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          # Remove (scaled-down) resolution from image URL, e.g.
          # https://example.com/wp-content/uploads/2026/05/Example-Something-768x432.webp
          # becomes (854x480)
          # https://example.com/wp-content/uploads/2026/05/Example-Something.webp
          - replace:
              - regex: -\d+x\d+
                with: ""
      Studio:
        Name: //meta[@property="og:site_name"]/@content
      Tags:
        Name: //h2[text()="Tags"]/following-sibling::div/a
      Performers:
        Name: $models//span[@class="vmeta-name"]
        URLs:
          selector: $models//a[contains(@class, "vmeta-model")]/@href
          postProcess:
            - replace:
                - regex: ^
                  with: https://tgirlshouse.com
        Gender:
          fixed: transgender_female

name: JAV Mania
# English metadata for uncensored JAV (Caribbeancom, 1pondo, PacoPacoMama,
# 10musume, HEYZO, Kin8tengoku, Nyoshin, ...) from https://www.jav-mania.net/
# and censored JAV; https://avhinban.com/ (Japanese) fills missing fields,
# covers codes JAV Mania lacks and powers free-text scene search.
sceneByURL:
  - action: script
    url:
      - jav-mania.net/
      - avhinban.com/works/
    script:
      - python
      - JAVMania.py
      - sceneByURL
sceneByFragment:
  action: script
  script:
    - python
    - JAVMania.py
    - sceneByFragment
sceneByName:
  action: script
  script:
    - python
    - JAVMania.py
    - sceneByName
sceneByQueryFragment:
  action: script
  script:
    - python
    - JAVMania.py
    - sceneByQueryFragment

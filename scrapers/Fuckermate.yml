name: Fuckermate
sceneByURL:
  - action: scrapeXPath
    url:
      - fuckermate.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //section[@id="video-section"]//div[@class="post-header font-alt"]/h1[1]
      Details: //div[@class="post-entry"]//p[@class="text-justify"]
      Image: //videoplayer/@poster
      Date:
        selector: //div[@id="video-frame"]/following-sibling::div//div[@class="post-meta"]/text()[1]
        postProcess:
          - parseDate: 2006-01-02 |
      Studio:
        Name:
          fixed: FuckerMate
      Tags:
        Name:
          selector: //section[@id="video-section"]//div[@class="post-meta"]/a
      Performers:
        Name:
          selector: //section[@id="video-section"]//h2[@class="post-title"]
          postProcess:
            - javascript: |
                if (!value) return "";
                return value
                  .replace(/^Introducing\s+/i, "")
                  .replace(/\s+(Solo|II)$/i, "")
                  .split(/\s*,\s*|\s+(?:and|&)\s+/i)
                  .map(function (name) {
                    return name.trim();
                  })
                  .filter(Boolean)
                  .join(",");
          split: ","

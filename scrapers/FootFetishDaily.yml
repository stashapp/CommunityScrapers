name: "Foot Fetish Daily"
sceneByURL:
  - action: scrapeXPath
    url:
      - footfetishdaily.com/update/
    scraper: sceneScraper
sceneByFragment:
  # this works if the fileNames are "as-is" f/ the studio
  # or at least if you keep the sceneID at the front. ex: 234_sceneName.mp4
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: "https://footfetishdaily.com/update/{filename}/"
  queryURLReplace:
    filename:
      - regex: "^(\\d+).*$"
        with: $1
galleryByURL:
  - action: scrapeXPath
    url:
      - footfetishdaily.com/update/
    scraper: galleryScraper
galleryByFragment:
  # galleryIDs (until ~2020) are the same as sceneId, after: they are sceneId+1.
  # either way (like scenes) galleryID must be @start of filename. ex: 234_someName.zip
  action: scrapeXPath
  scraper: galleryScraper
  queryURL: "https://footfetishdaily.com/update/{filename}/"
  queryURLReplace:
    filename:
      - regex: "^(\\d+).*$"
        with: $1
performerByURL:
  - action: scrapeXPath
    url:
      # REQ: (/ID/)[name:optional] # ex /230/Dahlia_Denyle
      - footfetishdaily.com/model/
      - footfetishdaily.com/guest/models/
    scraper: performerScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: &title
        selector: //main//h1
        postProcess:
          - replace:
              - regex: "( Remastered| Photoset)"
                with: ""
      Code:
        selector: //link[contains(@rel,'canonical')]/@href
        postProcess:
          - replace:
              - regex: .*\/(\d+)\/.*
                with: $1
      Details: &details
        selector: //main//p[not(@class)][not(a)]
        postProcess:
          - replace:
              - regex: "(\\*Trailer not available for this update.|Join Now!)"
                with: ""
      Date: &date
        selector: //main//h3
        postProcess:
          - replace:
              - regex: "Release Date:"
                with: ""
      Studio: &studio
        Name: //nav//span[@class="page-title"]
      Performers: &performers
        Name: //h2/a
        URLs:
          selector: //h2/a/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: "https://footfetishdaily.com/"
      Image: //video/@poster | //video-js/@poster | //img/@src[contains(.,"ffd_update_thumbs")]
      URL: &url
        selector: //link[contains(@rel,'canonical')]/@href
        postProcess:
          - replace:
              - regex: ^.(.*).$
                with: $1
  galleryScraper:
    gallery:
      Title: *title
      Details: *details
      Date: *date
      Studio: *studio
      Performers: *performers
      URL: *url
  performerScraper:
    performer:
      Name: //main//h1
      Ethnicity: //label[contains(text(),"Ethnicity")]/../..//p
      Measurements: //label[contains(text(),"Bra Size")]/../..//p
      Image: //img[@class="img-fluid"]/@src
      ## * the studio is inconsistent w/ imperial & metric,
      ## REF: https://github.com/stashapp/CommunityScrapers/pull/1168
      # Height:
      #   selector: //label[contains(text(),"Height")]/../..//p/text()
      #   postProcess:
      #     - feetToCm: true
      Country:
        selector: //label[contains(text(),"Home State")]/../..//p
        postProcess:
          - map:
              Alabama: "USA"
              Alaska: "USA"
              Arizona: "USA"
              Arkansas: "USA"

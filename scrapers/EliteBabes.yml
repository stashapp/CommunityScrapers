name: EliteBabes
performerByName:
  action: scrapeJson
  queryURL: https://www.elitebabes.com/wp-content/themes/masonry/autocomplete_search.php?term={}
  scraper: performerSearch
performerByURL:
  - action: scrapeXPath
    url:
      - www.elitebabes.com/model/
    scraper: performerScraper

jsonScrapers:
  performerSearch:
    performer:
      Name: '#(type=="model")#.label'
      URLs:
        selector: '#(type=="model")#.url'
        postProcess:
          - replace:
              - regex: ^
                with: https://www.elitebabes.com

xPathScrapers:
  performerScraper:
    common:
      $info: //div[@class="module-more"]/ul[@class="list-aside"]/li
    performer:
      Name: //header[@class="header-model"]/h1
      Aliases:
        selector: //div[@class="module-more"]/p/strong[not(. = //header[@class="header-model"]/h1)]
        concat: ", "
      Details: //div[@class="module-more"]/p[not(strong)]
      Birthdate: $info[span="Born:"]/text()
      Country: $info[span="Birthplace:"]/text()
      HairColor: $info[span="Hair Color:"]/text()
      Height:
        selector: $info[span="Height:"]/text()
        postProcess:
          - replace:
              - regex: ^(\d+) cm.*
                with: $1
      Measurements: $info[span="Measurements:"]/text()
      CareerStart: $info[span="First Seen:"]/text()
      Tags:
        Name: //a[contains(@href,"/model-tag/")]
      Images:
        selector: //header[@class="header-model"]//figure/img/@src
        postProcess:
          - replace:
              - regex: _400\.jpg$
                with: .jpg
      URLs: //a[@class="overlay-a"]/@href

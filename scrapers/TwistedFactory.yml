name: TwistedFactory
# Same K3 platform as Kink.yml.
sceneByURL:
  - action: scrapeXPath
    url:
      - twistedfactory.com
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.twistedfactory.com/shoot/{filename}
  # constructs the scene URL from the filename, provided that the filename includes the scene id
  queryURLReplace:
    filename:
      # the id in kink.com is a 1-6 digit number
      - regex: ^(\d+)[^\d].* # support filenames in the form 12345_performer_other_data.mp4
        with: $1
      - regex: .*\((\d+)\)\.[a-zA-Z\d]+$ #support filenames in the form scene - date - performer (12345).mp4
        with: $1
  scraper: sceneScraper

performerByName:
  action: scrapeXPath
  queryURL: https://www.twistedfactory.com/models?q={}
  scraper: performerSearch

performerByURL:
  - action: scrapeXPath
    url:
      - twistedfactory.com/model
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //h1[contains(@class, "fs-0")]
        postProcess:
          - replace:
              - regex: ^\s*(.*)\s*$
                with: $1
      Code: //div[@data-shootid]/@data-shootid
      Date:
        selector: //div[@data-setup]/@data-setup
        postProcess:
          - replace:
              - regex: .*"publishedDate":"(\d{4}-\d{2}-\d{2}).*
                with: $1
          - parseDate: "2006-01-02"
      Director: //span[contains(@class, "director-name")]
      Studio:
        Name: //div[contains(@class,'shoot-detail-legend')]//a
      Performers:
        Name:
          selector: //h1/following-sibling::*/a[contains(@href, "/model/")]
          postProcess:
            - replace:
                - regex: \,
                  with: ""
      Tags:
        Name:
          selector: //p[contains(@class, "h2") and contains(text(), "Categories")]/../following-sibling::div//a[contains(@href, "/tag/")]
          postProcess:
            - replace:
                - regex: ","
                  with: ""
      Details:
        selector: //div[contains(@class, "shoot-detail-description")]//p
        concat: "\n\n"
      Image:
        selector: //div[@data-setup]/@data-setup
        postProcess:
          - replace:
              - regex: ^.*"posterUrl":"([^"]+).*$
                with: $1
              - regex: "?.*$"
                with: ""
      URLs:
        selector: //script[contains(.,'KinkyTracking.all')] | //div[@id='shootPage']/@data-shootid
        concat: "__SEP__"
        postProcess:
          - replace:
              - regex: ^.+?multiSite:\s*'([^']+).+?__SEP__(.+)
                with: https://$1/shoot/$2

  performerSearch:
    common:
      $result: //a[contains(@href, "/model/") and not(ancestor::div[contains(@class, "swimlane")])]
    performer:
      Name:
        selector: $result/img/@alt
        postProcess:
          - replace:
              # alt text is "<name> BDSM - <tag>"
              - regex: '\s+BDSM\b.*$'
                with: ""
      URLs:
        selector: $result/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.twistedfactory.com

  performerScraper:
    performer:
      Name:
        selector: //h1
        postProcess:
          - replace:
              # every model page titles itself "<name> BDSM"
              - regex: '\s+BDSM$'
                with: ""
      Twitter: //a[contains(@href, "twitter.com")]/@href
      # two copies of the portrait are emitted, one per breakpoint
      Image: (//div[contains(@class, "kink-slider-images")]//img/@data-src)[1]
      Tags:
        Name: //span[contains(text(), "Tags")]/following-sibling::a/span
      Tattoos:
        selector: //a[@href="tattoo"]/span
        postProcess:
          - replace:
              - regex: .+
                with: "Yes"
      Piercings:
        selector: //a[@href="pierced"]/span
        concat: "\n"
      FakeTits:
        selector: //a[@href="natural-boobs" or @href="fake-boobs"]/span
        postProcess:
          - replace:
              - regex: .*?Fake.+
                with: "Yes"
              - regex: .*?Natural.+
                with: "No"
      HairColor:
        selector: //a[@href="blonde" or @href="brunet" or @href="brunette" or @href="black-hair" or @href="redhead"]/span
        postProcess:
          - replace:
              - regex: \sHair
                with: ""
      Ethnicity:
        selector: //a[@href="white" or @href="black" or @href="latin" or @href="asian" or @href="mixed"]/span
      Circumcised:
        selector: //a[@href="circumcised" or @href="uncircumcised"]/span
        postProcess:
          - replace:
              - regex: Uncircumcised
                with: "Uncut"
              - regex: Circumcised
                with: "Cut"
      Details:
        selector: //span[@id="bioDescription"]/text()
        concat: "\n"
      Gender:
        selector: //script[contains(.,'KinkyTracking.all')]
        postProcess:
          - replace:
              - regex: .+?"((modelGender)|(genderIds))":"((woman)|(man)|(nonbinary)|(tsman)|(tswoman)|(unknown))".+
                with: "%%%$4" # This little trick will make sure we're left
              - regex: ^[^%].+ # with an empty string if we don't match anything
                with: "" # in the regex above.
              - regex: ^%+
                with: ""
          - map:
              woman: Female
              man: Male
              tswoman: Transgender Female
              tsman: Transgender Male
              nonbinary: Non-Binary
              unknown: ""
      URLs:
        selector: //script[contains(.,'KinkyTracking.all')] | //button[@data-id]/@data-id
        concat: "__SEP__"
        postProcess:
          - replace:
              - regex: ^.+?multiSite:\s*'([^']+).+?__SEP__(.+)
                with: https://$1/model/$2
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0.0
  cookies:
    - CookieURL: "https://www.twistedfactory.com"
      Cookies:
        - Name: "age_gate_accepted"
          Domain: "www.twistedfactory.com"
          Value: "1"
          Path: "/"

name: WhoresHub

sceneByURL:
  - action: scrapeXPath
    url:
      - https://www.whoreshub.com/
    scraper: sceneScraper

sceneByName:
  action: scrapeXPath
  queryURL: https://www.whoreshub.com/search/{}/
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $searchItem: //div[@id="list_videos_videos_list_search_result_items"]//a[contains(@class, "item")]
    scene:
      Title: $searchItem/@title
      URLs: $searchItem/@href
      Image:
        selector: $searchItem//span[@class="thumb-img"]/img/@data-src
        postProcess:
          - replace:
              - regex: ^
                with: "https:"

  sceneScraper:
    scene:
      Title: //h1
      Details: //div[@class="text text-description"][. != "-" and . != //h1]
      URLs: //div[@id="tab3"]//input/@value
      Tags:
        Name: //div[@class="info-wrap"]//ul[@class="tags-list"]//a
      Performers:
        Name:
          selector: >-
            //script[contains(., "video_models: '")][not(contains(., "video_models: ''"))]
          postProcess:
            - replace:
                - regex: (?s).*video_models:\s*'([^']*)'.*
                  with: $1
          split: ", "
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: ^
                with: "https:"

name: shimmie2-xpath
sceneByURL:
  - action: scrapeXPath
    url: &urls
      - https://rule34.paheal.net/post/view/
      - https://shimmie.shishnet.org/post/view/
    scraper: postScraper
imageByURL:
  - action: scrapeXPath
    url: *urls
    scraper: postScraper
xPathScrapers:
  postScraper:
    image:
      Date: &date
        selector: //tr[@data-row="Uploader"]//time/@datetime
        postProcess:
          - replace:
              - regex: T.+
                with: ""
          - parseDate: 2006-01-02
      Tags: &tag_string
        Name: //tr[@data-row="Tags"]//td/a
      URLs: &source //tr[@data-row="Source Link"]/td/div/a/@href
    scene:
      Date: *date
      Tags: *tag_string
      URLs: *source

name: AmateurAllure
galleryByURL:
  - action: scrapeXPath
    url: &urls
      - amateurallure.com/tour/scenes/
    scraper: amateurAllure
  - action: scrapeXPath
    url: &classicUrls
      - amateurallureclassics.com/scenes/
    scraper: amateurAllureClassics
sceneByURL:
  - action: scrapeXPath
    url: *urls
    scraper: amateurAllure
  - action: scrapeXPath
    url: *classicUrls
    scraper: amateurAllureClassics
xPathScrapers:
  amateurAllure:
    common: &commonAttr
      $sceneinfo: //div[@class="scene-info"]
      $title: //span[@class='title_bar_hilite']
      $logo: //div[@id="logo"]//a/@href
      $excludeUpdates: not(ancestor::*[contains(@class, "category_listing_block")])
    gallery:
      Title: &titleSel
        selector: $title
        postProcess: &decensor
          - javascript: |
              const words = [
                "cum", "ass", "head", "heads", "heading", "cock", "cocks", "suck", "sucks",
                "sucked", "sucker", "sucking", "fuck", "fucks", "fucked", "fucking", "load",
                "loads", "loading", "blow", "blowjob", "blowjobs", "ball", "balls", "lick",
                "licking", "deep", "oral", "orally", "porn", "pornstar", "pornstars", "teen",
                "tits", "titty", "sperm", "spermcam", "pussy", "cream", "creamy", "creampie",
                "creampies", "facial", "facials", "throat", "throats", "shaft", "dick", "dicks",
                "nuts", "meat", "pole", "juices", "jerking", "cumshot", "cumshots", "handjob",
                "handjobs", "cowgirl", "spinner", "spinners", "threesome", "threesomes",
                "fingers", "fingering", "penetrate", "missionary", "doggystyle", "doggiestyle",
                "deepthroat", "deepthroats", "deepthroater", "deepthroating", "orgasm",
                "orgasms", "milf", "slut", "sluts", "deep throat", "deep throats",
                "deep throater", "deep throating",
              ];
              const mask = (w) =>
                w.replace(/./g, (c, i) =>
                  c === " " || i === 0 || i === w.length - 1 || (w.length >= 7 && i % 3 === 0) ? c : "-",
                );
              const recase = (m, w) =>
                /^[A-Z][^a-z]*[A-Z][^a-z]*$/.test(m)
                  ? w.toUpperCase()
                  : /^[A-Z]/.test(m)
                    ? w.replace(/(^|\s)([a-z])/g, (_, sp, c) => sp + c.toUpperCase())
                    : w;
              // "head" and "hard" share the mask "h--d": pick "hard" only from context
              value = value
                .replace(/\b((?:and|me|so|rock|is|get|gets|getting|still|really|very|too) )(h)--d\b/gi, (_, pre, h) => pre + recase(h, "hard"))
                .replace(/\b(h)--d(?= (?:pounding|f--k--g|fucking|from|&|and (?:deep|fast)))/gi, (_, h) => recase(h, "hard"));
              for (const w of words.slice().sort((a, b) => b.length - a.length)) {
                value = value.replace(new RegExp("(^|[^\\w-])" + mask(w) + "(?![\\w-])", "gi"), (m, pre) => pre + recase(m.slice(pre.length), w));
              }
              return value;
      Date: &dateAttr
        selector: //div[@class="backgroundcolor_info"]//div[@class='cell update_date']
        postProcess:
          # pages have the date in "Added: MM/DD/YYYY" format, e.g. "Added: 08/29/2025"
          - replace:
              - regex: "Added:"
                with: ""
          - parseDate: 01/02/2006
      Details: &detailsSel
        selector: //span[@class='update_description']
        postProcess: *decensor
      Tags: &tagsAttr
        Name:
          selector: //span[@class='update_tags']//a
          postProcess: *decensor
      Performers: &performersAttr
        Name: //div[@class='backgroundcolor_info']//span[@class='update_models']//a
      Studio: &studioAttr
        Name:
          fixed: Amateur Allure
    scene:
      Title: *titleSel
      Date: *dateAttr
      Details: *detailsSel
      Tags: *tagsAttr
      Performers: *performersAttr
      Image:
        selector: $logo | $title
        concat: "|"
        postProcess:
          - replace:
              - regex: \s
                with: "+"
              # Commas confuse their search engine so we strip everything after the first comma
              # this has been enough to uniquely identify a scene in every case I've tested
              - regex: ",.*"
                with: ""
              - regex: ^([^|]+)\|(.+)
                with: "${1}/search.php?st=advanced&qall=&qany=&qex=$2"
          - subScraper:
              selector: //div[@id="logo"]//a/@href | //img/@srcset | //img/@src0_1x
              concat: "|"
              postProcess:
                - replace:
                    # errant double slash
                    - regex: content//
                      with: content/
                    # regex for srcset entries to get the highest resolution image
                    - regex: ^([^|]+amateurallure[^|]+)\|.+(/content/contentthumbs/\d+/\d+/[^/]+\.jpg) 1920w
                      with: $1$2
                    # regex for src0_1x entries
                    - regex: ^([^|]+amateurallure[^|]+)\|.+(/content/contentthumbs/\d+/\d+/[^/]+\.jpg)
                      with: $1$2
                    # to get the full size image, but this can be portrait so not always ideal for a scene image
                    # - regex: "[124]x"
                    #   with: "full"
      Studio: *studioAttr
  amateurAllureClassics:
    common:
      $scene: //div[contains(@class, "gallery_info")]
      $excludeUpdates: not(ancestor::*[contains(@class, "category_listing_block")])
    gallery:
      Title: &classicTitle
        selector: //title
        postProcess: *decensor
      Date: &classicDate # Some sites hide their release date in a comment
        selector: //*[(contains(@class, "availdate") or contains(@class, "update_date")) and contains(., "/")]
        postProcess:
          - replace:
              - regex: ".*?([0-9]{2}/[0-9]{2}/[0-9]{4}).*"
                with: $1
          - parseDate: 01/02/2006
      Details: &classicDetails
        selector: $scene//span[@class="update_description"]
        postProcess: *decensor
      Performers: &classicPerformers
        Name: $scene//span[@class="update_models" and $excludeUpdates]/a
      Tags: &classicTags
        Name:
          selector: $scene//span[contains(@class, "update_tags")]/a
          postProcess: *decensor
      Studio: &classicStudio
        Name:
          fixed: Amateur Allure Classics
    scene:
      Title: *classicTitle
      Date: *classicDate
      Details: *classicDetails
      Performers: *classicPerformers
      Tags: *classicTags
      Studio: *classicStudio
      Image: //meta[@property="og:image"]/@content

name: AbbiSecraa
sceneByURL:
  - action: scrapeXPath
    url:
      - abbisecraa.com/blog/movie/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - abbisecraa.com/blog/photos/
    scraper: galleryScraper
xPathScrapers:
  sceneScraper:
    common:
      $title: //h1
    scene:
      Title:
        selector: $title
        postProcess:
          - replace:
              - regex: \s*-\s+movie$
                with: ""
      Details:
        selector: //div[@class="uk-panel uk-margin-large"]/p
        concat: " "
      Date:
        selector: //h1/following-sibling::div[2]
        postProcess:
          - parseDate: 02 January 2006
      Image:
        selector: (//img[@class="el-image"])[1]/@src
        postProcess:
          - replace:
              - regex: ^/
                with: "https://abbisecraa.com/"
      Studio:
        Name:
          fixed: "Abbi Secraa"
      Tags:
        Name:
          selector: //meta[@name="keywords"]/@content
          split: ","
      Performers:
        Name:
          fixed: "Abbi Secraa"

  galleryScraper:
    common:
      $title: //h1
    gallery:
      Title:
        selector: $title
        postProcess:
          - replace:
              - regex: \s*-\s+photos
                with: ""
      Details:
        selector: //div[@class="uk-panel uk-margin-large"]/p
        concat: " "
      Date:
        selector: //h1/following-sibling::div[2]
        postProcess:
          - parseDate: 02 January 2006
      Studio:
        Name:
          fixed: "Abbi Secraa"
      Tags:
        Name:
          selector: //meta[@name="keywords"]/@content
          split: ","
      Performers:
        Name:
          fixed: "Abbi Secraa"

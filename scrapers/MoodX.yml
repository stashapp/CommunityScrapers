name: "Mood X"
sceneByURL:
  - action: scrapeXPath
    url:
      - moodx.tv
      - moodxott.app/watch/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $value: following-sibling::div[contains(@class, "value")]
    scene:
      Title: //h1[@class="heading-movie"]
      Details: //div[@class="label" and text()="Description:"]/$value[normalize-space() != "Streaming Now"]
      Image:
        selector: //video[@id="v_player"]/@poster
        postProcess:
          - replace:
              - regex: ^/(web/.*)$
                with: https://web.archive.org/$1
      Studio:
        Name:
          selector: //h1[@class="heading-movie"]
          postProcess:
            - replace:
                - regex: ^.+$
                  with: Mood X
      Date:
        selector: //div[@class="label" and text()="Release Date:"]/$value
        postProcess:
          - parseDate: 2006-01-02

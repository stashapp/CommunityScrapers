sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //h1//*[not(@class='visually-hidden')]/text() | //h1[@class="nice-title"]
        postProcess:
          - replace:
              # Remove the sitename prefix
              - regex: ^[A-Z][a-z0-9.]*( [A-Z][a-z0-9.]*)* \d+:\s*
                with: ""
              # Remove the VR suffix
              - regex: \s*in\s+180°$
                with: ""
      URLs: //link[@rel="canonical"]/@href
      Code:
        selector: //h1/span[@class="visually-hidden"]
        postProcess:
          - replace:
              - regex: \D*(\d+).*
                with: $1
      Details:
        selector: //div[contains(@class,"read-more ")]/div/p/text() | //div[@class="desc-text"]/p
        concat: "\n\n"
      Tags:
        Name: //li[@class="tag ellipsis no-shrink"]/a/span/text() | //ul[@class="tags"]/li/a[@class="tag"]
      Performers:
        Name:
          selector: (//p[span[contains(., "Featuring:")]])[1]/a
          postProcess:
            # names are rendered lowercase and capitalised with CSS
            - javascript: |
                return value.replace(/\b\w/g, function (c) { return c.toUpperCase() })
      Studio:
        Name: //meta[@property="og:site_name"]/@content | //img[contains(@class, "logo")]/@alt
      Image: //media-player/@poster | //dl8-video/@poster
      Date:
        selector: //script[@type="application/ld+json"][1]
        postProcess:
          - replace:
              - regex: .+(?:"uploadDate":\s*")([^T]+).+
                with: $1
          - parseDate: 2006-01-02

name: Bang
sceneByURL:
  - action: scrapeXPath
    url:
      - bang.com/video
      - bangpremium.com/video
      - yngr.com/video
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.bang.com/videos?term={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - bang.com/dvd
      - bangpremium.com/dvd
      - yngr.com/dvd
    scraper: movieScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.bang.com/pornstars?term={}
  scraper: performerSearch
performerByURL:
  - action: scrapeXPath
    url:
      - bang.com/pornstar
      - bangpremium.com/pornstar
      - yngr.com/pornstar
    scraper: performerScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - bang.com/photos/
      - bangpremium.com/photos/
      - yngr.com/photos/
    scraper: sceneScraper
xPathScrapers:
  sceneSearch:
    common:
      $scenes: //div[contains(@class, "video_container")]
    scene:
      Title: $scenes//a/span
      Date:
        selector: $scenes//span[contains(., "•")]/following-sibling::text()
        postProcess:
          - parseDate: Jan 2, 2006
      Image: $scenes//img/@src
      URLs:
        selector: $scenes//a[contains(@href, "/video/")]/@href
        postProcess: &prependHost
          - replace:
              - regex: ^
                with: https://www.bang.com
  sceneScraper:
    common:
      $escapedJson: //div[@data-live-name-value="Video:RelatedPhotos"]/@data-live-props-value
      $movie: //p[contains(text(), "Movie:")]/a[contains(@href, "/dvd/")]
      $performer: //p[contains(@class, "capitalize") and contains(text(), "With:")]/a[contains(@href, "/pornstar/")]
      $series: //p[contains(text(), "In the series:")]/a[contains(@href, "/originals/")]
      $studio: //p[contains(text(), "Studio:")][not(//p[contains(text(), "In the series:")]/a[contains(@href, "/originals/")])]/a[contains(@href, "/studio/")]
      $title: //meta[@property="og:title"]/@content
    scene:
      Title: $title
      Details: //meta[@name="description"]/@content
      Image: //meta[@property="og:image"]/@content
      Date: //meta[@property="video:release_date"]/@content
      # TODO: enable when scrape dialog can show durations
      # Duration: //p[contains(text(), "Playtime:")]/span
      URLs: //meta[@property="og:url"]/@content
      Tags:
        Name: //a[@class="genres"]
      Performers:
        Name: $performer
        URLs:
          selector: $performer/@href
          postProcess: *prependHost
      Studio:
        Name:
          selector: $series | $studio
          postProcess: &studioReplace
            - replace:
                - regex: ^yngr\.com$
                  with: "YNGR"
      Groups:
        Name: $movie
        URLs:
          selector: $movie/@href
          postProcess: *prependHost
    gallery:
      Title:
        selector: $title
        postProcess:
          - replace:
              - regex: \s+-\s+Photos$
                with: ""
      Details: //meta[@name="twitter:description"]/@content
      URLs: //meta[@property="og:url"]/@content
      Date:
        selector: $escapedJson
        postProcess:
          - replace:
              - regex: .*releaseDate[^\d]*(\d{4}-\d{2}-\d{2}).*
                with: $1
      Performers:
        Name: $performer
        # singular URL on purpose: stash maps a plural URLs key on gallery
        # performers as multi-value, assigning every match to the first one
        URL:
          selector: $performer/@href
          postProcess: *prependHost
      Tags:
        Name:
          selector: $escapedJson
          postProcess:
            - javascript: |
                if (value?.length) {
                  console.debug("Parsing tags from JSON");
                  var tags = [];
                  // replace HTMLescaped quotes and parse JSON
                  var json = JSON.parse(value.replace(/&quot;/g, '"'));
                  if (json?.relatedVideo?.genres?.length) {
                    tags.push(...json.relatedVideo.genres);
                  }
                  if (json?.relatedVideo?.actions?.length) {
                    tags.push(...json.relatedVideo.actions.map(a => a.name));
                  }
                  return tags;
                }
          split: ","
      Studio:
        Name:
          selector: $series | $studio
          postProcess: *studioReplace
  movieScraper:
    common:
      $details: //div[@class="w-full"][1]
      $series: //div[@class="w-full"][1]//p[contains(text(), "In the series:")]/a[contains(@href, "/originals/")]
      $studio: //div[@class="w-full"][1]//p[contains(text(), "Studio")][not(//div[@class="w-full"][1]//p[contains(text(), "In the series:")]/a[contains(@href, "/originals/")])]/a[contains(@href, "/studio/")]
    group:
      Name: $details/h1
      Duration: //p[contains(text(), "Date:")]/span[2]
      Date:
        selector: //p[contains(text(), "Date:")]/span[1]
        postProcess:
          - parseDate: Jan 2, 2006
      Synopsis: $details//p[contains(@class, "clear-both")]
      URLs: //meta[@property="og:url"]/@content
      Tags:
        Name: $details//a[@class="genres"]
      Studio:
        Name:
          selector: $series | $studio
          postProcess: *studioReplace
      FrontImage:
        selector: &cover //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: \?.*$
                with: ""
      BackImage:
        selector: *cover
        postProcess:
          - replace:
              - regex: /front\.jpg.*$
                with: /back.jpg
  performerSearch:
    common:
      $performers: //a[@data-turbo-frame="_top"][contains(@href, "/pornstar/")]
    performer:
      Name: $performers//span[contains(@class, "font-semibold")]
      URLs:
        selector: $performers/@href
        postProcess: *prependHost
  performerScraper:
    common:
      $overlay: //div[@class="flex flex-col md:items-start items-center"]
      $facts: //div[contains(@class, "md:text-left")]
    performer:
      Name: $overlay/h2
      URLs: //link[@rel="canonical"]/@href
      Country:
        selector: //div[@data-testid="actor-bio"]/span[contains(@class, "mx-1")]/following-sibling::span[1]
        postProcess:
          - replace:
              - regex: ^.*,\s*
                with: ""
      Ethnicity: $facts/text()[contains(., "Ethnicity")]/following-sibling::span[1]
      HairColor: $facts/text()[contains(., "Hair Color")]/following-sibling::span[1]
      EyeColor: $facts/text()[contains(., "Eye Color")]/following-sibling::span[1]
      Images:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: \?.*$
                with: ""

name: Caribbeancom-JP
sceneByURL:
  - action: scrapeXPath
    url:
      - www.caribbeancom.com/moviepages
      - www.caribbeancompr.com/moviepages
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.caribbeancom{filename}
  # constructs the movie URL from the filename, provided that the filename includes the movie id
  queryURLReplace:
    filename:
      - regex: .*(\d{6}-\d{3}).* # carribeancom uses ids with form like 062212-055
        with: .com/moviepages/$1/index.html
      - regex: .*(\d{6}_\d{3}).* # caribbeancompr uses 062212_055
        with: pr.com/moviepages/$1/index.html
      - regex: .+[^index.html]$$ # if no valid ID found in filename
        with: .com/404.html # clear filename
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $movieinfo: //div[contains(@class, "movie-info")]
    scene:
      Title: //div[@id="moviepages"]//div[contains(@class, "heading")]/h1
      Details: $movieinfo//p
      URLs:
        selector: &movieLink //a[contains(@href, "/member/movies/")]/@href
        concat: "|"
        postProcess:
          - replace:
              - regex: .*?//[^/]*\.(caribbeancompr|caribbeancom)\.com/member/movies/([^/]+)/.*
                with: https://www.${1}.com/moviepages/${2}/index.html
      Date:
        selector: *movieLink
        postProcess:
          - replace:
              - regex: .*/member/movies/(\d{6})[-_]\d+/.*
                with: $1
          - parseDate: "010206"
      Code:
        selector: *movieLink
        postProcess:
          - replace:
              - regex: .*/member/movies/([^/]+)/.*
                with: $1
      Image:
        selector: *movieLink
        postProcess:
          - replace:
              - regex: .*?//[^/]*\.(caribbeancompr|caribbeancom)\.com/member/movies/([^/]+)/.*
                with: https://www.${1}.com/moviepages/${2}/images/l_l.jpg
      Performers:
        Name: //ul/li/span[contains(., "出演")]/..//a
      Tags:
        Name: //ul/li/span[contains(., "タグ")]/../span/a[contains(@class, "spec")]
      Studio:
        Name:
          selector: //ul[@class="footer-copyright"]/li[contains(., "©")]
          postProcess:
            - replace:
                - regex: .*\s([\w]+)\.com.*
                  with: $1
            - map:
                caribbeancompr: Caribbeancom Premium
                caribbeancom: Caribbeancom
driver:
  # caribbeancompr.com sends no charset header and puts <meta charset> past the
  # 1024-byte prescan window, so a plain fetch decodes EUC-JP as mojibake
  useCDP: true
  cookies:
    - Cookies:
        - Name: "cebsp_"
          Domain: ".caribbeancompr.com"
          Value: "3"
          Path: "/"
        - Name: "cebs"
          Domain: ".caribbeancompr.com"
          Value: "1"
          Path: "/"
        - Name: "_gat"
          Domain: ".caribbeancompr.com"
          Value: "1"
          Path: "/"

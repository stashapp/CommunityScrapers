name: Newgrounds
sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://www.newgrounds.com/portal/view/{filename}
  queryURLReplace:
    filename:
      - regex: ^([^\[]+\[)+|(\]\.).*
        with: ""
sceneByURL:
  - action: scrapeXPath
    url:
      - newgrounds.com/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //head/title
      URLs: //meta[@property="og:url"]/@content
      Date:
        selector: //meta[@itemprop="datePublished"]/@content
        postProcess:
          - replace:
              - regex: T.+
                with: ""
          - parseDate: 2006-01-02
      Image: //meta[@property="og:image"]/@content
      Details: //meta[@itemprop="description"]/@content
      Tags:
        Name: //dd[@class="tags"]//a[contains(@href, "match=tags")]
      Studio:
        Name: //div[@class="item-details-main"]//a
# TODO: take this cookie from scraper settings once Stash supports them, see https://github.com/stashapp/stash/issues/4433
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0
    - Key: Cookie
      Value: ng_remember=[insert value here]

name: Newgrounds
sceneByFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: https://www.newgrounds.com/portal/view/{filename}
  queryURLReplace:
    filename:
      - regex: ^([^\[]+\[)+|(\]\.).*
        with: ""
sceneByURL:
  - action: scrapeXPath
    url:
      - newgrounds.com/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //head/title
      URLs: //meta[@property="og:url"]/@content
      Date:
        selector: //meta[@itemprop="datePublished"]/@content
        postProcess:
          - replace:
              - regex: T.+
                with: ""
          - parseDate: 2006-01-02
      Image: //meta[@property="og:image"]/@content
      Details: //meta[@itemprop="description"]/@content
      Tags:
        Name: //dd[@class="tags"]//a[contains(@href, "match=tags")]
      Studio:
        Name: //div[@class="item-details-main"]//a
driver:
  useCDP: true
  cookies:
    - Cookies:
        # You will need to provide the values for the following cookies. View storage under the inspect menu in your browser while logged in.
        - Name: "NG_GG_username"
          Domain: ".newgrounds.com"
          Value: "[insert value here]"
          Path: "/"
        - Name: "vmk1du5I8m"
          Domain: ".newgrounds.com"
          Value: "[insert value here]"
          Path: "/"

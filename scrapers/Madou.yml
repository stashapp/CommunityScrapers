name: Madou Media Unofficial
sceneByFragment:
  action: scrapeXPath
  queryURL: https://madouqu.com/?s={filename}
  queryURLReplace:
    filename:
      - regex: '[^a-zA-z]*([a-zA-z]+(?:-)?(?:\d+-?\d+)).*' # eg MD0063 or MD-0063  or MD-0063-02
        with: $1
  scraper: sceneSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - madouqu.com/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Studio:
        Name: //div[@class="breadcrumbs"][//h1[@class="entry-title"]]/a[last()]
      Performers:
        Name: //div[contains(@class, "entry-tags")]//*[(self::a or self::p)]/text()
      Title: //h1[@class="entry-title"]
      Image: //meta[@property="og:image"][//h1[@class="entry-title"]]/@content
  sceneSearch:
    scene:
      Title: //article//h2[@class="entry-title"]/a/@title
      URLs: //article//h2[@class="entry-title"]/a/@href

name: Madou Media Unofficial
sceneByFragment:
  action: scrapeXPath
  queryURL: https://madouqu.com/?s={filename}
  queryURLReplace:
    filename:
      - regex: '[^a-zA-z]*([a-zA-z]+(?:-)?(?:\d+-?\d+)).*' # eg MD0063 or MD-0063  or MD-0063-02
        with: $1
  scraper: sceneSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - madouqu.com/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $header: //article/header[@class="entry-header"]
    scene:
      Studio:
        Name: $header//a[@class="category-label"]
      Performers:
        Name: $header//a[@class="post-tag-label"]
      Title: $header/h1
      Image: //article//img[contains(@class, "mdqn-article-lead")]/@src
      URLs: //link[@rel="canonical"][//article/header[@class="entry-header"]]/@href
  sceneSearch:
    common:
      $result: //article[contains(@class, "resource-card")]//h2/a
    scene:
      Title: $result
      URLs: $result/@href

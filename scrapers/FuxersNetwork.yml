name: FuxersNetwork
sceneByURL:
  - action: scrapeXPath
    url:
      - fuxersnetwork.com/video
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Date:
        selector: //div[i[contains(@class,'calendar')]]/span
        postProcess:
          - replace:
              - regex: \s.+
                with: ""
              - regex: ^0000-00-00$
                with: ""
      Image:
        selector: //script[contains(.,'posterImage')]
        postProcess:
          - replace:
              - regex: .+?posterImage:\s*"([^"]+).+
                with: $1
              - regex: (-\d+)b\.jpg$
                with: ${1}.jpg
              - regex: ^/
                with: https://fuxersnetwork.com/
      Studio:
        Name: //div[span[contains(.,'Site:')]]/a
      Tags:
        Name: //div[contains(@class,'-tags')]//a | //div[contains(@class,'-niches')]//a
      Performers:
        Name: //div[contains(@class,'-models')]//a

name: "Freshmen"
sceneByURL:
  - action: scrapeXPath
    url:
      - club.freshmen.net/secure/
      - freshmen.net/content/
    scraper: sceneScraper

performerByURL:
  - action: scrapeXPath
    url:
      - club.freshmen.net/secure/model
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //h1
        postProcess:
          - replace:
              - regex: ^(.+)\s\(Issue\s#(\d+).+$
                with: "Issue $2: $1"
      Details:
        selector: //div[@class='content_detail__first_col__player__more__description']//div/p
        concat: "\n\n"
      Date:
        selector: //div[@class='content_date']
        postProcess:
          - parseDate: 01/02/2006
      Image: //div[@class="player"]//img/@src | //div[@class="player"]//video/@poster
      Studio:
        Name:
          fixed: Freshmen
      Tags:
        Name: //div[@class="wrapper tag_list"]/a
      Performers:
        Name: //div[@class='actors_list__actor']//h3

  performerScraper:
    performer:
      Name: //div[@class="content_detail__first_col"]//h1[1]
      Gender:
        fixed: Male
      HairColor: //td[contains(text(),"Hair color")]/following-sibling::td
      EyeColor: //td[contains(text(),"Eye color")]/following-sibling::td
      Weight: //td[contains(text(),"Weight")]/following-sibling::td
      Height: //td[contains(text(),"Height")]/following-sibling::td
      PenisLength: //td[contains(text(),"Dick size")]/following-sibling::td
      Details:
        selector: //div[@class="content_detail__first_col__description__white_box"]/p
      Image: //div[@class="content_detail__first_col__top__gallery__big"]/img/@src

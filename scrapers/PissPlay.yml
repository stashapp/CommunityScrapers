name: PissPlay
sceneByURL:
  - action: scrapeXPath
    url:
      - pissplay.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@id="video_title"]
      Date:
        selector: //div[contains(@class, 'video_date')]
        postProcess:
          - parseDate: 2 Jan 2006
      Performers:
        Name:
          selector: //h1[@id="video_title"]
          postProcess:
            - replace:
                - regex: .*
                  with: "Bruce,Morgan"
          split: ","
      Tags:
        Name: //div[@id="video_tags"]/a
      Details:
        selector: //div[@id="video_description"]/p
        concat: "\n\n"
      Image:
        selector: //div[@class="video_section_player"]//@src
        postProcess:
          - replace:
              - regex: .+(?:poster=)([^"]*)
                with: $1
      Studio:
        Name:
          fixed: PissPlay

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

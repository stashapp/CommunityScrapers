name: "NewSensationsVOD"
groupByURL:
  - action: scrapeXPath
    url:
      - vod.newsensations.com/dvds
    scraper: movieScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - vod.newsensations.com/scenes
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - vod.newsensations.com/models
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="title_bar"]/span
      Date:
        selector: //div[@class="cell update_date"][1]
        postProcess:
          - parseDate: 01/02/2006
      Details: //span[@class="update_description"]
      Performers:
        Name: //div[@class="gallery_info"]/span[@class="update_models"]/a/text()
      Tags:
        Name: //div[@class="gallery_info"]/span[@class="update_tags"]/a/text()
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: "-2x"
                with: "-4x"
      Studio:
        Name:
          fixed: NewSensations
  movieScraper:
    group:
      Name: /html/head/title
      Date:
        selector: //div[@class="cell dvd_info"]/span[@class="update_date"]/text()
        postProcess:
          - parseDate: 01/02/2006
      Studio:
        Name: //div[@class="dvd_details_overview"]/span[@class="update_date"]/a/text()
      Synopsis:
        selector: //div[@class="dvd_description dvd_info"]/text()
      URL: //div[@class="cell_top cell_thumb"]/a/@href
      FrontImage: //div[@class="cell_top cell_thumb"]/a/img/@src0_3x
      Director:
        selector: //div[@class="dvd_extra_fields"]/div[contains(text(), "Director")]/text()
        postProcess:
          - replace:
              - regex: "Director:"
                with: ""
      Tags:
        Name: //div[@class="update_tags dvd_info"]/a/text()
  performerScraper:
    performer:
      Name: //span[@class="title_bar_hilite"]/text()
      Height:
        selector: //div[@class="model_bio"]/text()[contains(.,"Height:")]
        postProcess:
          - replace:
              - regex: ^[^:]*:[\s\xA0]*
                with: ""
          - feetToCm: true
      Measurements:
        selector: //div[@class="model_bio"]/text()[contains(.,"Measurements:")]
        postProcess:
          - replace: &stripLabel
              - regex: ^[^:]*:[\s\xA0]*
                with: ""
              - regex: ^Unknown$
                with: ""
      Birthdate:
        selector: //div[@class="model_bio"]/text()[contains(.,"Birthday:")]
        postProcess:
          - replace: *stripLabel
          - parseDate: January 2, 2006
      Aliases:
        selector: //div[@class="model_bio"]/text()[contains(.,"Aliases:")]
        postProcess:
          - replace: *stripLabel
      Tattoos:
        selector: //div[@class="model_bio"]/text()[contains(.,"Tattoos:")]
        postProcess:
          - replace: *stripLabel
      Piercings:
        selector: //div[@class="model_bio"]/text()[contains(.,"Piercings:")]
        postProcess:
          - replace: *stripLabel
      Twitter:
        selector: //div[@class="model_bio"]/text()[contains(.,"Twitter:")]
        postProcess:
          - replace:
              - regex: ^[^:]*:[\s\xA0]*
                with: ""
              # Stash builds the profile URL itself, so the handle must be bare
              - regex: ^@
                with: ""

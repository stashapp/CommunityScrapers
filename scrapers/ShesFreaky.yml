name: ShesFreaky
sceneByURL:
  - action: scrapeXPath
    url:
      - shesfreaky.com/video/
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.shesfreaky.com/video/{filename}.html
  queryURLReplace:
    filename:
      - regex: (?:.+)\[([\w\d-]+)-\d\](?:\.\w+$)
        with: $1
      - regex: .*\.[^\.]+$ # if no id is found in the filename
        with: # clear the filename so that it doesn't leak
  scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: "https://www.shesfreaky.com/search/{}"
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $result: //div[starts-with(@id, "item-")]
      $link: //div[starts-with(@id, "item-")]/div[@class="flex items-center"]//a[contains(@href, "/video/")]
    scene:
      Title: $link
      URLs:
        selector: $link/@href
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.shesfreaky.com"
      Image:
        selector: $result/a//img/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
  sceneScraper:
    common:
      $video: //div[@class="mx-5 mb-5"][.//h1]
      $ldjson: //script[@type="application/ld+json"][contains(., '"VideoObject"')]
    scene:
      Title: //h1
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: $ldjson
        postProcess:
          - javascript: |
              return (JSON.parse(value).uploadDate || "").slice(0, 10);
      Details:
        selector: $ldjson
        postProcess:
          - javascript: |
              var d = (JSON.parse(value).description || "").trim();
              return d == "." ? "" : d;
      Tags:
        Name: $video//a[contains(@href,"/tag/") or contains(@href,"/channels/")]
      Image: //meta[@property="og:image"]/@content

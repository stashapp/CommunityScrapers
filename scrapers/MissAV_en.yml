name: MissAV (en)
sceneByURL:
  - action: scrapeXPath
    url:
      - missav.ai
      - missav.ws
      - missav.live
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://missav.live/en/search/{}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $tile: //div[contains(@class, "thumbnail")]
    scene:
      Title: $tile//a[not(*)]
      URLs: $tile//a[not(*)]/@href
      Image: $tile//img/@data-src
  sceneScraper:
    scene:
      Title:
        selector: //meta[@property="og:title"]/@content
        postProcess:
          - replace:
              - regex: ^.*?\s
                with: ""
      Code: //span[text()="Code:"]/following-sibling::span
      Date: //span[text()="Release date:"]/following-sibling::time
      Details: //meta[@property="og:description"]/@content
      Image: //meta[@property="og:image"]/@content
      Director: //meta[@property="og:video:director"]/@content
      Performers:
        Name: //meta[@property="og:video:actor"]/@content
      Studio:
        Name: //span[text()="Maker:"]/following-sibling::a
      Tags:
        Name: //span[text()="Genre:"]/following-sibling::a

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

name: Plushies
sceneByName:
  action: scrapeXPath
  queryURL: "https://plushies.tv/tour/search.php?query={}"
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - plushies.tv
    scraper: sceneScraper
xPathScrapers:
  sceneSearch:
    common:
      $card: //div[@class="latestUpdateB"]
    scene:
      Title: $card//h4[@class="link_bright"]/a
      URLs: $card//h4[@class="link_bright"]/a/@href
      Image:
        selector: $card//img/@src0_1x
        postProcess:
          - replace:
              - regex: ^
                with: "https://plushies.tv"
  sceneScraper:
    scene:
      Title: //div[@class="vidImgTitle"]/h4
      Details: //div[@class="vidImgContent text_light"]/p
      Performers:
        Name: //p[@class="link_light"]/a[@class="link_bright infolink"]
      Tags:
        Name: //div[@class="blogTags"]//a
      Image:
        selector: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: Plushies

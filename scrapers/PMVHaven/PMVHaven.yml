name: PMVHaven
sceneByURL:
  - action: scrapeJson
    url:
      - pmvhaven.com/video/
    queryURL: https://pmvhaven.com/api/videos/{url}
    queryURLReplace:
      url:
        - regex: .*([a-f0-9]{24}).*
          with: $1
    scraper: sceneScraper
sceneByFragment:
  action: scrapeJson
  queryURL: https://pmvhaven.com/api/videos/phash?hash={phash}&distance=8
  scraper: resultScraper
sceneByName:
  action: scrapeJson
  queryURL: https://pmvhaven.com/api/videos/search?q={}&limit=20&page=1
  scraper: sceneSearchScraper
sceneByQueryFragment:
  action: scrapeJson
  queryURL: https://pmvhaven.com/api/videos/{url}
  queryURLReplace:
    url:
      - regex: .*([a-f0-9]{24}).*
        with: $1
  scraper: sceneScraper

jsonScrapers:
  sceneScraper:
    scene:
      Title: data.title
      Code: data._id
      Date:
        selector: data.uploadDate
        postProcess:
          - replace:
              - regex: "T(.*)$"
                with: ""
          - parseDate: 2006-01-02

      Details: data.description
      Tags:
        Name: data.tags
      Performers:
        Name: data.starsTags
      Image: data.thumbnailUrl
      Studio:
        Name: data.uploaderUsername
      URLs:
        selector: data._id
        postProcess:
          - replace:
              - regex: (.*)
                with: https://pmvhaven.com/video/$1
  resultScraper:
    scene:
      Title: videos.0.title
      Date:
        selector: videos.0.uploadDate
        postProcess:
          - replace:
              - regex: "T(.*)$"
                with: ""
          - parseDate: 2006-01-02

      Details: videos.0.description
      Tags:
        Name: videos.0.tags
      Performers:
        Name: videos.0.starsTags
      Image: videos.0.thumbnailUrl
      Studio:
        Name: videos.0.uploaderUsername
      URLs:
        selector: videos.0._id
        postProcess:
          - replace:
              - regex: (.*)
                with: https://pmvhaven.com/video/$1
  sceneSearchScraper:
    scene:
      Title: videos.#.title
      Code: videos.#._id
      Date:
        selector: videos.#.uploadDate
        postProcess:
          - replace:
              - regex: "T(.*)$"
                with: ""
          - parseDate: 2006-01-02
      Details: videos.#.description
      Image: videos.#.thumbnailUrl
      Studio:
        Name: videos.#.uploaderUsername
      URLs:
        selector: videos.#._id
        postProcess:
          - replace:
              - regex: (.*)
                with: https://pmvhaven.com/video/$1

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/v1

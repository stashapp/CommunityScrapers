name: "SexBabesVR"
sceneByURL:
  - action: scrapeXPath
    url:
      - sexbabesvr.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $detail: //div[@class="video-detail"]
    scene:
      Title: //dl8-video/@title
      Date:
        selector: $detail//time/@datetime
        postProcess:
          - parseDate: 2006-01-02
      Details:
        selector: >-
          $detail//div[contains(@class,"sbvr-scene-about__prose")]/p |
          $detail//div[contains(@class,"sbvr-scene-about__prose")][not(p)]
        concat: "\n\n"
      Tags:
        Name: $detail//ul[contains(@class,"sbvr-scene-about__chips")]//a
      Performers:
        Name: $detail//div[@class="video-detail__description--author"]//a
      Image: //dl8-video/@poster
      Studio:
        Name:
          fixed: SexBabesVR

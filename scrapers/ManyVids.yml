name: ManyVids
performerByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/autocomplete?keywords={}&contentPref=0
  scraper: performerSearch
performerByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Profile
    scraper: performerScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*/Profile/(\d+)/.*
          with: https://api.manyvids.com/profile/profile/$1
sceneByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/results?keywords={}&contentPref=0
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: ^(https:\/\/www\.manyvids\.com\/Video\/)
        with: https://api.manyvids.com/store/video/
      - regex: /[^/]*/*$
        with: ""
sceneByFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "https://api.manyvids.com/store/video/{filename}"
  queryURLReplace:
    filename:
      - regex: .*?(\d{6,8}).*
        with: $1
sceneByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Video/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*?(\d+).*
          with: https://api.manyvids.com/store/video/$1
jsonScrapers:
  performerSearch:
    performer:
      Name: models.#.username
      URLs:
        selector: models.#.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Images: models.#.avatar.url
  sceneSearch:
    scene:
      Title: vids.#.title
      Code: vids.#.id
      URLs:
        selector: "vids.#.{id,slug}.@values"
        postProcess:
          - replace:
              - regex: '\["(\d+)",\s*"([^"]+)"\]'
                with: $1/$2
              - regex: ^
                with: https://www.manyvids.com/Video/
      Image: vids.#.thumbnail.url
  sceneScraper:
    scene:
      Title:
        selector: data.title
        postProcess:
          - &decodeEntities
            javascript: |
              const entities = { "&amp;": "&", "&quot;": '"', "&lt;": "<", "&gt;": ">" };
              return value.replace(/&(?:amp|quot|lt|gt);/g, (e) => entities[e]);
      Details:
        selector: data.description
        postProcess:
          - *decodeEntities
      Code: data.id
      URLs:
        selector: data.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Date:
        selector: data.launchDate
        postProcess:
          - parseDate: 2006-01-02T15:04:05.000Z
      Image: data.screenshot
      Tags:
        Name: data.tagList.#.label
      Performers:
        Name: data.model.displayName
        URLs:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com
      Studio:
        Name: data.model.displayName
        URLs:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com
  performerScraper:
    performer:
      Name: displayName
      URLs:
        selector: '{"id":legacyUserId,"handle":urlHandle,"insta":socLinkInstagram,"tw":socLinkTwitter}'
        postProcess:
          - javascript: |
              const { id, handle, insta, tw } = JSON.parse(value);
              const norm = (raw, host) => {
                if (!raw) return "";
                const s = String(raw)
                  .trim()
                  .replace(/^https?:\/\//i, "")
                  .replace(/^www\./i, "")
                  .replace(/\/+$/, "");
                if (!s) return "";
                const slash = s.indexOf("/");
                if (slash > 0 && s.slice(0, slash).includes(".")) {
                  return "https://" + s.slice(0, slash).toLowerCase() + s.slice(slash);
                }
                return `https://${host}/${s.replace(/^@/, "")}`;
              };
              return [
                `https://www.manyvids.com/Profile/${id}/${handle}/Store/Videos`,
                norm(insta, "instagram.com"),
                norm(tw, "twitter.com"),
              ]
                .filter(Boolean)
                .join("\n");
        split: "\n"
      Country: location
      HairColor: hairColor
      CareerStart:
        selector: createdAt
        postProcess:
          - javascript: return value.slice(0, 4);
      Images: portrait
      Details:
        selector: description
        postProcess:
          - javascript: |
              return value
                .replace(/\r/g, "")
                .replace(/\\(['"])/g, "$1")
                .replace(/<\/p>\s*<p>/g, "\n")
                .replace(/<br\s*\/?>/g, "\n")
                .replace(/<[^>]+>/g, "")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .replace(/&#0?39;/g, "'")
                .replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">")
                .trim();
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

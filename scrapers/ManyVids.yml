name: ManyVids
performerByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/autocomplete?keywords={}&contentPref=0
  scraper: performerSearch
performerByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Profile
    scraper: performerScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*/Profile/(\d+)/.*
          with: https://www.manyvids.com/bff/profile/profiles/$1
sceneByName:
  action: scrapeJson
  queryURL: https://www.manyvids.com/bff/search/results?keywords={}&contentPref=0
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: ^(https:\/\/www\.manyvids\.com\/Video\/)
        with: https://www.manyvids.com/bff/store/video/
      - regex: /[^/]*/*$
        with: ""
sceneByFragment:
  action: scrapeJson
  scraper: sceneScraper
  queryURL: "https://www.manyvids.com/bff/store/video/{filename}"
  queryURLReplace:
    filename:
      - regex: .*?(\d{6,8}).*
        with: $1
sceneByURL:
  - action: scrapeJson
    url:
      - manyvids.com/Video/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .*?(\d+).*
          with: https://www.manyvids.com/bff/store/video/$1
jsonScrapers:
  performerSearch:
    performer:
      Name: models.#.username
      URLs:
        selector: models.#.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Images: models.#.avatar.url
  performerScraper:
    performer:
      Name: displayName
      Gender: identification
      URLs:
        selector: '{"id":legacyUserId,"handle":urlHandle,"insta":socLnkInstagram,"tw":socLnkTwitter}'
        postProcess:
          - javascript: |
              const norm = (raw, host) => {
                if (!raw) return "";
                const s = String(raw)
                  .trim()
                  .replace(/^https?:\/\//i, "")
                  .replace(/^www\./i, "")
                  .replace(/\/+$/, "");
                if (!s) return "";
                const slash = s.indexOf("/");
                // a dot before the first slash means it really is a host
                if (slash > 0 && s.slice(0, slash).includes(".")) {
                  return "https://" + s.slice(0, slash).toLowerCase() + s.slice(slash);
                }
                return `https://${host}/${s.replace(/^@/, "")}`;
              };
              return [
                `https://www.manyvids.com/Profile/${id}/${handle}/Store/Videos`,
                norm(insta, "instagram.com"),
                norm(tw, "twitter.com"),
              ]
                .filter(Boolean)
                .join("\n");
        split: "\n"
      Birthdate:
        selector: dob
        postProcess:
          - parseDate: 2006-01-02T15:04:05.000
          - parseDate: 2006-01-02T15:04:05.000Z
      Ethnicity: ethnicity
      Country: location
      HairColor: hairColor
      CareerStart:
        selector: createdAt
        postProcess:
          - replace:
              - regex: '\-.*'
                with: ""
              - regex: "$"
                with: " - Present"
          - javascript: |
              const m = value.match(/\d{4}/);
              return m ? m[0] : "";
      CareerEnd:
        selector: createdAt
        postProcess:
          - replace:
              - regex: '\-.*'
                with: ""
              - regex: "$"
                with: " - Present"
          - javascript: |
              // only a real second year counts as an end - "Present"/"-" mean ongoing
              const years = value.match(/\d{4}/g) || [];
              return years.length > 1 ? years[years.length - 1] : "";
      Images: portrait
      Details: description
  sceneSearch:
    scene:
      Title: vids.#.title
      Code: vids.#.id
      URLs:
        selector: "vids.#.{id,slug}.@values"
        postProcess:
          - replace:
              - regex: '\["(\d+)",\s*"([^"]+)"\]'
                with: $1/$2
              - regex: ^
                with: https://www.manyvids.com/Video/
      Image: vids.#.thumbnail.url
  sceneScraper:
    scene:
      Title:
        selector: data.title
        postProcess:
          - replace:
              - regex: "&amp;"
                with: "&"
          - replace:
              - regex: "&quot;"
                with: '"'
          - replace:
              - regex: "&lt;"
                with: "<"
          - replace:
              - regex: "&gt;"
                with: ">"
      Details:
        selector: data.description
        postProcess:
          - replace:
              - regex: "&amp;"
                with: "&"
          - replace:
              - regex: "&quot;"
                with: '"'
          - replace:
              - regex: "&lt;"
                with: "<"
          - replace:
              - regex: "&gt;"
                with: ">"
      Code: data.id
      URLs:
        selector: data.url
        postProcess:
          - replace:
              - regex: ^
                with: https://www.manyvids.com
      Date:
        selector: data.launchDate
        postProcess:
          - parseDate: 2006-01-02T15:04:05.000Z
      Image: data.screenshot
      Tags:
        Name: data.tagList.#.label
      Performers:
        Name: data.model.displayName
        URLs:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com
      Studio:
        Name: data.model.displayName
        URLs:
          selector: data.model.profileUrl
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.manyvids.com

name: GIGA
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.akiba-web.com/search/index.php?menu=1&keyword={filename}&search=OK
  queryURLReplace:
    filename:
      - regex: \..+$
        with: ""
  scraper: sceneSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - www.akiba-web.com/
      - akiba-web.com/
    scraper: sceneScraper
    queryURL: "{url}"
sceneByName:
  action: scrapeXPath
  queryURL: https://www.akiba-web.com/search/index.php?menu=1&keyword={}&search=OK
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $videoItem: //*[@id="list"]
    scene:
      Code:
        selector: $videoItem/ul/li/ul[1]/li[1]/dl[1]/dd
      Date:
        selector: $videoItem/ul/li[2]/ul/li[1]/dl[2]/dd
        postProcess:
          - parseDate: "2006/01/02"
      Details:
        selector: $videoItem/ul/li/a/img/@alt
        postProcess:
          - replace:
              - regex: "， "
                with: ", "
              - regex: "\\."
                with: ".\n\n$1"
              - regex: "\\.\n\n\\.\n\n\\.\n\n"
                with: "..."
      Director: $videoItem/ul/li[2]/ul/li[2]/dl[1]/dd[1]
      Image:
        selector: $videoItem/ul/li/a/img/@src
        postProcess:
          - replace:
              - regex: pac_s.jpg
                with: pac_l.jpg
      Performers:
        Name: $videoItem/ul/li[2]/ul/li[2]/dl[2]/dd[1]/ul[1]/li
      Studio:
        Name:
          fixed: "Giga"
      Title:
        selector: $videoItem/ul/li/ul[1]/li[1]/dl[1]/dd | //*[@id="list"]/h4/a
        concat: " "
        postProcess:
          - replace:
              - regex: "， "
                with: ", "
      URL:
        selector: $videoItem/ul/li/a/@href
        postProcess:
          - replace:
              - regex: .*\/....*\/
                with: https://www.akiba-web.com/product/
  sceneScraper:
    common:
      $meta: //div[@id="works_txt"][ul/li/dl/dt[text()="Product No"]]
    scene:
      Code: $meta/ul/li/dl[dt="Product No"]/dd
      Date:
        selector: $meta/ul/li/dl[dt="Release Date"]/dd
        postProcess:
          - parseDate: "2006/01/02"
      Details:
        selector: //div[@id="story_list2"]//li[@class="story_window"]/text()[1]
        postProcess:
          - replace:
              - regex: "， "
                with: ", "
              - regex: "\\."
                with: ".\n\n$1"
              - regex: "\\.\n\n\\.\n\n\\.\n\n"
                with: "..."
      Director: $meta/ul/li/dl[dt="Director"]/dd/a
      Image:
        selector: //div[@id="works_pic"]//img/@src
        postProcess:
          - replace:
              - regex: pac_s.jpg
                with: pac_l.jpg
      Performers:
        Name: $meta/ul/li/dl[dt="Actress"]/dd//a
      Studio:
        Name:
          fixed: "Giga"
      Title: //div[@id="works_pic"]//h5
      URL:
        selector: //form[@name="form1"]/@action
        postProcess:
          - replace:
              - regex: .*product_id=(\d+).*
                with: https://www.akiba-web.com/product/index.php?product_id=$1

debug:
  printHTML: true
driver:
  headers:
    - Key: Referer
      Value: https://www.akiba-web.com/
  cookies:
    - CookieURL: "https://www.akiba-web.com"
      Cookies:
        - Name: "old_check"
          Domain: ".www.akiba-web.com"
          Value: "yes"
          Path: "/"
        - Name: PHPSESSID
          Domain: ".www.akiba-web.com"
          # Replace this value with the one from your browser
          Value: af2dea453ifcd7jqlen3bvvf7m
          Path: "/"

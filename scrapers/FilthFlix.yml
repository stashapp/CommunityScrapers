name: FilthFlix
sceneByURL:
  - action: scrapeXPath
    url:
      - filthflix.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h2[@class="video__headline"]
      Date:
        selector: //strong[contains(text(),"Published:")]/following-sibling::text()
        postProcess:
          - parseDate: 02 Jan 2006
      Performers:
        Name: //div[contains(@class,"video__pornstars")]/a[contains(@href,"/models/")]
      Tags:
        Name: //div[@class="video__tags"]/a
      Details: //p[@class="video__text"]/text()[1]
      Image: >-
        //div[@class="video__player"]/video/@poster |
        //div[@class="video__player"]/img/@src
      Studio:
        Name: //div[@class="video__top__item"]/a/img/@alt

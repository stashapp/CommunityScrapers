name: Timestamp.trade

sceneByURL:
  - action: scrapeJson
    url:
      - timestamp.trade/scene/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: scene
          with: json-scene

sceneByFragment:
  action: scrapeJson
  scraper: sceneSearch
  queryURL: https://timestamp.trade/hash_lookup?md5={checksum}&ohash={oshash}

galleryByURL:
  - action: scrapeJson
    url:
      - timestamp.trade/scene/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: scene
          with: json-scene
  - action: scrapeJson
    url:
      - timestamp.trade/gallery/
    scraper: galleryScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: gallery
          with: json-gallery

galleryByFragment:
  action: scrapeJson
  scraper: galleryFragScraper
  queryURL: https://timestamp.trade/gallery-md5/{checksum}

jsonScrapers:
  sceneSearch:
    scene:
      Title: 0.title
      Details: 0.description
      URLs:
        selector: 0.id
        postProcess:
          - replace:
              - regex: ^
                with: https://timestamp.trade/scene/

  sceneScraper:
    scene:
      Title: title
      Date: release_date
      Image: cover_url
      Details: description
      URLs: urls
      Studio:
        Name: studio_name
      Performers:
        Name: performers.#.name
      Tags:
        Name: tags.#.name
    gallery:
      Title: title
      Date: release_date
      Details: description
      URLs: urls
      Studio:
        Name: studio_name
      Performers:
        Name: performers.#.name
      Tags:
        Name: tags.#.name
  galleryScraper:
    gallery:
      Title: title
      Date: release_date
      Details: description
      URLs: urls.#.url
      Studio:
        Name: studio.name
      Performers:
        Name: performers.#.name
      Tags:
        Name: tags.#.name
  galleryFragScraper:
    gallery:
      Title: 0.title
      Date: 0.release_date
      Details: 0.description
      URLs: 0.urls.#.url
      Studio:
        Name: 0.studio.name
      Performers:
        Name: 0.performers.#.name
      Tags:
        Name: 0.tags.#.name

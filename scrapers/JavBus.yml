name: Javbus
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.javbus.com/{filename}
  queryURLReplace:
    filename:
      - regex: -JG\d
        with: ""
      # Drop disc/site junk tokens that look like codes (CD1, DISC2, JAV24, ...) so the real
      # code is picked even when such junk appears before it in the filename.
      - regex: (?i)\b(CD|DVD|DISC|PART|JAV)[-_ ]?\d{1,3}\b
        with: " "
      # Extract the first LETTERS-DIGITS code and normalize to LETTERS-DIGITS: dashless
      # (DDT246), spaced/underscored, and double-dash ([GTJ--010]) names all become e.g.
      # DDT-246 for the javbus.com/<code> lookup. Replaces the previous expression, which
      # picked the LAST code-like token (e.g. a trailing -CD1), required text after the code
      # (so a bare code at the end of the name failed), and left dashless codes dashless (404).
      - regex: ^.*?([A-Za-z]{2,6})[-_ ]*(\d{2,5}).*$
        with: $1-$2
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - https://www.javbus.com
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.javbus.com/search/{}&type=&parent=ce
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

performerByURL:
  - action: scrapeXPath
    url:
      - https://www.javbus.com
    scraper: performerScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.javbus.com/searchstar/{}&type=&parent=ce
  scraper: performerSearch

xPathScrapers:
  performerSearch:
    performer:
      Name: //span[@class="mleft"]/text()
      URLs: //*[@id="waterfall"]/div/a/@href
  performerScraper:
    common:
      $info: //*[@id="waterfall"]/div[1]//div[@class="photo-info"]
    performer:
      Name: $info/span
      Birthdate:
        selector: $info/p[contains(., "生日")]
        postProcess:
          - replace:
              - regex: ^[^:]+:\s*
                with: ""
      Height:
        selector: $info/p[contains(., "身高")]
        postProcess:
          - replace:
              - regex: ^[^:]+:\s*(\d+)cm$
                with: $1
      Measurements:
        selector: $info/p[contains(., "罩杯") or contains(., "胸圍") or contains(., "腰圍") or contains(., "臀圍")]
        concat: "|"
        postProcess:
          - javascript: |
              const f = {};
              for (const p of value.split("|")) {
                const m = p.match(/^(\S+?):\s*(\S+?)(cm)?$/);
                if (m) f[m[1]] = m[2];
              }
              if (!f["胸圍"] || !f["腰圍"] || !f["臀圍"]) return "";
              return `${f["胸圍"]}${f["罩杯"] || ""}-${f["腰圍"]}-${f["臀圍"]}`;
      Images:
        selector: //*[@id="waterfall"]/div[1]//div[@class="photo-frame"]/img/@src
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.javbus.com/

  sceneSearch:
    common:
      $item: //*[@id="waterfall"]/div/a[@class="movie-box"]
    scene:
      Title: $item//div[@class="photo-info"]/span/text()[1]
      Code: $item//div[@class="photo-info"]/span/date[1]
      Date: $item//div[@class="photo-info"]/span/date[2]
      URLs: $item/@href
      Image:
        selector: $item//div[@class="photo-frame"]/img/@src
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.javbus.com/
  sceneScraper:
    common:
      $info: //div[@class="col-md-3 info"]
    scene:
      Title:
        selector: //div[@class="container"]/h3 | //div[@class="star-name"]/a
        concat: "\x01"
        postProcess:
          - javascript: |
              const [heading, ...names] = value.split("\x01");
              let title = heading.replace(/^\S+\s+/, "");
              let trimmed = true;
              while (trimmed) {
                trimmed = false;
                for (const name of names) {
                  if (title.endsWith(" " + name)) {
                    title = title.slice(0, -(name.length + 1));
                    trimmed = true;
                  }
                }
              }
              return title;
      Code: $info/p[span[contains(., "識別碼")]]/span[2]
      URLs: /html/head/link[@hreflang="zh"]/@href
      Date: $info/p[span[contains(., "發行日期")]]/text()
      Tags:
        Name: $info//span[@class="genre"]/label/a
      Performers:
        Name: //div[@class="star-name"]/a
      Director: $info/p[span[contains(., "導演")]]/a
      Image:
        selector: //div[@class="row movie"]/div[@class="col-md-9 screencap"]/a[@class="bigImage"]/img/@src
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.javbus.com/
      Studio:
        Name: $info/p[span[contains(., "發行商")]]/a | $info[not(p/span[contains(., "發行商")])]/p[span[contains(., "製作商")]]/a

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0
    - Key: Accept-Language
      Value: zh-cn

# Same Rogue Bucks template as SmutPuppet: any fixes made here might apply there as well
name: DreamTranny
sceneByName:
  action: scrapeXPath
  queryURL: https://dreamtranny.com/updates/?q={}
  scraper: sceneListScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://dreamtranny.com/updates/?q={title}
  queryURLReplace:
    title: &encodeTitle
      - regex: "&"
        with: "%26"
      - regex: \s+
        with: "+"
  scraper: sceneFromSearch
sceneByURL:
  - action: scrapeXPath
    url:
      - dreamtranny.com
    scraper: sceneScraper
galleryByFragment:
  action: scrapeXPath
  queryURL: https://dreamtranny.com/updates/?q={title}
  queryURLReplace:
    title: *encodeTitle
  scraper: galleryFromSearch
galleryByURL:
  - action: scrapeXPath
    url:
      - dreamtranny.com
    scraper: galleryScraper
performerByName:
  action: scrapeXPath
  queryURL: https://dreamtranny.com/updates/?q={}
  scraper: performerSearch
performerByURL:
  - action: scrapeXPath
    url:
      - dreamtranny.com/models/
    scraper: performerScraper
xPathScrapers:
  sceneListScraper:
    common:
      $card: //div[contains(@class, "video-item")]//div[@class="item-content"]
    scene:
      Title: $card/div[1]/a
      Image: //div[contains(@class, "video-item")]//a[@class="item-thumb"]/img/@src
      Date:
        selector: $card/div[2]/p
        postProcess:
          - parseDate: Jan 2, 2006
      URLs:
        selector: $card/div[1]/a/@href
        postProcess:
          - &absolute
            replace:
              - regex: ^(/[^?]*).*
                with: https://dreamtranny.com$1
  sceneScraper:
    scene:
      Title: &titleSel //div[@class="section-title"]/h4
      Details: &detailsAttr
        selector: //p[@class="read-more"]/text()
        concat: "\n\n"
      Date: &dateAttr
        selector: //small[@class="updated-at"]
        postProcess:
          - parseDate: Jan 2, 2006
      Performers:
        Name: &performerName //a[contains(@class, "model-name")]
        URLs: &performerUrl
          selector: //a[contains(@class, "model-name")]/@href
          postProcess:
            - *absolute
      Image: &imageSel >-
        //video[contains(@class,"video-js")]/@poster
        |
        //div[contains(@class,"model-player")]//img/@src
        |
        //video[contains(@class,"vjs")]/@poster
      Studio: &studioAttr
        Name:
          fixed: Dream Tranny
        URLs:
          fixed: https://dreamtranny.com/
      Tags: &tagsAttr
        Name: //div[@class="model-categories"]/a
      URLs: &urlAttr //link[@rel="canonical"]/@href
      Code: &codeAttr
        selector: //script[contains(.,"API_VIEW_URLS")]/text()
        postProcess:
          - replace:
              - regex: .*/api/update/(\d+)/view_count.*
                with: "$1"
  sceneFromSearch:
    common:
      $first: (//div[contains(@class, "video-item")]//div[@class="item-content"]/div[1]/a/@href)[1]
    scene:
      Title: &firstTitle
        selector: $first
        postProcess:
          - *absolute
          - subScraper: *titleSel
      Details: &firstDetails
        selector: $first
        postProcess:
          - *absolute
          - subScraper: *detailsAttr
      Date: &firstDate
        selector: $first
        postProcess:
          - *absolute
          - subScraper: //small[@class="updated-at"]
          - parseDate: Jan 2, 2006
      Performers:
        Name: &firstPerformerName
          selector: $first
          postProcess:
            - *absolute
            - subScraper:
                selector: //a[contains(@class, "model-name")]
                concat: "|"
          split: "|"
        URLs: &firstPerformerUrl
          selector: $first
          postProcess:
            - *absolute
            - subScraper:
                selector: //a[contains(@class, "model-name")]/@href
                concat: "|"
            - replace:
                - regex: (^|\|)/
                  with: ${1}https://dreamtranny.com/
          split: "|"
      Image:
        selector: $first
        postProcess:
          - *absolute
          - subScraper: *imageSel
      Studio: *studioAttr
      Tags: &firstTags
        Name:
          selector: $first
          postProcess:
            - *absolute
            - subScraper:
                selector: //div[@class="model-categories"]/a
                concat: "|"
          split: "|"
      URLs: &firstUrl
        selector: $first
        postProcess:
          - *absolute
      Code: &firstCode
        selector: $first
        postProcess:
          - replace:
              - regex: .*/update/(\d+)/.*
                with: $1
  galleryScraper:
    gallery:
      Title: *titleSel
      Details: *detailsAttr
      Date: *dateAttr
      Tags: *tagsAttr
      Performers:
        Name: *performerName
        # singular URL on purpose: stash maps a plural URLs key on gallery
        # performers as multi-value, assigning every match to the first one
        URL: *performerUrl
      Studio: *studioAttr
      URLs: *urlAttr
      Code: *codeAttr
  galleryFromSearch:
    common:
      $first: (//div[contains(@class, "video-item")]//div[@class="item-content"]/div[1]/a/@href)[1]
    gallery:
      Title: *firstTitle
      Details: *firstDetails
      Date: *firstDate
      Tags: *firstTags
      Performers:
        Name: *firstPerformerName
        # singular URL on purpose, as in galleryScraper
        URL: *firstPerformerUrl
      Studio: *studioAttr
      URLs: *firstUrl
      Code: *firstCode
  performerSearch:
    common:
      $talent: //div[contains(@class, "video-item")]//a[contains(@class, "item-talent")][not(@href = preceding::a[contains(@class, "item-talent")]/@href)]
    performer:
      Name: $talent
      URLs:
        selector: $talent/@href
        postProcess:
          - *absolute
  performerScraper:
    performer:
      Name: //h1[@class="model-title"]
      Gender:
        selector: //a[contains(@class,"item-talent")][text()=//h1[@class="model-title"]/text()]/@class
        postProcess:
          - map:
              item-talent female: Female
              item-talent trans-girl: Transgender Female
      Images: //div[@class="model-img"]/a/img[@class="img"]/@src
      Country: //div[@class="model-content"]/p/span[text()="NATIONALITY"]/following-sibling::span[1]
      Birthdate:
        selector: //div[@class="model-content"]/p/span[text()="DATE OF BIRTH"]/following-sibling::span[1]
        postProcess:
          - replace:
              - regex: (\d)(st|[nr]d|th)
                with: "$1"
          - parseDate: January 2, 2006
      URLs: //link[@rel="canonical"]/@href

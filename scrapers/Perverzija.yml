name: Perverzija
sceneByURL:
  - action: scrapeXPath
    url:
      - tube.perverzija.com
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $h1: //div[@class="title-info"]/h1
      $meta: //div[@class="item-tax-list"]
    scene:
      Title:
        selector: $h1
        postProcess:
          - replace:
              - regex: "^.+? – .+? – "
                with: ""
      URLs: //link[@rel="canonical"]/@href
      Details:
        selector: //div[@class="bialty-container"]/p
        concat: " "
        postProcess:
          - replace:
              - regex: "^Description: "
                with: ""
      Performers:
        Name: $meta/div[2]/a
      Tags:
        Name: $meta/div[3]/a
      Studio:
        Name:
          selector: $h1
          postProcess:
            - replace:
                - regex: " – .+"
                  with: ""
      Image: //div[@id="featured-img-id"]/img/@src

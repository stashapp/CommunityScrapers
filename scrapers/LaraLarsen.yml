name: Lara Larsen

sceneByURL:
  - action: scrapeXPath
    url:
      - laralarsen.com/
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@itemprop='headline']
      Details:
        selector: //div[@itemprop='articleBody']/p
        concat: "\n\n"
      URLs:
        selector: //link[@rel='canonical']/@href
        postProcess:
          - replace:
              - regex: ^https?://web\.archive\.org/web/\d+[a-z_]*/
                with: ""
      Date:
        selector: //time[@itemprop='datePublished']/@content
        postProcess:
          - parseDate: "2006-01-02"
      Image: //div[@itemprop='video']/video/@poster | //meta[@property='og:image']/@content
      Studio:
        Name:
          fixed: Lara Larsen
      Tags:
        Name: //ol[@class='tags']/li/a[@rel='tag']
      Performers:
        Name: //span[@itemprop='author']

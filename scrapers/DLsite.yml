name: DLsite
sceneByFragment:
  action: scrapeXPath
  # expects RJ code as the title
  queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html
  #queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html/?locale=en_US
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - dlsite.com/maniax/work/
    scraper: sceneScraper
    queryURL: "{url}"
sceneByName:
  action: scrapeXPath
  queryURL: https://www.dlsite.com/maniax/fsr/=/language/jp/sex_category%5B0%5D/male/keyword/{}/order%5B0%5D/trend/per_page/30/from/fs.header
  scraper: sceneQueryScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  #queryURLReplace:
  #  url:
  #    - regex: $
  #      with: "/?locale=en_US"
  scraper: sceneScraper
galleryByFragment:
  action: scrapeXPath
  queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html
  #queryURL: https://www.dlsite.com/maniax/work/=/product_id/{title}.html/?locale=en_US
  scraper: galleryManiaxScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - dlsite.com/maniax/work/
    scraper: galleryManiaxScraper
    queryURL: "{url}"
  - action: scrapeXPath
    url:
      - dlsite.com/books/work/
    scraper: galleryBookScraper
    queryURL: "{url}"

xPathScrapers:
  sceneQueryScraper:
    scene:
      Title: //dd[@class='work_name']/div[@class='multiline_truncate']/a
      URLs: //dd[@class='work_name']/div[@class='multiline_truncate']/a/@href
      Image:
        selector: //thumb-with-ng-filter-block/@*[contains(name(), 'thumb-candidates')]
        postProcess:
          - javascript: |
              const m = /'(\/\/[^']*_img_main)_\d+x\d+\.jpg'/.exec(value);
              if (!m) return "";
              // the listing only links a 240px thumb; modpub holds the full size
              return "https:" + m[1].replace("/resize/", "/modpub/") + ".jpg";
  sceneScraper:
    scene:
      Title: &titleSel //h1[@id='work_name']
      Date: &dateSel
        selector: //dt[text()='販売日' or text()='Release date']/following-sibling::dd
        postProcess:
          - replace:
              - regex: \s.+$
                with: ""
              - regex: ^(\d{4})/(\d+)/(\d+)$
                with: "${1}年${2}月${3}日"
          - parseDate: 2006年1月2日
      Details: &detailsSel
        selector: //section[contains(@class,"c-productContent")]/*
        concat: "\n\n"
      Tags: &tagsSel
        Name: //dt[text()='ジャンル' or text()='Genre']/following-sibling::dd//a
      Performers:
        # only illustrators and voice actors, writers and musicians are not included
        Name: //dt[text()='声優' or text()='Voice Actor' or text()='イラスト' or text()='Illustration']/following-sibling::dd//a
      Studio: &studioSel
        Name: //*[contains(@class,"c-productInfo__makerName")]
      Image: //meta[@property='og:image']/@content
      URLs: &urlSel //link[@rel='canonical']/@href
  galleryManiaxScraper:
    gallery:
      Title: *titleSel
      Date: *dateSel
      Details: *detailsSel
      Tags: *tagsSel
      # only illustrators
      Performers:
        Name: //dt[text()='イラスト' or text()='Illustration']/following-sibling::dd//a
      Studio: *studioSel
      URLs: *urlSel
  galleryBookScraper:
    gallery:
      Title: *titleSel
      Date: *dateSel
      Details: *detailsSel
      Tags: *tagsSel
      Performers:
        # for maniax author is the writer, for books this is illustrators
        Name: //dt[text()='著者' or text()='Author']/following-sibling::dd//a
      Studio: *studioSel
      URLs: *urlSel

name: TripForFuck
sceneByURL:
  - action: scrapeXPath
    url:
      - tripforfuck.com/member/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[contains(@class, "h3")]
      Date:
        selector: //div[contains(@class, "movie-status")]/p
        postProcess:
          - replace:
              - regex: (\d),(\d)
                with: $1$2
              - regex: (\d+).+
                with: $1
          - subtractDays: true
      Performers:
        Name: //div[@class="container"]//p[contains(@class, "mb-0")]/a
      Tags:
        Name: //div[contains(@class, "search-tags")]/a
      Details: //div[@class="container"]/p
      Image:
        selector: //img[contains(@class, "mh-100") and contains(@class, "mw-100")]/@data-src
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.tripforfuck.com"
      Studio:
        Name:
          fixed: TripForFuck

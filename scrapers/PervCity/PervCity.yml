name: PervCity
sceneByURL:
  - action: scrapeXPath
    url:
      - analoverdose.com/trailers/
      - bangingbeauties.com/trailers/
      - chocolatebjs.com/trailers/
      - oraloverdose.com/trailers/
      - pervcity.com/trailers/
      - upherasshole.com/trailers/
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: (?:^.+\.com)(/.+)
          with: https://pervcity.com$1
  - action: scrapeXPath
    url:
      - dpdiva.com/trailers/
    scraper: dpdivaScraper

xPathScrapers:
  sceneScraper:
    common:
      $sceneinfo: //div[@class="scene-info"]
      $image: //img[contains(@class,'posterimg')]
    scene:
      Title: //h1[@class="scene-title"]
      Code: &code
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: https.+/content/(\w+\-\d{4})\-.*/\d.+?$
                with: $1
      Studio: &studio
        Name:
          selector: //meta[@property="og:image"]/@content
          postProcess:
            - replace:
                - regex: https.+/content/(\w+\-\d{4})\-.*/\d.+?$
                  with: $1
                - regex: (?:-.+)
                  with:
            - javascript: |
                if (value && value.length) {
                  return value.toUpperCase()
                }
            - map:
                AO: Anal Overdose
                BAM: PervCity
                BB: Banging Beauties
                BTS: PervCity
                CBJ: Chocolate BJs
                DPD: DP Diva
                LISC: PervCity
                OO: Oral Overdose
                SOLO: PervCity
                UHA: Up Her Asshole
      Performers:
        Name: //div[@class="scene-featuring"]//span[@class="tour_update_models"]/a
      Tags:
        Name: $sceneinfo//div[@class="tagcats"]/a
      Details: $sceneinfo//div[@class="scene-desc"]
      Image: &sceneimage
        selector: //head/base/@href | $image/@src0_1x
        concat: __SEP__
        postProcess:
          - replace:
              - regex: ^(https://[^/]+/)__SEP__https://[^/]+/(.+?)-1x\.jpg.*$
                with: $1$2-full.jpg
      Date:
        selector: $sceneinfo//div[contains(@class, "scene-meta")]/span[1]
        postProcess:
          - parseDate: 01-02-2006
      URLs: //link[@rel="canonical"]/@href

  dpdivaScraper:
    common:
      $sceneinfo: //div[@class="videoInfo"]
      $image: //img[contains(@class,'posterimg')]
    scene:
      Title: $sceneinfo/div[@class="infoHeader"]
      Image: *sceneimage
      Tags:
        Name: $sceneinfo//div[@class="tagcats"]/a
      Studio: *studio
      Details: $sceneinfo//h3[@class="description"]/text()|$sceneinfo//p/text()
      Performers:
        Name: $sceneinfo//span[@class="tour_update_models"]/a
      Code: *code
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: $sceneinfo/div[@class="infoHeader"]
        postProcess:
          - replace:
              - regex: \s|-|\'|’|,
                with: "_"
              - regex: "&"
                with: "%26"
              - regex: ^
                with: https://dpdiva.com/search.php?query=
          - subScraper:
              selector: //div[@class="category_listing_block"]//div[@class="date"]
              postProcess:
                - parseDate: 01-02-2006

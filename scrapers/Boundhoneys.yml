name: Boundhoneys
sceneByURL:
  - action: scrapeXPath
    url:
      - boundhoneys.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="updateVideoTitle"]
      Details: //div[@class="updateDescription"]/b
      URLs: //link[@rel="canonical"][contains(@href, "/bondage-video/")]/@href
      Image: //meta[@name="twitter:image"]/@content
      Studio:
        Name:
          fixed: BoundHoneys
      Tags:
        Name: //div[@class=" updateCategoriesList"]/a
      Performers:
        Name: //div[@class="updateModelsList"]/a

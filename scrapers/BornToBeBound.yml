name: BornToBeBound
sceneByURL:
  - action: scrapeXPath
    url:
      - https://borntobebound.com/updates/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h2[@class="art-PostHeader"]/a
      Code: //input[@name="comment_post_ID"]/@value
      # content isn't consistently wrapped in p vs div, and "run time" is
      # sometimes its own sibling, sometimes nested inside the content div
      Details:
        selector: >-
          //div[@class="art-PostContent"][.//div[@id="gallery-1"]]/*[self::p or self::div]
          [preceding-sibling::div[@id="gallery-1"]]
          [normalize-space(.)]
          [not(starts-with(normalize-space(.), "run time"))]
          [not(contains(translate(., "ABCDEFGHIJKLMNOPQRSTUVWXYZ", "abcdefghijklmnopqrstuvwxyz"), "right click here"))]
          [not(contains(translate(., "ABCDEFGHIJKLMNOPQRSTUVWXYZ", "abcdefghijklmnopqrstuvwxyz"), "free preview clip"))]
        concat: "\n\n"
        postProcess:
          - replace:
              - regex: '(?i)run time(\s+\w+)?\s+\d+\s+minutes?(\s+and\s+\d+\s+seconds?)?\.?'
                with: ""
      Date:
        selector: //div[@class="art-PostMetadataHeader"]/div[contains(@class,"art-metadata-icons")]
        postProcess:
          - replace:
              - regex: (st|nd|rd|th),
                with: ""
          - parseDate: January 2 2006
      Studio:
        Name:
          fixed: Born to be Bound
      Image:
        selector: (//div[@id="gallery-1"]//img/@src)[1]
        postProcess:
          - replace:
              - regex: -150x150
                with: ""
      # tags includes mix of performers and content tags
      # p=60260 vs p=10032
      Performers:
        Name: //a[@rel="tag"]
      Tags:
        Name: //a[@rel="tag"]

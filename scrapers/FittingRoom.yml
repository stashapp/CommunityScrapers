name: "FittingRoom"
sceneByURL:
  - action: scrapeXPath
    url:
      - fitting-room.com/videos/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - fitting-room.com/albums/
    scraper: galleryScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //head/title
      Details: //meta[@name="twitter:description"]/@content
      Performers:
        Name: //div[@class="item"][contains(., "Models:")]/a
      Tags:
        Name: //meta[@property="video:tag"]/@content
      Studio:
        Name:
          fixed: Fitting-Room
      Image: //meta[@name="twitter:image"]/@content
      URL: //meta[@property="og:url"]/@content
  galleryScraper:
    gallery:
      Title: //head/title
      Details: //meta[@name="twitter:description"]/@content
      Performers:
        Name: //div[@class="item"][contains(., "Models:")]/a
      Tags:
        Name: //meta[@property="video:tag"]/@content
      Studio:
        Name:
          fixed: Fitting-Room
      URL: //meta[@property="og:url"]/@content

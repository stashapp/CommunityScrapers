name: Kayla Kleevage
sceneByURL:
  - action: scrapeJson
    url:
      - tour.kaylakleevage.com/video/
    queryURL: https://nats.iocash.com/tour_api.php/content/sets?cms_block_id=101248&data_types=1&slug={url}
    queryURLReplace:
      url:
        - regex: .+/video/([^/?#]+).*
          with: $1
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - kaylakleevage.com/tour/
    scraper: archivedScraper
jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: sets.0.name
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Details: sets.0.description
      Date: sets.0.added_nice
      URLs:
        selector: sets.0.slug
        postProcess:
          - replace:
              - regex: ^
                with: https://tour.kaylakleevage.com/video/
      Image:
        selector: sets.0.preview_formatted.thumb.@values|@reverse.0.0.[fileuri,signature].@tostr
        postProcess:
          - replace:
              - regex: ^\["(.*)","(.*)"\]$
                with: $1?$2
              - regex: \\/
                with: /
              - regex: ^
                with: https://c81cc3abe2.mjedge.net
      Tags:
        Name: sets.0.[data_types.#(shortname=="category").data_values.#.name,data_types.#(shortname=="tags").data_values.#.name].@flatten
      Performers:
        Name: sets.0.data_types.#(shortname=="models").data_values.#.name
      Studio:
        Name:
          fixed: Kayla Kleevage
xPathScrapers:
  archivedScraper:
    scene:
      Title: //h1
      Details: //div[@class="videocontent"]/p
      Image:
        selector: >-
          //base/@href |
          //div[@class="videoplayer"]/img/@src0_4x |
          //div[@class="videoplayer"]/img/@src0_3x |
          //div[@class="videoplayer"]/img/@src0_2x |
          //div[@class="videoplayer"]/img/@src0_1x
        concat: __SEP__
        postProcess:
          - replace:
              - regex: (.*?)__SEP__/tour/(.*?)(:?__SEP).*
                with: $1$2
      Date:
        selector: //div[@class="videodetails"]/p[@class="date"]
        postProcess:
          - replace:
              - regex: "^([0-9/]+).*"
                with: $1
          - parseDate: 01/02/2006
      Tags:
        Name: //div[@class="videodetails"]//a[contains(@href,"categories")]
      Performers:
        Name:
          fixed: Kayla Kleevage
      Studio:
        Name:
          fixed: Kayla Kleevage
driver:
  headers:
    - Key: X-NATS-cms-area-id
      Value: fa35cdfe-ce13-48c2-b79e-9b3115706729
    - Key: X-nats-entity-decode
      Value: "1"

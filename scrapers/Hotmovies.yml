name: Hotmovies
sceneByName:
  action: scrapeXPath
  queryURL: https://www.hotmovies.com/adult-clips/search?sort=score&q={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - hotmovies.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - hotmovies.com
    scraper: movieScraper
performerByURL:
  - action: scrapeXPath
    url:
      - hotmovies.com
    scraper: performerScraper
performerByName:
  action: scrapeXPath
  queryURL: https://www.hotmovies.com/porn-star/search?sort=rank&q={}
  scraper: performerSearch
xPathScrapers:
  sceneScraper:
    common:
      $clipCover: //a[@id="front-cover"][//meta[@name="og:url" and contains(@content, "/adult-clips/")]]
    scene:
      Title: //h1/text()
      Tags:
        Name: //meta[@property="og:video:tag"]/@content
      Performers:
        Name: //meta[@property="og:video:actor"]/@content
        URLs:
          selector: //a[@label="Performer"]/@href
          postProcess: &baseUrl
            - replace:
                - regex: ^/
                  with: https://www.hotmovies.com/
      URLs: //meta[@name="og:url"]/@content
      ProductionDate:
        selector: //li[strong[contains(text(), "Production Year")]]
        postProcess:
          - replace:
              - regex: .*(\d{4}).*
                with: $1
      Groups:
        Name: $clipCover/img/@title
        URLs:
          selector: $clipCover/@href
          postProcess: *baseUrl
        FrontImage:
          selector: $clipCover/img/@src
          postProcess: &fullCover
            - replace:
                - regex: ([?&])w=\d+&h=\d+
                  with: ${1}w=500&h=700
        BackImage:
          selector: $clipCover/img/@src
          postProcess:
            - replace:
                - regex: ([?&])w=\d+&h=\d+
                  with: ${1}w=500&h=700
                - regex: $
                  with: "&v=back"
      Studio:
        Name: //a[@data-tl="studio"]
        URLs:
          selector: //a[@data-tl="studio"]/@href
          postProcess: *baseUrl
      Image: //meta[@property="og:image"]/@content
      Date: //meta[@property="og:video:release_date"]/@content
  movieScraper:
    group:
      Name: //h1/text()
      URLs:
        selector: //meta[@name="og:url"]/@content
        postProcess:
          - replace:
              - regex: \?.*
                with: ""
      Director: //a[@label="Director"][1]
      Duration:
        selector: //strong[contains(text(), "Run Time")]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: " hrs. "
                with: ":"
              - regex: " mins."
                with: ":00"
      Studio:
        Name: //a[@label="Studio"][1]
        URLs:
          selector: //a[@label="Studio"][1]/@href
          postProcess: *baseUrl
      Synopsis: //article
      FrontImage:
        selector: //a[@id="front-cover"]/img/@src
        postProcess: *fullCover
      BackImage:
        selector: //a[@id="front-cover"]/img/@src
        postProcess:
          - replace:
              - regex: ([?&])w=\d+&h=\d+
                with: ${1}w=500&h=700
              - regex: $
                with: "&v=back"
      Date: //meta[@property="og:video:release_date"]/@content
      Tags:
        Name: //strong[contains(text(), "Categories:")]/following-sibling::a
  performerSearch:
    performer:
      Name: //div[@id="performerlist"]//picture/img/@title
      URLs:
        selector: //div[@id="performerlist"]//a[@class="performer-grid-list__performer__thumb"]/@href
        postProcess: *baseUrl
      Image: //div[@id="performerlist"]//picture/img/@src
  performerScraper:
    performer:
      URLs: //meta[@name="og:url"]/@content
      Name: //meta[@name="og:title"]/@content
      Gender: //meta[@property="og:profile:gender"]/@content
      Birthdate:
        selector: //title[contains(text(), 'Born:')]
        postProcess:
          - replace:
              - regex: ^.*Born:\s([^\.]*).*$
                with: $1
          - parseDate: January 2 2006
      Country:
        selector: //small[text()="From:"]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: .*,\s
                with: ""
      EyeColor:
        selector: //small[text()="Eyes:"]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: \sEyes
                with: ""
      Height:
        selector: //small[text()="Height:"]/following-sibling::text()[1]
        postProcess:
          - feetToCm: true
      Measurements:
        selector: //small[text()="Stats:"]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: '[ "]'
                with: ""
      Image: //a[@class="star__profile__headshot fancy"]/@href
      HairColor:
        selector: //title[contains(text(), ' hair')]
        postProcess:
          - replace:
              - regex: ^.*?(\w*)\shair.*$
                with: $1
      Details: //article
      Aliases:
        selector: //title[contains(text(), 'AKA:')]
        postProcess:
          - replace:
              - regex: ^.*AKA:\s([^\.]*).*$
                with: $1
        split: ", "
      Weight:
        selector: //title[contains(text(), ' pounds')]
        postProcess:
          - replace:
              - regex: ^.*?(\w*)\spounds.*$
                with: $1
          - lbToKg: true
  sceneSearch:
    scene:
      Title: //div[@class="animated-scene-title"]
      URLs:
        selector: //a[@class="animated-screen"]/@href
        postProcess: *baseUrl
      Image: //img[@class="animate screenshot"]/@src
      Groups:
        Name: //div[@class="animated-scene-hiddentxt"]/a/i
        URLs:
          selector: //div[@class="animated-scene-hiddentxt"]/a/@href
          postProcess: *baseUrl

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper
    - Key: Cookie
      Value: ageConfirmed=true

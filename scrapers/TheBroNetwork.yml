name: The Bro Network
sceneByURL:
  - action: scrapeXPath
    url:
      - thebronetwork.com
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      # masqulin.com was folded into thebronetwork.com; its own redirects land
      # on a generic category page rather than the matching scene, but the
      # scene exists at the identical /updates/ path on thebronetwork.com
      - masqulin.com
    scraper: sceneScraper
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: masqulin\.com
          with: thebronetwork.com

performerByURL:
  - action: scrapeXPath
    url:
      - https://thebronetwork.com/models
    scraper: performerScraper

xPathScrapers:
  sceneScraper:
    common:
      # Scope every field to the single scene's own container - a soft-404
      # fallback page (e.g. a retired masqulin.com scene with no thebronetwork.com
      # equivalent) has no gallery_info spacer at all, but does show unrelated
      # teaser cards using these same class names, so unscoped selectors would
      # silently grab a different scene's data instead of correctly finding nothing
      $gallery: //div[@class="gallery_info spacer"]
    scene:
      Title: $gallery/h1
      Performers:
        Name: $gallery//span[@class="tour_update_models"]/a
      Tags:
        Name: $gallery//a[@class="tagsVideoPage"]
      Details: $gallery//p[@id="textDesc"]
      # trailervid lives outside the gallery_info container, but its id is
      # unique to a real scene page so it's already safe unscoped
      Image: //video-js[@id="trailervid"]/@poster
      Date:
        selector: $gallery//span[@class='availdate'][1]
        postProcess:
          - parseDate: Jan 02, 2006
      Studio:
        Name:
          fixed: The Bro Network
  performerScraper:
    performer:
      Name: //div[@class="heroTitle"]//h1/text()
      Gender:
        fixed: Male
      HairColor:
        selector: //span[contains(text(),"Hair color")]/following-sibling::text()
      EyeColor:
        selector: //span[contains(text(),"Eye color")]/following-sibling::text()
      Height:
        selector: //span[contains(text(),"Height:")]/following-sibling::text()
        postProcess:
          - feetToCm: true
      Circumcised: //span[contains(text(),"Cock:")]/following-sibling::text()
      PenisLength:
        selector: //span[contains(text(),"Cock Size:")]/following-sibling::text()
        postProcess:
          - replace:
              - regex: ^
                with: "0'"
          - feetToCm: true
      Image: //div[@class="model_picture"]/img/@src

name: Hot Legs and Feet
sceneByURL:
  - action: scrapeXPath
    url:
      - hotlegsandfeet.fans/tour/trailers/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="videoDetails clear"]/h3
      Details: //div[@class="videoDetails clear"]/p
      Date:
        selector: //div[@class="videoInfo clear"]/p[span[text()="Date Added:"]]
        postProcess:
          - replace:
              - regex: Date Added:\s*
                with: ""
          - parseDate: January 2, 2006
      Performers:
        Name: //li[@class="update_models"]/a
      Tags:
        Name: >-
          //div[@class="featuring clear"][.//li[@class="label" and contains(text(),"Tags")]]/ul/li[not(@class="label")]/a
      Studio:
        Name:
          fixed: Hot Legs and Feet
      Image:
        selector: //script[contains(text(), "video_content")]
        postProcess:
          - replace:
              - regex: (?s).*poster="([^"]+)".*
                with: $1
              - regex: ^/
                with: https://www.hotlegsandfeet.fans/
              - regex: (-[1-3]x)?\.jpg
                with: -3x.jpg

name: Raw Fuck Club
sceneByURL:
  - action: scrapeXPath
    url:
      - www.rawfuckclub.com/video/
    scraper: sceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - www.rawfuckclub.com/
    scraper: performerScraper
performerByName:
  action: scrapeXPath
  scraper: globalSearch
  queryURL: https://www.rawfuckclub.com/search?search={}&page=1
sceneByFragment:
  action: scrapeXPath
  scraper: globalSearch
  queryURL: https://www.rawfuckclub.com/search?&search={title}%20{filename}&page=1
  queryURLReplace:
    title:
      - regex: \.\w+$
        with: ""
      - regex: '[^a-zA-Z\d\-._~\s]'
        with: ""
      - regex: "[-_]"
        with: ""
      - regex: " "
        with: "%20"
    filename:
      - regex: \.\w+$
        with:
      - regex: '[^a-zA-Z\d\-._~\s]'
        with:
      - regex: " "
        with: "%20"
xPathScrapers:
  sceneScraper:
    common:
      $badges: //div[@class="tag-badges"]/a
    scene:
      Title: //div[contains(@class, "watch-movie-title-row")]//h2
      Performers:
        Name: $badges/span[contains(@class, "text-bg-primary")]
        URLs: $badges[span[contains(@class, "text-bg-primary")]]/@href
      Tags:
        Name: $badges/span[contains(@class, "text-bg-secondary")]
      Details: //p[@class="watch-description"]
      Image: //meta[@property="og:image"]/@content
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: //p[@class="watch-published-date"]
        postProcess:
          - replace:
              - regex: ^(?:Rep|P)osted (?:on )?(.+?)\.?$
                with: $1
          - parseDate: January 2, 2006
      Studio:
        Name: //div[@class="watch-channel-name"]/a[1]
        URLs:
          selector: //div[@class="watch-channel-name"]/a[1]/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: https://www.rawfuckclub.com/
  performerScraper:
    performer:
      Name: //h1[@class="model-header model-header-name"]
      URLs: >
        //link[@rel="canonical"]/@href
        | //a[contains(@href,'instagram.com/')]/@href
        | //a[contains(@href,'twitter.com/') or contains(@href,'x.com/')]/@href
      Details:
        selector: //div[@class="model-description"]/text()
        concat: "\n"
      Images: //div[@class="model-image-placeholder"]/img/@src
      Country:
        selector: //img[contains(@src, "map_pin")]/following-sibling::span[contains(@class, "d-sm-inline-block")]
        postProcess:
          - replace:
              - regex: ^.*,\s*
                with: ""
      Gender:
        fixed: male
  globalSearch:
    performer:
      Name: //div[@class='channel-info-block']/h2/a[1]
      URLs:
        selector: //div[@class='channel-info-block']/h2/a[1]/@href
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.rawfuckclub.com/
    scene:
      Title: //div[@class='last-update-title']/a/@title
      URLs:
        selector: //div[@class='last-update-title']/a/@href
        postProcess:
          - replace:
              - regex: ^/
                with: https://www.rawfuckclub.com/
driver:
  cookies:
    - CookieURL: https://www.rawfuckclub.com
      Cookies:
        - Name: CONSENT
          Domain: .rawfuckclub.com
          Value: "Y"
          Path: /

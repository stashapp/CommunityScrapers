name: "FamilyTherapyXXX"
sceneByURL:
  - action: scrapeXPath
    url:
      - analtherapyxxx.com
      - familytherapyxxx.com
      - momcomesfirst.com
      - perfectgirlfriend.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
    scene:
      Title: //h1/text()
      Date:
        selector: //span[@class="published"]/text()
        postProcess:
          - parseDate: Jan 2, 2006
      Details:
        selector: //div[@class="entry-content"]/text()[normalize-space()] | //div[@class="entry-content"]/p/text()[normalize-space()]
        concat: "\n"
      Tags:
        Name: //p[@class="post-meta"]//a/text()
      Performers:
        Name:
          selector: //div[@class="entry-content"]/p/[contains(text(),'***')]
          postProcess:
            - replace:
                - regex: \*+|Starring\s+
                  with:
          split: " & "
      Studio:
        Name:
          selector: //img[@id="logo"]/@alt
          postProcess:
            - map:
                Family Therapy: Family Therapy XXX
      Image:
        selector: //meta[@property="og:image"]/@content

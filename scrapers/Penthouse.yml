name: Penthouse Gold
sceneByURL:
  - action: scrapeXPath
    url:
      - penthousegold.com/scenes/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //div[@class="scene-title-and-social"]//h1
        postProcess:
          - replace:
              - regex: ^Video\s-\s
                with: ""
      Details: //meta[@itemprop="description"]/@content
      Date:
        selector: //meta[@itemprop="uploadDate"]/@content
        postProcess:
          - parseDate: 01/02/2006
      Studio:
        Name:
          fixed: "Penthouse Gold"
      Performers:
        Name: //div[@class="model"]/a/@title
      Tags:
        Name: //ul[@class="scene-tags"]/li/a
      Image: //meta[@itemprop="thumbnailUrl"]/@content[not(contains(., "/no_video_preview_"))]

driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

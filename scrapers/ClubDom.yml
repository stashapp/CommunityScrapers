name: ClubDom
sceneByURL:
  - action: scrapeXPath
    url:
      - clubdom.com/tour
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - clubdom.com/vod
    scraper: vodScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.clubdom.com/vod/search.php?query={}
  scraper: vodSearch
sceneByFragment:
  action: scrapeXPath
  scraper: vodSearch
  queryURL: https://www.clubdom.com/vod/search.php?st=advanced&qex={title}
  queryURLReplace:
    title:
      - regex: " "
        with: "+"
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: vodScraper
xPathScrapers:
  sceneScraper:
    common:
      $trailer: //strong[contains(., "Release date:")]
    scene:
      Title: //span[@class="left"]/h1[$trailer]
      Date:
        selector: $trailer/following-sibling::text()
        postProcess:
          - parseDate: 01/02/2006
      # TODO: enable when scrape dialog can show durations
      # Duration: //strong[contains(., "Runtime:")]/following-sibling::text()
      Performers:
        Name: //span[@class="models_list"]//a
      Tags:
        Name: //span[@class="categories"]//a
      Image:
        # src0_2x/3x/4x are plain upscales of src0_1x, at 5-6x the bytes
        selector: //div[@class="videoplayer"]/img[$trailer]/@src0_1x
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
      Studio:
        Name:
          selector: //span[@class="left"]/h1[$trailer]
          postProcess:
            - replace:
                - regex: ^.+$
                  with: Club Dom
  # This could be in Andomark but we'd lose the sceneByName functionality
  vodScraper:
    common:
      $vod: //div[@id="download_form"]
    scene:
      Title: //span[@class="title_bar_hilite"][$vod]
      URLs: //div[@class="cell content_tab_current"][$vod]/a/@href
      Date:
        selector: //div[@class="gallery_info"]/div[1]//div[@class="cell update_date"]
        postProcess:
          - parseDate: 01/02/2006
      Performers:
        Name: //div[@class="gallery_info"]/span[@class="update_models"]/a
      Tags:
        Name: //span[@class="update_tags"]/a
      Details: //div[@class="gallery_info"]//span[@class="update_description"]
      Image:
        selector: //base[$vod]/@href|//div[@id="download_form"]/following-sibling::script
        concat: "|"
        postProcess:
          - replace:
              - regex: (.*)/vod/\|.*thumbnail:"(.*)",vtt_file:.*
                with: $1$2
              # scenes with no thumbnail leave the concat unreplaced: drop it
              - regex: (?s)^.*\|.*$
                with: ""
      Studio:
        Name:
          selector: //span[@class="title_bar_hilite"][$vod]
          postProcess:
            - replace:
                - regex: ^.+$
                  with: Club Dom
  vodSearch:
    common:
      $update-details: //div[@class="update_details"]
    scene:
      Title: $update-details/a[2]/text()
      URLs: $update-details/a[2]/@href
      Image:
        # search thumbs are lazy-loaded: no @src, and the path is root-relative
        selector: $update-details/a[1]/img/@src0_1x
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.clubdom.com"

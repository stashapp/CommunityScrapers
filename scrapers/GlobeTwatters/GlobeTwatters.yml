name: Globe Twatters
sceneByURL:
  - action: scrapeJson
    url:
      - asiansexdiary.com/
      - eurosexdiary.com/
      - helloladyboy.com/
      - milftrip.com/
      - trikepatrol.com/
      - tuktukpatrol.com/
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: "[?#].*$"
          with: ""
        - regex: '^https?://(?:www\.)?([^/]+)/(?:.*/)?([^/]+)/?$'
          with: https://$1/wp-json/wp/v2/rest-content?_embed&slug=$2
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - toticos.com/
    scraper: toticosScraper
  # Only scrapable through the Wayback Machine
  - action: scrapeXPath
    url:
      - dateslam.com/
      - screwmetoo.com/
    scraper: legacyScraper

performerByURL:
  - action: scrapeXPath
    url:
      - asiansexdiary.com/model/
      - eurosexdiary.com/model/
      - trikepatrol.com/model/
      - tuktukpatrol.com/model/
    scraper: performerScraper

jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: 0.title.rendered
        postProcess:
          - &htmlToText
            javascript: |
              const named = { amp: "&", quot: '"', apos: "'", nbsp: " ", hellip: "…" };
              const numeric = { 8216: "‘", 8217: "’", 8220: "“", 8221: "”", 8211: "–", 8212: "—", 8230: "…", 39: "'", 160: " ", 38: "&" };
              return value
                .replace(/\[[a-z]+\]/gi, "")
                .replace(/(?:<\/p>|<br\s*\/?>)/gi, "\n")
                .replace(/<[^>]+>/g, "")
                .replace(/&(#\d+|[a-z]+);/gi, (match, entity) =>
                  entity[0] === "#" ? (numeric[parseInt(entity.slice(1), 10)] ?? match) : (named[entity] ?? match)
                )
                .replace(/\u00a0/g, " ")
                .replace(/[^\S\n]+/g, " ")
                .replace(/\s*\n\s*/g, "\n")
                .trim();
      Details:
        selector: 0.content.rendered
        postProcess:
          - *htmlToText
      Date:
        selector: 0.date_gmt
        postProcess:
          - parseDate: "2006-01-02T15:04:05"
      Performers:
        Name:
          selector: 0.acf_data
          postProcess:
            - javascript: |
                const data = JSON.parse(value);
                return (data.models || data.model_name || "")
                  .split(",")
                  .map((name) => name.trim())
                  .join("__SEP__");
          split: "__SEP__"
      Tags:
        Name:
          selector: "0._embedded.wp:term|@flatten.#.name"
          postProcess:
            - *htmlToText
      Image:
        selector: 0.acf_data.poster_image
        postProcess:
          # Get the full-size cover image
          - replace:
              - regex: '-\d+x\d+(\.[A-Za-z]+)$'
                with: $1
      URLs: 0.link
      Studio:
        Name:
          selector: 0.link
          postProcess:
            - replace:
                - regex: '^https?://(?:www\.)?([^/]+)/.*$'
                  with: $1
            - map:
                asiansexdiary.com: Asian Sex Diary
                eurosexdiary.com: Euro Sex Diary
                helloladyboy.com: Hello Ladyboy
                milftrip.com: MILF Trip
                toticos.com: Toticos
                trikepatrol.com: Trike Patrol
                tuktukpatrol.com: TukTuk Patrol

xPathScrapers:
  toticosScraper:
    common:
      $scene: //video[@id="mediabox"]
    scene:
      Title: //h1[@class="post-title"][$scene]
      Date:
        selector: //script[@type="application/ld+json" and contains(., "datePublished") and $scene]
        postProcess:
          - replace:
              - regex: '^.*?"datePublished":"(\d{4}-\d{2}-\d{2}).*$'
                with: $1
      Details: //span[@class="latest_update_description"]
      Performers:
        Name: //div[@class="single-model-head"]/a
      Tags:
        Name: //div[contains(@class, "cat_tag")]/a
      Image: $scene/@poster
      URLs: //link[@rel="canonical"][$scene]/@href
      Studio:
        Name:
          selector: $scene/@poster
          postProcess:
            - replace:
                - regex: ^.+$
                  with: Toticos

  legacyScraper:
    scene:
      Title: //h1[@class="amp-single-title"]
      Date:
        selector: //i[@class="fa fa-calendar-o"]/following-sibling::text()
        postProcess:
          - parseDate: Jan 2, 2006
      Details:
        selector: //div[@class="cntn-wrp artl-cnt"]//p
        concat: "\n\n"
      Performers:
        Name: //div[@class="update-info"]/a
      Tags:
        Name: //div[@class="amp-category"]//a
      Image: //amp-img[@layout="fill"]/@src
      Studio:
        Name:
          fixed: Screw Me Too

  performerScraper:
    performer:
      Name: //h1[@class="hl-model-profile__name"]
      Details: //p[@class="hl-model-profile__blurb"]
      CareerStart:
        selector: //span[contains(@class, "hl-model-profile__first")]
        postProcess:
          - javascript: |
              const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
              const [, month, year] = value.match(/(\w{3}) (\d{4})/) ?? [];
              const index = months.indexOf(month);
              return index < 0 ? "" : `${year}-${String(index + 1).padStart(2, "0")}`;
      Tags:
        Name: //a[@class="hl-model-profile__tag"]
      Images:
        selector: //img[@class="hl-model-profile__portrait-img"]/@src
        postProcess:
          - replace:
              - regex: '-\d+x\d+(\.[A-Za-z]+)$'
                with: $1
      # The canonical link and og:url still point at the old /models/ path on some sites
      URLs:
        selector: //link[@type="application/json+oembed"]/@href
        postProcess:
          - replace:
              - regex: ^.*[?&]url=([^&]+).*$
                with: $1
              - regex: "%3A"
                with: ":"
              - regex: "%2F"
                with: /
driver:
  useSurf: true

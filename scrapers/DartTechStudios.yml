name: DartTechStudios
sceneByURL:
  - action: scrapeXPath
    url:
      - darttechstudios.com/media.php
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://darttechstudios.com/media.php?id={filename}
  queryURLReplace:
    filename:
      - regex: \.[^.]+$
        with: ""
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $ld: //script[@type="application/ld+json"][not(//script[@type="application/ld+json"][2])]
    scene:
      Title:
        selector: $ld
        postProcess:
          - javascript: |
              try { return JSON.parse(value)["name"] || ""; } catch (e) { return ""; }
      Details:
        selector: $ld
        postProcess:
          - javascript: |
              try { return JSON.parse(value)["description"] || ""; } catch (e) { return ""; }
      Date:
        selector: $ld
        postProcess:
          - javascript: |
              try { return JSON.parse(value)["datePublished"] || ""; } catch (e) { return ""; }
      # TODO: enable when scrape dialog can show durations
      # Duration:
      #   selector: $ld
      #   postProcess:
      #     - javascript: |
      #         try { return JSON.parse(value)["duration"] || ""; } catch (e) { return ""; }
      Tags:
        Name:
          selector: $ld
          postProcess:
            - javascript: |
                try {
                  return (JSON.parse(value)["keywords"] || "")
                    .split(",").map(function (t) { return t.trim(); })
                    .filter(Boolean).join(",");
                } catch (e) { return ""; }
          split: ","
      Performers:
        Name: //a[contains(@href, "tracks.php?artist=")][$ld]
      Image: //meta[@property="og:image"][$ld]/@content
      URLs: //link[@rel="canonical"][$ld]/@href
      Code:
        selector: //meta[@property="og:image"][$ld]/@content
        postProcess:
          - replace:
              - regex: .*/content/(\d+)_.*
                with: $1
      Studio:
        Name:
          selector: //link[@rel="canonical"][$ld]/@href
          postProcess:
            - replace:
                - regex: ^.+$
                  with: Dart_Tech Studios

name: AussieAss
sceneByURL:
  - action: scrapeXPath
    url:
      - aussieass.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: (//div[contains(@class,'preview-description')]/h4/span)[1]
      Performers:
        Name: //div[contains(@class,'preview-description')]/h5//a
      Image:
        selector: //img[@class='large_update_thumb left thumbs']/@src
        postProcess:
          - replace:
              - regex: ^/web/
                with: "https://web.archive.org/web/"
              - regex: ^content/
                with: "https://aussieass.com/content/"
      Details: //div[contains(@class,'preview-description')]/text()[3]

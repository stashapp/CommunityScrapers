name: "Fragile Slave"
sceneByURL:
  - action: scrapeXPath
    url:
      - fragileslave.com/
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $details: //div[@class="videodetails"]/p[@class="date"]
    scene:
      Title: //div[@class="pagetitle"]//h1
      Details: //div[@class="videocontent"]/p
      Image: //div[@class="scenePhotos"]//img/@src
      Studio:
        Name:
          fixed: Fragile Slave
      Tags:
        Name: $details/a
      Performers:
        Name: //span[@class="tour_update_models"]/a
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0
    # copy the full Cookie header from a request to fragileslave.com, it needs:
    # XSRF-TOKEN
    # fragile_slave_session
    # age_verification_status
    # av_cookie_version
    # forever_cookie
    - Key: Cookie
      Value: ""

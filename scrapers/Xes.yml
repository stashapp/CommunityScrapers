name: xes.pl
sceneByURL:
  - action: scrapeXPath
    url:
      - xes.pl
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $facts: //*[@class="videoFact"]
    scene:
      Title: //h1[@id="videoPageTitle"]
      URLs: //meta[@property="og:url"]/@content
      Code:
        selector: //title
        postProcess:
          - replace:
              - regex: ^.*Epizod (\d+).*$
                with: $1
              - regex: ^.*polskie filmy porno$
                with: ""
      # Duration: $facts[i[contains(@class, "fa-clock-o")]]//strong
      Date:
        selector: $facts[i[contains(@class, "fa-calendar")]]//strong
        postProcess:
          - parseDate: 02.01.2006
      Details: //div[@class="videoDescription"]
      Tags:
        Name: //div[@class="videoTags"]/a
      Performers:
        Name: //a[contains(@class, "videoHeroPerformer")]/span
        URLs:
          selector: //a[contains(@class, "videoHeroPerformer")]/@href
          postProcess:
            - replace:
                - regex: ^
                  with: https://xes.pl/
      Studio:
        Name: $facts[i[contains(@class, "fa-video-camera")]]//strong
        URLs:
          selector: $facts[i[contains(@class, "fa-video-camera")]]/@href
          postProcess:
            - replace:
                - regex: ^
                  with: https://xes.pl/
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              # og:image is the frame at playback resolution; org.jpg is the unscaled upload
              - regex: /\d+\.jpg$
                with: /org.jpg

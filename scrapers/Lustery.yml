name: Lustery
performerByURL:
  - action: scrapeJson
    url:
      - lustery.com/couple/
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .+/(.+)
          with: https://lustery.com/api/couple/$1
    scraper: performerScraper
sceneByURL:
  - action: scrapeJson
    url:
      - lustery.com/video-preview/
      - lustery.com/video/
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .+/(.+)
          with: https://lustery.com/api/video/$1
    scraper: sceneScraper

jsonScrapers:
  performerScraper:
    performer:
      Name: couple.name
      Country:
        selector: couple.location
        postProcess:
          - replace:
              - regex: .+,
                with:
      Details:
        selector: couple.permalink
        postProcess:
          - replace:
              - regex: ^
                with: https://lustery.com/api/couple/
              - regex: $
                with: /info
          - subScraper:
              selector: coupleInfo.description
      Images:
        selector: couple.mainImage.staticPath
        postProcess:
          - replace:
              - regex: ^
                with: https://img.lustery.com/cache/image/resize/format=auto,width=1920,quality=75/

  sceneScraper:
    scene:
      Title: video.title
      Details:
        selector: video.permalink
        postProcess:
          - replace:
              - regex: ^
                with: https://lustery.com/api/video/
              - regex: $
                with: /info
          - subScraper:
              selector: videoInfo.description
      Date: #not very accurate as it is the Last Edited Date
        selector: video.publishAt
        postProcess:
          - parseDate: unix
      URLs:
        selector: video.permalink
        postProcess:
          - replace:
              - regex: ^
                with: https://lustery.com/video/
      Image:
        selector: video.poster.staticPath
        postProcess:
          - replace:
              - regex: ^
                with: https://cdn77-public.lustery.com/cache/image/resize/format=auto,width=1920,quality=75/
      Performers:
        Name:
          selector: "[video.couplePermalink,video.secondaryCouplePermalink]|#(!=null)#"
          postProcess:
            - replace:
                - regex: ^
                  with: https://lustery.com/api/couple/
                - regex: $
                  with: /info
            - subScraper:
                selector: coupleInfo.members.#.name
                concat: "|"
          split: "|"
        # https://github.com/stashapp/stash/issues/7263
        # URLs:
        #   selector: "[video.couplePermalink,video.secondaryCouplePermalink]|#(!=null)#"
        #   postProcess:
        #     - replace:
        #         - regex: ^
        #           with: https://lustery.com/couple/
      Studio:
        Name:
          fixed: Lustery
      Tags:
        Name: video.tags
      # TODO: enable when scrape dialog can show durations
      # Duration: video.duration

driver:
  useSurf: true

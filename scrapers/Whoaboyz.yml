name: Whoaboyz
sceneByURL:
  - action: scrapeJson
    url:
      - whoaboyz.com/video/
    queryURL: https://whoabucks.com/tour_api.php/content/sets?cms_area_id=9713561d-384a-47b3-b5cc-999f9b86d135&cms_block_id=100021&data_types=1&slug={url}
    queryURLReplace:
      url:
        - regex: .+/video/([^/?#]+).*
          with: $1
    scraper: sceneScraper
  # We can rewrite legacy URLs to find them byin the API
  - action: scrapeJson
    url:
      - whoaboyz.com/tour/trailers/
    queryURL: https://whoabucks.com/tour_api.php/content/sets?cms_area_id=9713561d-384a-47b3-b5cc-999f9b86d135&cms_block_id=100021&data_types=1&slug={url}
    queryURLReplace:
      url:
        - regex: .+/tour/trailers/([^/?#]+)\.html.*
          with: $1
        - regex: -{2,}
          with: "-"
    scraper: sceneScraper
jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: sets.0.name
        postProcess:
          - replace:
              - regex: \s+
                with: " "
      Details: sets.0.description
      Date: sets.0.added_nice
      Code: sets.0.slug
      Image:
        selector: sets.0.preview_formatted.thumb
        postProcess:
          - javascript: |
              var thumbs = JSON.parse(value);
              var best = null;
              var bestWidth = -1;
              for (var size in thumbs) {
                var entry = (thumbs[size] || [])[0];
                var width = parseInt(size.split("-")[0], 10);
                if (entry && entry.fileuri && width > bestWidth) {
                  bestWidth = width;
                  best = entry;
                }
              }
              if (!best) return "";
              return "https://whoabucks.com" + best.fileuri +
                (best.signature ? "?" + best.signature : "");
      Tags:
        Name: sets.0.data_types.#(shortname=="category").data_values.#.name
      Performers:
        Name: sets.0.data_types.#(shortname=="models").data_values.#.name
      Studio:
        Name:
          fixed: Whoaboyz
driver:
  headers:
    - Key: X-NATS-cms-area-id
      Value: 9713561d-384a-47b3-b5cc-999f9b86d135
    - Key: X-nats-entity-decode
      Value: "1"

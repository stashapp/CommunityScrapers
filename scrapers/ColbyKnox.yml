name: "Colby Knox"
sceneByURL:
  - action: scrapeXPath
    url:
      - colbyknox.com/video
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $performer: //a[contains(@class, "video-model")]
    scene:
      Title: //div[contains(@class, "video")]//h1
      Date:
        selector: //script[@type="application/ld+json"][contains(.,"uploadDate")]
        postProcess:
          - replace:
              - regex: '^[\s\S]*"uploadDate":"(\d{4}-\d{2}-\d{2})[\s\S]*'
                with: "$1"
          - parseDate: "2006-01-02"
      Performers:
        Name: $performer//h3
        URLs:
          selector: $performer/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: https://www.colbyknox.com/
      Details:
        selector: //div[contains(@class, "video")]//p[contains(@class, "mb-5")]
        concat: "\n\n"
      Image: //meta[@property="og:image"]/@content
      URLs: //meta[@property="og:url"]/@content
      Studio:
        Name:
          fixed: Colby Knox

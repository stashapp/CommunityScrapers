# requires: py_common
name: Jellyfin
sceneByURL:
  - action: script
    # Change this to your Jellyfin URL, same as in config.ini
    url: &baseJellyfinURL
      - localhost:8096
    script:
      - python
      - Jellyfin.py
      - scene-by-url
sceneByFragment:
  action: script
  script:
    - python
    - Jellyfin.py
    - scene-by-fragment
sceneByName:
  action: script
  script:
    - python
    - Jellyfin.py
    - scene-by-name
sceneByQueryFragment:
  action: script
  script:
    - python
    - Jellyfin.py
    - scene-by-query-fragment
performerByName:
  action: script
  script:
    - python
    - Jellyfin.py
    - performer-by-name
performerByURL:
  - action: script
    url: *baseJellyfinURL
    script:
      - python
      - Jellyfin.py
      - performer-by-url
performerByFragment:
  action: script
  script:
    - python
    - Jellyfin.py
    - performer-by-fragment
groupByURL:
  - action: script
    url: *baseJellyfinURL
    script:
      - python
      - Jellyfin.py
      - movie-by-url

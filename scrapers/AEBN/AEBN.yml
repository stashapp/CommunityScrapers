name: "AEBN"
# requires: py_common
performerByURL:
  - action: scrapeXPath
    url:
      - aebn.com/straight/stars
      - aebn.com/gay/stars
    scraper: performerScraper
sceneByURL:
  - action: script
    url:
      - aebn.com/straight/movies
      - aebn.com/gay/movies
      - mansurfer.tv/dispatcher/movieDetail
    script:
      - python
      - AEBN.py
      - scene-by-url
groupByURL:
  - action: scrapeXPath
    url:
      - aebn.com/straight/movies
      - aebn.com/gay/movies
    scraper: movieScraper
  - action: scrapeXPath
    url:
      - mansurfer.tv/dispatcher/movieDetail
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: .+[?&]movieId=(\d+).*
          with: https://gay.aebn.com/gay/movies/$1
    scraper: movieScraper
xPathScrapers:
  performerScraper:
    performer:
      Name: //div[contains(@class,"dts-star-name")]/h1
      Gender:
        selector: //li[@class="section-detail-list-item-gender"]/text()
        postProcess:
          - map:
              TS: transgender_female
      URLs: //link[@rel="canonical"]/@href | //section[contains(@class,"dts-star-details")]//a[i[contains(@class,"dts-icon-twitter")]]/@href
      Birthdate:
        selector: //div[contains(@class,"dts-star-attributes-bio")]//li[contains(.,"Birth Date")]
        postProcess:
          - replace:
              - regex: .+:\s(.+)
                with: $1
              - regex: "Sept"
                with: "Sep"
          - parseDate: Jan 2, 2006
      Height:
        selector: //li[@class="section-detail-list-item-height"]
        postProcess:
          - replace:
              - regex: .+\((\d+).+\)
                with: $1
      Weight:
        selector: //li[@class="section-detail-list-item-weight"]
        postProcess:
          - replace:
              - regex: .+\((\d+).+\)
                with: $1
      EyeColor: //li[@class="section-detail-list-item-eye-color"]/text()
      Ethnicity:
        selector: //li[@class="section-detail-list-item-ethnicity"]/text()
        postProcess:
          - map:
              White: Caucasian
      HairColor: //li[@class="section-detail-list-item-hair-color"]/text()
      Details: //div[contains(@class,"dts-star-bio")]
      Images:
        selector: //div[contains(@class,"dts-star-detail-avatar")]/picture/img[not(contains(@src,"gender_symbols"))]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
              - regex: \?.*$
                with: ""
  movieScraper:
    group:
      Name: //div[@class="dts-section-page-heading-title"]/h1
      URLs: //link[@rel="canonical"]/@href
      Director:
        selector: //li[@class="section-detail-list-item-director"]//a
        concat: ", "
      Duration: //li[@class="section-detail-list-item-duration"][contains(span,"Running Time")]/text()
      Date:
        selector: //li[@class="section-detail-list-item-release-date"]/text()
        postProcess:
          - replace:
              - regex: "Sept"
                with: "Sep"
          - parseDate: Jan 2, 2006
      Synopsis: //div[@class="dts-section-page-detail-description-body"]
      Studio:
        Name:
          selector: //li[@class="section-detail-list-item-studio"]//a
          postProcess:
            - replace:
                - regex: ",$"
                  with: ""
      Tags:
        Name: //div[contains(@class,"dts-detail-movie-categories-content")]/a
      FrontImage:
        selector: //img[contains(@class,"dts-modal-boxcover-front")]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
      BackImage:
        selector: //img[contains(@class,"dts-modal-boxcover-back")]/@src
        postProcess:
          - replace:
              - regex: ^//
                with: "https://"
driver:
  cookies:
    - CookieURL: "https://vod.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "vod.aebn.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://gay.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "gay.aebn.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://straight.aebn.com"
      Cookies:
        - Name: "ageGated"
          Domain: "straight.aebn.com"
          Value: "true"
          Path: "/"

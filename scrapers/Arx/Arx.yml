name: Arx
sceneByURL:
  - action: scrapeXPath
    url: &urls
      - analvault.com
      - cuckhunter.com
      - honeytrans.com
      - japanlust.com
      - joibabes.com
      - lesworship.com
      - nudeyogaporn.com
      - povmasters.com
      - randypass.com
      - transdaylight.com
      - transmidnight.com
      - transroommates.com
    scraper: htmlScraper
galleryByURL:
  - action: scrapeXPath
    url: *urls
    scraper: htmlScraper
performerByURL:
  - action: scrapeXPath
    url: *urls
    scraper: htmlScraper
xPathScrapers:
  htmlScraper:
    scene:
      Title: &titleSel //meta[@property="og:title"]/@content
      Date: &date
        selector: //h1/following-sibling::div[contains(@class, "items-center")]//span[@class="block"]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: &detailsSel //span[text()="Description:"]/following-sibling::span
      Performers:
        Name: &performersSel //span[text()="Models:"]/following-sibling::div//a//span
      Tags:
        Name: &tagsSel //a[contains(@href, "/categories/")]
      URLs: &urlSel //meta[@property="og:url"]/@content
      Image: &imageSel //meta[@property="og:image"]/@content
      Code: &code
        selector: *imageSel
        postProcess:
          - javascript: |
              const m = /\/scene_thumbs\/(.+?)-\d+x\d+-thumb\./.exec(value);
              return m ? m[1] : "";
      Studio:
        Name: &studioName
          selector: //img[contains(@alt, "Logo") and not(contains(@alt, "Randy Pass"))]/@alt
          postProcess:
            - replace:
                - regex: \s*Logo
                  with: ""
        URLs:
          selector: //meta[@property="og:url"][not(contains(@content, "randypass.com"))]/@content
          postProcess:
            - replace:
                - regex: 'https?://([^/]+)/scenes/\d+/.*'
                  with: https://$1
    gallery:
      Title:
        selector: *titleSel
        postProcess:
          - replace:
              - regex: "^Photos from "
                with: ""
      Code: *code
      URLs: *urlSel
      Date:
        selector: *urlSel
        postProcess:
          - replace: &removePhotos
              - regex: /photos$
                with: ""
          - subScraper: *date
      Studio:
        Name:
          selector: *urlSel
          postProcess:
            - replace: *removePhotos
            - subScraper: *studioName
      Performers:
        Name:
          selector: *urlSel
          postProcess:
            - replace: *removePhotos
            - subScraper:
                selector: *performersSel
                concat: ","
          split: ","
      Tags:
        Name:
          selector: *urlSel
          postProcess:
            - replace: *removePhotos
            - subScraper:
                selector: *tagsSel
                concat: ","
          split: ","
      Details:
        selector: *urlSel
        postProcess:
          - replace: *removePhotos
          - subScraper: *detailsSel
    performer:
      Name: //meta[@property="og:image:alt"]/@content
      Images:
        selector: *imageSel
        postProcess:
          - replace:
              - regex: ^(https://[^/]+/fit-in/)[^/]+(.*)$
                with: "${1}0x0${2}"
      Tags:
        Name: *tagsSel

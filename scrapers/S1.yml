name: S1
sceneByURL:
  - action: scrapeXPath
    url:
      - s1s1s1.com
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://s1s1s1.com/works/detail/{filename}
  queryURLReplace:
    filename:
      - regex: (?:.*[^A-Za-z])?([A-Za-z]{2,6})-?(\d{3,4}).*
        with: $1$2
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $row: //div[@class="p-workPage__table"]/div[@class="item"]
      $code: //div[@class="p-workPage__table"]/div[@class="item"]/div[contains(.,"品番")]/following-sibling::div/div//span[contains(.,"DVD")]/../text()
    scene:
      Title: //h2[@class="p-workPage__title"]
      Details: //p[@class="p-workPage__text"]
      URLs:
        selector: $code
        postProcess:
          - replace:
              - regex: ^
                with: https://s1s1s1.com/works/detail/
      Date:
        selector: $row/div[contains(.,"発売日")]/following-sibling::div/div/a
        postProcess:
          - replace:
              - regex: (\d{4})年(\d{1,2})月(\d{1,2})日
                with: $1-$2-$3
          - parseDate: 2006-1-2
      Director:
        selector: $row/div[contains(.,"監督")]/following-sibling::div/div/p
        postProcess:
          - replace:
              - regex: ^-+$
                with: ""
      Performers:
        Name: $row/div[contains(.,"女優")]/following-sibling::div/div/a
      Tags:
        Name: $row/div[contains(.,"ジャンル")]/following-sibling::div/div/a
      Image: //img[@class="swiper-lazy"][1]/@data-src
      Studio:
        Name:
          fixed: S1 No. 1 Style
      Code:
        selector: $code
        postProcess:
          - replace:
              - regex: ^([A-Za-z]+)(\d+)$
                with: $1-$2

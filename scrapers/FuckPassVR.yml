name: FuckPassVR
sceneByName:
  action: scrapeXPath
  scraper: sceneByName
  queryURL: https://www.fuckpassvr.com/destination?s={}
sceneByQueryFragment:
  action: scrapeXPath
  scraper: fuckpassvrScraper
  queryURL: "{url}"
sceneByURL:
  - action: scrapeXPath
    url:
      - fuckpassvr.com/video/
    scraper: fuckpassvrScraper
performerByName:
  action: scrapeXPath
  scraper: sceneByName
  queryURL: https://www.fuckpassvr.com/destination?s={}
performerByURL:
  - action: scrapeXPath
    url:
      - fuckpassvr.com/vr-pornstars/
    scraper: fuckpassvrScraper
xPathScrapers:
  sceneByName:
    common:
      $card: //div[contains(@class, "videos__element")]
    performer:
      Name: $card//a[contains(@href, "/vr-pornstars/")]/@title
      URLs: $card//a[contains(@href, "/vr-pornstars/")]/@href
    scene:
      Title: $card//a[@class="videos__videoTitle"]
      URLs: $card//a[@class="videos__videoTitle"]/@href
      Image: $card//img/@src
  fuckpassvrScraper:
    performer:
      Name:
        selector: //h1[@id="fpvr-bioHero-title"]/text()
        postProcess:
          - replace:
              - regex: \.\s*$
                with:
      Measurements: //span[contains(@class,"fpvr-bioStat__label") and text()="Measurements"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      Height: //span[contains(@class,"fpvr-bioStat__label") and text()="Height"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      Weight: //span[contains(@class,"fpvr-bioStat__label") and text()="Weight"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      EyeColor: //span[contains(@class,"fpvr-bioStat__label") and text()="Eye Color"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      HairColor: //span[contains(@class,"fpvr-bioStat__label") and text()="Hair Color"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      Country: //span[contains(@class,"fpvr-bioStat__label") and text()="Country"]/preceding-sibling::span[contains(@class,"fpvr-bioStat__num")]/text()
      Image: //meta[@property="og:image"]/@content
      Gender:
        fixed: Female
      URLs: //link[@rel="canonical"]/@href
    scene:
      Title: //h1[@class="scene-info__title"]/text()
      Details:
        selector: //meta[@property="og:description"]/@content
        postProcess:
          - replace:
              # maintain line breaks
              - regex: (<br>|</p>)
                with: "\n"
              # strip any remaining tags
              - regex: <[^>]+>
                with: ""
          - javascript: |
              if (value && value.length) {
                // HTML entity decode
                const map = {
                  '&amp;': '&',
                  '&lt;': '<',
                  '&gt;': '>',
                  '&quot;': '"',
                  '&#39;': "'"
                };
                return value.replace(/&(?:amp|lt|gt|quot|#39);/g, m => map[m]);
              }
      Tags:
        Name:
          selector: //div[@class="scene-cats__pills"]/a | //h4[@class="scene-cats__label"]
          postProcess:
            - replace:
                # this is a "hack" to add a fixed tag to the list of tags, since every scene is VR
                - regex: ^Categories$
                  with: Virtual Reality
      Performers:
        Name: //a[@class="scene-cast__hostessPill"]/@title
      Image:
        selector: &imageSel //div[@class='video__videoWrapper']/pornhall-player/@poster
        postProcess:
          - replace:
              - regex: "'"
                with: ""
      Studio:
        Name:
          fixed: FuckPassVR
      Date:
        selector: //span[@class="scene-cast__date"]/text()
        postProcess:
          - parseDate: Jan 2, 2006
      Code:
        selector: *imageSel
        postProcess:
          - replace:
              - regex: .*/scenes/([^/]*)/.*
                with: $1
      URLs: //link[@rel="canonical"]/@href

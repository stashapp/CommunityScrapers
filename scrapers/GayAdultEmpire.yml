name: GayAdultEmpire

groupByURL:
  - action: scrapeXPath
    url:
      - gaydvdempire.com
      - gayempire.com
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^(https?://(?:www\.)?)gayempire\.com
          with: ${1}gaydvdempire.com
    scraper: movieScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - gaydvdempire.com/clip/
      - gayempire.com/clip/
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^(https?://(?:www\.)?)gayempire\.com
          with: ${1}gaydvdempire.com
    scraper: clipScraper
  - action: scrapeXPath
    url:
      - gaydvdempire.com
      - gayempire.com
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^(https?://(?:www\.)?)gayempire\.com
          with: ${1}gaydvdempire.com
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  # if needed replace `vod` with `dvd`
  queryURL: https://www.gaydvdempire.com/vod/search?q={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    scene:
      Title: //a[@class="boxcover"]/img/@title
      URLs:
        selector: //a[@class="boxcover"]/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.gaydvdempire.com
      Image: //a[@class="boxcover"]/img/@src

  movieScraper:
    group:
      Name: &name //h1[contains(@class, "movie-page__heading__title")]/text()
      Director: &director //a[@label="Director"]
      Duration:
        selector: //small[contains(text(), "Length")]/following-sibling::text()
        postProcess:
          - replace:
              - regex: " hrs. "
                with: ":"
              - regex: " mins."
                with: ":00"
      Date: &date
        selector: //small[contains(text(), "Released")]/following-sibling::text()
        postProcess:
          - parseDate: Jan 02 2006
      Synopsis: &details
        selector: //div[@class="synopsis-content"]/p
        concat: "\n\n"
      Studio: &studio
        Name: //a[@label="Studio"]
      Tags: &tags
        Name: //div[h2[contains(.,'Categories')]]//a[@label="Category"]
      FrontImage: &image //a[@id="front-cover"]/@data-href
      BackImage: //a[@id="back-cover"]/@href
      URLs: &url //link[@rel="canonical"]/@href

  sceneScraper:
    common:
      $performer: //a[@label="Performer"]
    scene:
      Title: *name
      Director: *director
      Details: *details
      Date: *date
      ProductionDate:
        selector: //li[small[contains(text(), "Production Year")]]
        postProcess:
          - replace:
              - regex: .*(\d{4}).*
                with: $1
      Image: *image
      Studio: *studio
      Groups:
        Name: *name
        URLs: *url
      Tags: *tags
      Performers:
        Name: $performer
        URLs:
          selector: $performer/@href
          postProcess:
            - replace:
                - regex: ^
                  with: "https://www.gaydvdempire.com"
      URLs: *url

  clipScraper:
    common:
      $byStudio: //a[@label="Studio" and preceding-sibling::text()[normalize-space(.)="by"]]
      $fromMovie: //a[@label="Studio" and preceding-sibling::text()[normalize-space(.)="from"]]
      $clipPerformer: //a[@label="Clip Performer"]
    scene:
      Title:
        selector: //h1[contains(@class, "clip-page__detail__title__primary")] | $fromMovie
        concat: __SEP__
        postProcess:
          - replace:
              # If there's no "proper title" we can include the movie name
              - regex: (Scene \d+)__SEP__(.*)
                with: $1, $2
              # If the previous regex didn't match we can strip out the movie name: it will be scraped as a Movie below
              - regex: (.*)__SEP__.*
                with: $1
      Studio:
        Name: $byStudio
      Groups:
        Name: $fromMovie
        URLs:
          selector: $fromMovie/@href
          postProcess:
            - replace:
                - regex: ^
                  with: https://www.gaydvdempire.com
      Performers:
        Name: $clipPerformer
        URLs:
          selector: $clipPerformer/@href
          postProcess:
            - replace:
                - regex: ^
                  with: "https://www.gaydvdempire.com"
      Image:
        selector: (//*[@data-tid]/@data-tid)[1] | //a[@id="front-cover"]/img/@src
        concat: __SEP__
        postProcess:
          - replace:
              - regex: (\d+).*/(\d+)[^/]*$
                with: https://imgs1cdn.adultempire.com/backdrop/6000/$2%5f$1/scene-1.jpg
driver:
  cookies:
    - CookieURL: "https://www.gaydvdempire.com"
      Cookies:
        - Name: "ageConfirmed"
          Domain: "www.gaydvdempire.com"
          Value: "true"
          Path: "/"
    - CookieURL: "https://www.gayempire.com"
      Cookies:
        - Name: "ageConfirmed"
          Domain: "www.gayempire.com"
          Value: "true"
          Path: "/"
        # replace with your account etoken
    - CookieURL: "https://www.gaydvdempire.com"
      Cookies:
        - Name: "etoken"
          Domain: "www.gaydvdempire.com"
          Value: "" # replace with your account etoken
          Path: "/"
    - CookieURL: "https://www.gayempire.com"
      Cookies:
        - Name: "etoken"
          Domain: "www.gayempire.com"
          Value: "" # replace with your account etoken
          Path: "/"

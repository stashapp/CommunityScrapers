name: "EroProfile"
sceneByURL:
  - action: scrapeXPath
    url:
      - eroprofile.com/m/videos/view/
      - m.eroprofile.com/p/videos/view/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[contains(@class,"cap-multi-line")] | //div[@class="pageTitle"]
      URLs:
        selector: //link[@rel="canonical"]/@href
        postProcess:
          - replace:
              - regex: '\?lang=.*$'
                with: ""
      Details: >-
        //h1[contains(@class,"cap-multi-line")]/following-sibling::div[contains(@class,"box-cnt")]/text()
        | //th[contains(.,"Description:")]/following-sibling::td
      Date:
        selector: >-
          //td[contains(@class,"pr-s") and contains(.,"Upload date")]/following-sibling::td/text()
          | //th[contains(.,"Uploaded:")]/following-sibling::td
        postProcess:
          - parseDate: 2 January 2006
      Tags:
        Name: >-
          //td[contains(@class,"pr-s") and contains(.,"Niche")]/following-sibling::td/a
          | //th[contains(.,"Niche:")]/following-sibling::td/a
      Image: //video[@id="vidVideoViewPlayer"]/@poster | //video[@id="vidPlayer"]/@poster

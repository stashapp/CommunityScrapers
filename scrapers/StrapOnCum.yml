name: StrapOnCum
sceneByURL:
  - action: scrapeXPath
    url:
      - straponcum.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class="card-title"]
      Date:
        selector: //p[@class="card-text text-muted"]
        postProcess:
          - replace:
              - regex: ^[^A-Za-z]+
                with: ""
          - parseDate: January 2, 2006
      Performers:
        Name: //p[@class="card-text d-inline-block"]/a
      Tags:
        Name: //li[@class="list-inline-item tag"]/a
      Details: //p[@class="card-text mb-2"]
      Image: //img[@class="stdimage img-fluid lazy"]/@data-src
      Studio:
        Name:
          fixed: Strapon Cum

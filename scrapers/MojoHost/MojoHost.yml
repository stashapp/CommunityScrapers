xPathScrapers:
  sceneScraper:
    common:
      $scene: //div[@class="videoDetails clear"]
    scene:
      Title: &title $scene/*[self::h1 or self::h3]
      # Workaround for some sites that have badly nested tags, grabbing the last <p>
      # is a no-op for sites that do it correctly so this is safe
      Details: &details $scene/p[last()]
      Date: &date
        selector: //span[contains(., "Date Added")]/following-sibling::text()
        postProcess:
          - replace:
              - regex: ^\s*
                with: ""
          - parseDate: January 2, 2006
      Performers: &performers
        Name: //li[@class="update_models"]/a
        URLs: //li[@class="update_models"]/a/@href
      Tags: &tags
        Name: //li[contains(text(), "Tags:") or contains(text(), "Categories:")]/following-sibling::li/a/text()
      Image: &image
        selector: >-
          //base/@href |
          //img[contains(@class,"update_thumb")][@src0_1x]/@src0_1x |
          //img[contains(@class,"update_thumb")][@src0_2x]/@src0_2x |
          //img[contains(@class,"update_thumb")][@src0_3x]/@src0_3x |
          //img[contains(@class,"update_thumb")][@src0_4x]/@src0_4x
        concat: __SEP__
        postProcess:
          - replace:
              - regex: __SEP__.+__SEP__
                with: ""
              - regex: __SEP__
                with: ""
              - regex: ^(https?://[^/]+)/https?://[^/]+(/[^?]+).*
                with: $1$2
              - regex: /(tour|explore|creeper)//?(?:tour|explore|creeper)/
                with: /$1/
              - regex: (:?-[1-4]x)?\.jpg$
                with: "-full.jpg"
      Studio: &studio

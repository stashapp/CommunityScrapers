  hiddenDateScraper:
    common:
      $scene: //div[@class="videoDetails clear"]
    scene:
      Title: *title
      Details: *details
      # Different from other studios in that it hides the date inside a comment
      Date:
        selector: //comment()[contains(., "Date Added")]
        postProcess:
          - replace:
              - regex: '.*?(\w+ \d{1,2}, \d{4}).*'
                with: $1
          - parseDate: January 2, 2006
      Performers: *performers
      Tags: *tags
      Image: *image
      Studio: *studio

  hiddenImageScraper:
    common:
      $scene: //div[@class="videoDetails clear"]
    scene:
      Title: *title
      Details: *details
      Date: *date
      Performers: *performers
      Tags: *tags
      Studio: *studio
      # Different from other studios in that it hides the poster inside <script>
      Image:
        selector: //base/@href | //script[contains(text(), "video_content")]
        concat: __SEP__
        postProcess:
          - replace:
              - regex: (?s)^(https?://[^/]+)/__SEP__.*poster="([^"]+)".*
                with: $1$2
              - regex: (:?-[1-4]x)?\.jpg$

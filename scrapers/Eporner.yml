name: Eporner
sceneByURL:
  - action: scrapeXPath
    url:
      - www.eporner.com
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.eporner.com/search/{}/
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.eporner.com/video-{filename}/ # Scrapes data on video so long as the EPORNER video id is in the filename
  queryURLReplace:
    filename:
      - regex: '(.*\[)(\w+)(\]{1}.*)'
        with: $2
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $searchItem: //div[@id="vidresults"]/div[contains(@class,"mb")]
    scene:
      Title: $searchItem/div[@class="mbunder"]/p/a
      URLs:
        selector: $searchItem/div[@class="mbunder"]/p/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.eporner.com"
      Image: $searchItem/div[@class="mbimg"]/div/a/img/@src
  sceneScraper:
    common:
      $tags: //div[@id="video-info-tags"]/ul
    scene:
      Title: //div[@id="video-info"]/h1/text()
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: //script[contains(.,"uploadDate")]
        postProcess:
          - replace:
              - regex: '^[\s\S]*"uploadDate":\s*"(\d{4}-\d{2}-\d{2})[\s\S]*$'
                with: $1
          - parseDate: 2006-01-02
      Performers:
        Name: $tags/li[contains(@class,"vit-pornstar")]/a
      Tags:
        Name: $tags/li[@class="vit-category" or @class="vit-tag"]/a
      Studio:
        Name: $tags/li[@class="vit-channel"]/a
      Image:
        selector: //script[contains(.,"thumbnailUrl")]
        postProcess:
          - replace:
              - regex: '^[\s\S]*(https://imggen\.eporner\.com/\d+/\d+/\d+/\d+\.jpg)[\s\S]*$'
                with: $1

driver:
  cookies:
    - CookieURL: "https://www.eporner.com"
      Cookies:
        - Name: "PHPSESSID"
          Domain: ".eporner.com"
          # replace with PHPSESSID from logged in browser
          Value: ""
          Path: "/"

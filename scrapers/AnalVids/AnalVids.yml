name: "AnalVids"
sceneByURL:
  - action: scrapeXPath
    url:
      - analvids.com/watch/
      - pissvids.com/watch/
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - bustyworld.com/watch/
    scraper: bustyworldSceneScraper
performerByURL:
  - action: scrapeXPath
    url:
      - analvids.com/model/
      - pissvids.com/model/
    scraper: performerScraper
sceneByFragment:
  action: script
  script:
    - python
    - AnalVids.py
    - query

xPathScrapers:
  sceneScraper:
    common:
      $title: //title
    scene:
      Title: &title
        selector: $title
        postProcess:
          - replace:
              - regex: \s*([A-Z]{2,3}\d+\s*)?-\s*((Piss|Anal)Vids|BustyPornWorld)$
                with: ""
      Date: &date
        selector: //i[contains(@class, "bi-calendar3")]
        postProcess:
          - parseDate: 2006-01-02
      Details: &details
        selector: //div[contains(@class, "text-mob-more")]//text()[not(parent::span[contains(@class, "dots")])]
        concat: " "
      Code: &code
        selector: $title
        postProcess:
          - replace:
              - regex: .+?([A-Z]{2,3}\d+)\s*-\s*((Piss|Anal)Vids|BustyPornWorld)$$|(.*)
                with: $1
      Performers: &performers
        Name: //h1[contains(@class, "watch__title")]//a
        URLs: //h1[contains(@class, "watch__title")]//a/@href
      Studio:
        Name: //div[contains(@class, "genres-list")]//a[contains(@href, "/studios/")]
        URL: //div[contains(@class, "genres-list")]//a[contains(@href, "/studios/")]/@href
      Tags: &tags
        Name: //div[contains(@class, "genres-list")]//a[contains(@href, "/genre/")]
      Image: &image //video/@data-poster

  bustyworldSceneScraper:
    common:
      $title: //title
    scene:
      Title: *title
      Date: *date
      Details: *details
      Code: *code
      Performers: *performers
      Tags: *tags
      Studio:
        Name:
          fixed: DDF Busty
      Image: *image

  performerScraper:
    performer:
      Name: //h1
      Country: //a[contains(@href, "nationality")]
      Image: //div[contains(@class, 'model__left')]//img/@src

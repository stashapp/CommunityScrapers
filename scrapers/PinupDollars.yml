name: Pinupdollars
sceneByURL:
  - action: scrapeXPath
    url:
      - lanakendrick.com
      - leannecrow.com
      - monicamendez.com
      - pinupfiles.com
      - rachelaldana.com
      - tessafowler.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class='item-title']/h1
      Date:
        selector: //div[@class="update-info-row"]/strong[contains(.,"Added:")]/following-sibling::text()
        postProcess:
          - parseDate: January 2, 2006
      Performers:
        Name: //div[@class="update-info-block models-list-thumbs"]//a
      Details: //div[@class="update-info-block"]/h3[contains(.,"Description:")]/following-sibling::*[1]
      URLs: //link[@rel="canonical"]/@href
      Tags:
        Name: //ul[@class="tags"]//a
      Image:
        selector: //base/@href | //div[@id="fakeplayer"]//img[@id]/@src0_1x
        concat: "|"
        postProcess:
          - replace:
              - regex: \|https?://[^/]+mjedge\.net/
                with: "|"
              - regex: \?[^|]*$
                with: ""
              - regex: https?://web\.archive\.org/web/\d+(?:im_)?/
                with: ""
              - regex: \|/*
                with: ""
      Studio:
        Name: //meta[@name="author"]/@content

name: StudioFOW
sceneByURL:
  - action: scrapeXPath
    url:
      - studiofow.com/movies
      - studiofow.com/shorts
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //img[contains(@class,"rev-slidebg")]/@title
      Details:
        selector: //div[contains(@class,"woodmart-title-container")]//p
        concat: "\n\n"
      Image:
        selector: //img[contains(@class,"rev-slidebg")]/@data-lazyload
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
              # Wayback doesn't recognize data-lazyload as an asset URL to
              # rewrite for raw bytes; force it into that mode when present
              - regex: (web\.archive\.org/web/\d+)/
                with: ${1}im_/
      Date:
        selector: //div[contains(@class,"title-after_title")]/text()
        postProcess:
          - replace:
              - regex: "[^:]+:\\s+(\\w+)\\s+(\\d+)[^\\d]+(\\d+).*"
                with: $1 $2 $3
          - parseDate: January 2 2006
      Studio:
        Name:
          fixed: Studio FOW
        URLs:
          fixed: https://studiofow.com
      URLs: //link[@rel="canonical"]/@href

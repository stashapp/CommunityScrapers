name: "WatchMyGF"
sceneByURL:
  - action: scrapeXPath
    url:
      - watchmygf.me/video/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $middle: //div[@class='middle-item-container more']
    scene:
      Title: //div[@class='title-video']/span
      Image: //meta[@property='og:image']/@content
      Studio:
        Name: $middle//a[@href[contains(.,'channel/')]]
      Tags:
        Name: $middle//a[@href[contains(.,'.porn') or contains(.,'tag/')]]/span
      Performers:
        Name: $middle//a[@href[contains(.,'girls/')]]
      URLs: //link[@rel='canonical']/@href

name: Evil Erotic
performerByName:
  action: scrapeJson
  queryURL: "https://evilerotic.com/api/search?q={}"
  scraper: performerSearchScraper
performerByURL:
  - action: scrapeXPath
    url:
      - evilerotic.com/models/
    scraper: performerScraper
sceneByName:
  action: scrapeJson
  queryURL: "https://evilerotic.com/api/search?q={}"
  scraper: sceneSearchScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - evilerotic.com/videos/
    scraper: sceneScraper
jsonScrapers:
  performerSearchScraper:
    performer:
      Name: models.#.name
      Images: models.#.image
      URLs:
        selector: models.#.slug
        postProcess:
          - replace:
              - regex: "^(.+)$"
                with: "https://evilerotic.com/models/${1}"
  sceneSearchScraper:
    scene:
      Title: videos.#.title
      Image: videos.#.image
      URLs:
        selector: videos.#.slug
        postProcess:
          - replace:
              - regex: "^(.+)$"
                with: "https://evilerotic.com/videos/${1}"
xPathScrapers:
  performerScraper:
    performer:
      Name: //h1[@class="model-info-heading"]
      Images: //div[contains(@class, "model-info-photo")]/img/@src
      URLs: //meta[@property="og:url"]/@content
      # the site shows a day and month but no year, which Stash cannot store as a partial date
      Country: //span[@class="model-info-label" and text()="Country:"]/following-sibling::span
      Ethnicity: //span[@class="model-info-label" and text()="Ethnicity:"]/following-sibling::span
      Height:
        selector: //span[@class="model-info-label" and text()="Height:"]/following-sibling::span/text()
        postProcess:
          - replace:
              - regex: (\d+)\s*CM.*
                with: $1
      Weight:
        selector: //span[@class="model-info-label" and text()="Weight:"]/following-sibling::span/text()
        postProcess:
          - replace:
              - regex: (\d+)\s*KG.*
                with: $1
      Gender:
        fixed: female
  sceneScraper:
    scene:
      Title: //h1[@class="vd-title"]
      Details:
        selector: //div[@class="vid-desc-collapse"]/div/p
        concat: "\n\n"
      URLs: //meta[@property="og:url"]/@content
      Date:
        selector: //script[@type="application/ld+json"]/text()
        postProcess:
          - javascript: |
              if (value?.length) {
                const json = JSON.parse(value);
                if (json?.uploadDate) {
                  return json.uploadDate.substring(0, 10);
                }
              }
      Image:
        selector: //meta[@property="og:image"]/@content
        postProcess:
          # Remove (scaled-down) resolution from image URL, e.g.
          # https://example.com/wp-content/uploads/2026/05/Example-Something-768x432.webp
          # becomes (854x480)
          # https://example.com/wp-content/uploads/2026/05/Example-Something.webp
          - replace:
              - regex: -\d+x\d+
                with: ""
      Studio:
        Name: //meta[@property="og:site_name"]/@content
      Tags:
        Name: //h2[text()="Tags"]/following-sibling::div/a
      Performers:
        Name: //div[contains(@class, "vd-meta-models")]//span[@class="vmeta-name"]
        URLs:
          selector: //div[contains(@class, "vd-meta-models")]//a[contains(@class, "vd-model-link")]/@href
          postProcess:
            - replace:
                - regex: ^/
                  with: https://evilerotic.com/

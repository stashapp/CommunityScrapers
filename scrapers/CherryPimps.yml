name: CherryPimps
galleryByURL:
  - action: scrapeXPath
    url: &urls
      - cherrypimps.com/trailers/
      - wildoncam.com/trailers/
    scraper: galleryScraper
sceneByURL:
  - action: scrapeXPath
    url: *urls
    scraper: sceneScraper

xPathScrapers:
  galleryScraper:
    gallery:
      Title: &titleSel //div[@class='item-title']/h1/text()
      Studio: &studioAttr
        Name:
          selector: //a[contains(@href, 'cherrypimps.com/series/')]/@title | //base[contains(@href, 'wildoncam.com')]/@href
          postProcess:
            - map:
                https://wildoncam.com/: "Wild on Cam"
                CherryPimps: "Cherry Pimps"
                BCM: "BCM.XXX"
                Confessions: "Confessions.XXX"
                Cucked: "Cucked.XXX"
                Drilled: "Drilled.XXX"
                Ebony xxx: "Ebony"
                Milf xxx: "MILF"
                Petite: "Petite.XXX"
                Cherry spot: "Cherry Spot"
                Archives: "CherryPimps Archives"
                Wild on cam: "Wild on Cam"
                COTM: "Cherry of the Month"
      Date: &dateAttr
        selector: //i[@class='fa fa-calendar']/following-sibling::strong/following-sibling::text()
        postProcess:
          - parseDate: January 2, 2006
      Performers: &perfAttr
        Name: //div[@class='update-info-block models-list-thumbs']//span/text()
      Details: &detailsSel //h4[normalize-space('Description:')]/following-sibling::p/text()
      Tags: &tagsAttr
        Name: //ul[@class='tags']/li/a/text()

  sceneScraper:
    scene:
      Title: *titleSel
      Studio: *studioAttr
      Date: *dateAttr
      Performers: *perfAttr
      Details: *detailsSel
      Tags: *tagsAttr
      Image: //div[@class="player-thumb"]/img/@src0_1x

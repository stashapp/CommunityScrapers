name: Unkotare
sceneByURL:
  - action: scrapeXPath
    url:
      - unkotare.com
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.unkotare.com/moviepages/{filename}/index.html
  queryURLReplace:
    filename:
      - regex: unkotare_(.*)\..+$
        with: $1
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $movie: //div[@class="prof_pict_area"]
      $pict: //div[@class="prof_pict_area"]/img/@src
    scene:
      Title: //div[@class="head_banner1"][$movie]/@title
      URLs:
        selector: $pict
        postProcess:
          - replace:
              - regex: .*moviepages\/(.*?)\/.*
                with: https://www.unkotare.com/moviepages/$1/index.html|https://en.unkotare.com/moviepages/$1/index.html
        split: "|"
      Date:
        # the page shows no date; "ki" ids are YYMMDD and match the 公開日 the sibling h0930 sites print
        selector: $pict
        postProcess:
          - javascript: |
              const m = value.match(/moviepages\/ki(\d{2})(\d{2})(\d{2})\//);
              return m ? `20${m[1]}-${m[2]}-${m[3]}` : "";
      Performers:
        Name:
          selector: //div[@class="namearea"][$movie]/div[@class="d1"]
          postProcess:
            - replace:
                - regex: (.*).\d{2}.
                  with: $1
      Code:
        selector: $pict
        postProcess:
          - replace:
              - regex: .*moviepages\/(.*?)\/.*
                with: $1
      Tags:
        Name:
          selector: //meta[@name="keywords"][$movie]/@content
          split: ","
      Image:
        selector: $pict
        postProcess:
          - replace:
              - regex: ^
                with: "https:"
      Studio:
        Name:
          selector: $pict
          postProcess:
            - replace:
                - regex: .+
                  with: Unkotare
driver:
  cookies:
    - CookieURL: "https://www.unkotare.com/"
      Cookies:
        - Name: "over18_confirmed"
          Domain: ".unkotare.com"
          Value: "1"
          Path: "/"

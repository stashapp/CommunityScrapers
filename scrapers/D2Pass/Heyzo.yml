name: Heyzo
sceneByName:
  action: scrapeXPath
  queryURL: https://en.heyzo.com/list/search/1?q={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - en.heyzo.com/movie
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://en.heyzo.com/movie/{filename}
  queryURLReplace:
    filename:
      - regex: (?i).*heyzo\D*(\d{4}).*
        with: $1
      - regex: (.*[^a-zA-Z\d])*(\d{4})[^a-zA-Z\d].*
        with: $2
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $info: //div[contains(@class, "Movie_movieInfo")]
      $canonical: //link[@rel="canonical"]/@href
    scene:
      Title: $info//h1
      Code:
        selector: $canonical
        postProcess:
          - replace:
              - regex: .*/movie/(\d+).*
                with: $1
      URLs:
        selector: $canonical
        postProcess:
          - replace:
              - regex: .*/movie/(\d+).*
                with: https://www.heyzo.com/movie/$1|https://en.heyzo.com/movie/$1
        split: "|"
      Date:
        selector: $info/div[span="Release Date"]/text()
        postProcess:
          - parseDate: January 2, 2006
      Performers:
        Name: $info//a[contains(@href, "/listpages/actor_")]
      Tags:
        Name: $info//div[contains(@class, "Movie_tags")]/a
      Image: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: Heyzo
  sceneSearch:
    common:
      $title: //div[contains(@class, "List_movies")]//a[@class="title"]
    scene:
      Title: $title
      Code:
        selector: $title/@href
        postProcess:
          - replace:
              - regex: .*/movie/(\d+).*
                with: $1
      URLs:
        selector: $title/@href
        postProcess:
          - replace:
              - regex: ^/
                with: https://en.heyzo.com/
      Image:
        selector: //div[contains(@class, "List_movies")]//img[@alt="Thumbnail"]/@src
        postProcess:
          - replace:
              - regex: ^/
                with: https://en.heyzo.com/
      Date:
        selector: $title/following-sibling::p
        postProcess:
          - parseDate: January 2, 2006
      Studio:
        Name:
          fixed: Heyzo
driver:
  headers:
    - Key: Accept
      Value: text/html

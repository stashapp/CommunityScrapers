name: Heyzo

sceneByName:
  action: scrapeXPath
  queryURL: https://en.heyzo.com/search/{}/1.html?sort=pop
  scraper: sceneSearch

sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

sceneByURL:
  - action: scrapeXPath
    url:
      - en.heyzo.com/moviepages
    scraper: sceneScraper

sceneByFragment:
  action: scrapeXPath
  queryURL: https://en.heyzo.com/moviepages/{filename}
  # Constructs the movie URL from the filename, provided that the filename includes the movie ID.
  queryURLReplace:
    filename:
      # Heyzo uses a 4 digit number for movie IDs, preferred next to the brand
      # token so a resolution or year elsewhere in the name cannot win
      - regex: (?i).*heyzo\D*(\d{4}).*
        with: $1/index.html
      - regex: (.*[^a-zA-Z\d])*(\d{4})[^a-zA-Z\d].*
        with: $2/index.html
  scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    common:
      $table: //div[@class="info-bg"]//table[contains(@class,"movieInfo")]//tr
      $movieObject: //script[contains(.,"movie_obj")]/text()
    scene:
      Date:
        selector: $table/td[contains(.,"Released")]/following-sibling::td/text()
        postProcess:
          - parseDate: 2006-01-02

      Performers:
        Name: $table/td[contains(.,"Actress")]/following-sibling::td/a/text()

      Image:
        selector: $movieObject
        postProcess:
          - replace:
              - regex: .*"image"\s*:\s*"([^"]+).*
                with: https:$1

      Title:
        selector: $movieObject
        postProcess:
          - replace:
              - regex: .*"@type"\s*:\s*"Movie"\s*,\s*"name"\s*:\s*"([^"]+).*
                with: $1

      Code:
        selector: //script[contains(.,"movieId")]/text()
        postProcess:
          - replace:
              - regex: .*movieId\s*=\s*"([^"]+).*
                with: $1

      URLs:
        selector: //script[contains(.,"movieId")]/text()
        postProcess:
          - replace:
              - regex: .*movieId\s*=\s*"([^"]+).*
                with: https://www.heyzo.com/moviepages/$1/index.html|https://en.heyzo.com/moviepages/$1/index.html
        split: "|"

      Tags:
        Name: $table/td[contains(.,"Type") or contains(.,"Sex Styles") or contains(.,"Theme")]/following-sibling::td/a/text()

      Studio:
        Name:
          fixed: Heyzo

  sceneSearch:
    common:
      $card: //div[@id="movies"]/div[contains(@class,"movie")]
    scene:
      Code:
        selector: $card/a[1]/@href
        postProcess:
          - replace:
              - regex: '.*/moviepages/(\d{4})/index\.html.*'
                with: $1

      URLs:
        selector: $card/a[1]/@href
        postProcess:
          - replace:
              - regex: "^/"
                with: https://en.heyzo.com/

      Image:
        selector: $card/a[1]/img/@data-original
        postProcess:
          - replace:
              - regex: "^/"
                with: https://en.heyzo.com/

      Date:
        selector: $card//p[contains(@class,"release")]/text()
        postProcess:
          - replace:
              - regex: '^\s*Release:\s*'
                with: ""
          - parseDate: 2006-01-02

      Studio:
        Name:
          fixed: Heyzo

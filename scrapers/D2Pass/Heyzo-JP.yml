name: Heyzo-JP
sceneByURL:
  - action: scrapeXPath
    url:
      - www.heyzo.com/movie
    scraper: sceneScraper
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.heyzo.com/movie/{filename}
  queryURLReplace:
    filename:
      - regex: (?i).*heyzo\D*(\d{4}).*
        with: $1
      - regex: (.*[^a-zA-Z\d])*(\d{4})[^a-zA-Z\d].*
        with: $2
  scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $info: //div[contains(@class, "Movie_movieInfo")]
      $canonical: //link[@rel="canonical"]/@href
    scene:
      Title: $info//h1
      Code:
        selector: $canonical
        postProcess:
          - replace:
              - regex: .*/movie/(\d+).*
                with: $1
      URLs:
        selector: $canonical
        postProcess:
          - replace:
              - regex: .*/movie/(\d+).*
                with: https://www.heyzo.com/movie/$1|https://en.heyzo.com/movie/$1
        split: "|"
      Details: $info/p[contains(@class, "Movie_memo")]
      Date:
        selector: $info/div[span="配信日"]/text()
        postProcess:
          - parseDate: 2006年1月2日
      Performers:
        Name: $info//a[contains(@href, "/listpages/actor_")]
      Tags:
        Name: $info//div[contains(@class, "Movie_tags")]/a
      Image: //meta[@property="og:image"]/@content
      Studio:
        Name:
          fixed: Heyzo
driver:
  headers:
    - Key: Accept
      Value: text/html

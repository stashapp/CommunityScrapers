name: LetsDoeIt
# requires: py_common, AyloAPI
sceneByURL:
  - action: scrapeXPath
    url:
      - amateureuro.com
      - doe-tv.com
      - forbondage.com
      - mamacitaz.com
      - transbella.com
      - vipsexvault.com
    scraper: sceneScraper
  - action: script
    url: &ayloURLs
      - letsdoeit.com/scene/
      - doegirls.com/scene/
      - doegirls.com/watch/
    script:
      - python
      - LetsDoeIt.py
      - scene-by-url

galleryByURL:
  - action: script
    url: *ayloURLs
    script:
      - python
      - LetsDoeIt.py
      - gallery-by-url

sceneByFragment:
  action: script
  script:
    - python
    - LetsDoeIt.py
    - scene-by-fragment
sceneByName:
  action: script
  script:
    - python
    - LetsDoeIt.py
    - scene-by-name
sceneByQueryFragment:
  action: script
  script:
    - python
    - LetsDoeIt.py
    - scene-by-query-fragment
performerByURL:
  - action: scrapeXPath
    url:
      - amateureuro.com/models/
      - doe-tv.com/models/
      - mamacitaz.com/models/
      - transbella.com/models/
      - vipsexvault.com/models/
    scraper: performerScraper
  - action: script
    url:
      - letsdoeit.com/model/
      - doegirls.com/models/
    script:
      - python
      - LetsDoeIt.py
      - performer-by-url
performerByName:
  action: script
  script:
    - python
    - LetsDoeIt.py
    - performer-by-name
performerByFragment:
  action: script
  script:
    - python
    - LetsDoeIt.py
    - performer-by-fragment
groupByURL:
  - action: script
    url:
      - letsdoeit.com/movie/
    script:
      - python
      - LetsDoeIt.py
      - movie-by-url

xPathScrapers:
  sceneScraper:
    common:
      $actors: //div[@class="actors" or @class="-mvd-grid-actors"]
      $details: //div[@class="row sides-xs"]
      $letsdoeit: //div[@class="-mvd-grid-more"]//span/a[@class="-mvd-list-url"]
    scene:
      Title: //meta[@property='og:title']/@content
      Details: //div[@class='-mvd-description']/text() | //read-even-more/text()
      Date:
        selector: //meta[@itemprop='uploadDate']/@content | //div[@class='-mvd-grid-stats']
        postProcess:
          - replace:
              - regex: .+(\w\w\w\s\d\d?,\s\d\d\d\d)$
                with: $1
          - parseDate: Jan 2, 2006
          - parseDate: 2006-01-02T15:04:05-07:00
      Image:
        selector: //div[@class='video-container']//img[not(contains(@src, '.svg'))]/@src
        postProcess:
          - replace:
              - regex: ^/web/
                with: https://web.archive.org/web/
      Tags:
        #Name: //div[@class='-mvd-grid-more-title' and contains(text(),'Information')]/following-sibling::div//a
        Name: //a[contains(@href,'/categories/')]
      Studio:
        Name:
          selector: $actors//a[contains(@href,'/channels/')]
          postProcess:
            - map:
                Trans Bella: TransBella
      Performers:
        URLs: &performerURL $actors//a[contains(@href,'/models/')]/@href
        Name: $actors//a[contains(@href,'/models/')]
        FakeTits:
          selector: *performerURL
          postProcess:
            - subScraper: &performerTits
                selector: //div[@class='-api-list-item' and contains(.,'Tits Type')]/span
                postProcess:
                  - replace:
                      - regex: ^.+?Enhanced.+$
                        with: "Yes"
                      - regex: ^.+?Natural.+$
                        with: "No"
        Country:
          selector: *performerURL
          postProcess:
            - subScraper: &performerCountry
                selector: //div[(contains(@class,'-api-list-item')) and contains(.,'Birth Place')]/span[@class='-api-list-text']/text()
        Details:
          selector: *performerURL
          postProcess:
            - subScraper: &performerDetails
                selector: //read-even-more
        Images:
          selector: *performerURL
          postProcess:
            - subScraper: &performerImage
                selector: //img[@class='-api-poster-thumb']/@src

  performerScraper:
    performer:
      Name: //h1
      Birthdate:
        selector: //div[contains(@class,'-api-list-item') and contains(.,'Birth Date')]/span[@class='-api-list-text']
        postProcess:
          - parseDate: Jan 2, 2006
      Country: *performerCountry
      FakeTits: *performerTits
      Details: *performerDetails
      Images: *performerImage

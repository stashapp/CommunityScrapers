# Nerd Pervert — scene scraper
#
# Covers nerdpervert.com tour trailer pages (nerdpervert.com/tour/trailers/*.html).
# No community or installed scraper claims this host.
#
# The scene page publishes no date (the footer's "Date: ..." line is the site's
# "today", not the scene's), no structured cast and no tags, so those fields are
# deliberately omitted rather than scraped wrong.
name: Nerd Pervert
sceneByURL:
  - action: scrapeXPath
    url:
      - nerdpervert.com/tour/trailers/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1
      Details: //div[contains(@class, "story")]
      Image:
        selector: //img[contains(@src, "contentthumbs")]/@src
        postProcess:
          - replace:
              - regex: ^/
                with: https://nerdpervert.com/
      URLs:
        fixed: "{inputURL}"
      Studio:
        Name:
          fixed: Nerd Pervert

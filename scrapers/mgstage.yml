name: mgstage
sceneByURL:
  - action: scrapeXPath
    url:
      - www.mgstage.com/product/ # www is needed here, do not remove
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //h1[@class="tag"]
      Code: //th[contains(.,"品番：")]/../td
      Date:
        selector: //th[contains(.,"配信開始日：")]/../td
        postProcess:
          - parseDate: 2006/01/02
      Details: //dl[@id="introduction"]/dd
      Tags:
        Name: //th[contains(.,"ジャンル：")]/../td/a
      Performers:
        Name: //th[contains(.,"出演：")]/../td/a
      Studio:
        Name:
          selector: //th[contains(.,"メーカー：")]/../td/a
          postProcess:
            - replace:
                - regex: \s+
                  with: ""
      Image: //a[@id="EnlargeImage"]/@href
driver:
  cookies:
    - CookieURL: "https://www.mgstage.com/product/"
      Cookies:
        - Name: "adc"
          Domain: ".mgstage.com"
          Value: "1"
          Path: "/"

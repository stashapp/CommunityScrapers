name: SexMex

sceneByURL: &byUrl
  - action: scrapeXPath
    url:
      - exposedlatinas.com/tour/updates
      - sexmex.xxx/tour/updates
      - transqueens.com/tour/updates
    scraper: sexmex
sceneByName:
  action: scrapeXPath
  queryURL: "https://sexmex.xxx/tour/search.php?query={}"
  scraper: search
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sexmex

galleryByURL: *byUrl

xPathScrapers:
  search:
    common:
      $scene: //div[@data-setid]
    scene:
      Title: $scene//h3
      URL: $scene//h3/a/@href
      Date:
        selector: $scene//p[contains(@class, "scene-date")]
        postProcess:
          - parseDate: 01/02/2006
      Image: $scene//img/@src
  sexmex:
    common:
      $jsonld: //script[@type="application/ld+json"]
    scene:
      Title:
        &title # ExposedLatinas and TransQueens still use the old layout so we keep both selectors
        selector: //div[@class="panel-body"]/h2 | //div[@class="panel-body"]/h4
        postProcess:
          - replace:
              - regex: ^Scenes:\s*
                with: ""
              - regex: \s*\..*
                with: ""
      URL: &url
        selector: //link[@rel="canonical"]/@href | //base[not(//link[@rel="canonical"])]/@href | //option[@selected][not(//link[@rel="canonical"])]/@value
        concat: "/"
        postProcess:
          - replace:
              - regex: tour/+tour
                with: tour
      Code: &code
        selector: $jsonld
        postProcess:
          - replace:
              - regex: .*"contentUrl":"[^"]*/trailers/([^."]+)\.mp4".*
                with: $1
      Date: &date
        selector: $jsonld
        postProcess:
          - replace:
              - regex: .*"uploadDate":"([^"T]+)T.*
                with: $1
          - parseDate: 2006-01-02
      Details: &details //div[@class="panel-body"]/p[not(@class)]
      Tags: &tags
        Name:
          selector: //meta[@name="keywords"]/@content
          postProcess:
            - replace:
                - regex: ", "
                  with: ","
          split: ","
      Performers: &performers
        Name:
          selector: //div[@class="panel-body"]/p[@class="cptn-model"]/a//text()
          postProcess:
            - javascript: |
                if (value?.length) {
                  return value.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
                }
      Studio: &studio
        Name:
          selector: //base/@href
          postProcess:
            - map:
                https://exposedlatinas.com/tour/: Exposed Latinas
                https://sexmex.xxx/tour/: Sex Mex
                https://transqueens.com/tour/: Trans Queens
      Image:
        selector: $jsonld
        postProcess:
          - replace:
              - regex: .*"thumbnailUrl":\["([^"]+)"\].*
                with: $1

    gallery:
      Title: *title
      URL: *url
      Code: *code
      Date: *date
      Details: *details
      Tags: *tags
      Performers: *performers
      Studio: *studio

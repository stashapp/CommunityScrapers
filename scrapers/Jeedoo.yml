name: Jeedoo

sceneByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: movieScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.jeedoo.com/porn-movies/?show_no_offer=1&search={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  movieScraper:
    group:
      Name: &title
        selector: //title
        postProcess:
          - replace:
              - regex: ((DVD|HD\-DVD|VHS\-Video)\s+\-\s+Porn\s+Movies\s+Streams\s+and\s+Downloads|\s+Stream\s+&\s+Download)
                with: ""
      Date: &date
        selector: //div[contains(text()[2], "Release date:")]/text()[2] | //td[@class="de1"][contains(., "released on")]/following-sibling::td
        postProcess:
          - javascript: |
              const months = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
              const v = value.replace(/^\s*Release date:\s*/, "").trim();
              let m;
              if ((m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/))) return `${m[3]}-${m[1]}-${m[2]}`;
              if ((m = v.match(/^(\w+) (\d{1,2}), (\d{4})$/)) && months.includes(m[1])) {
                const month = String(months.indexOf(m[1]) + 1).padStart(2, "0");
                return `${m[3]}-${month}-${m[2].padStart(2, "0")}`;
              }
              return "";
      Studio: &studio
        Name: //div[@class="undertitle"]//a[contains(@href, "?label=")]
      Synopsis: &details //meta[@property="og:description"]/@content
      FrontImage: //img[contains(@class,"mainimage")][@rel="1"]/@src
      BackImage: //img[contains(@class,"mainimage")][@rel="2"]/@src
      URLs: &url //link[@rel="alternate"][@hreflang="en"]/@href
      Tags: &tags
        Name: //a[@title="Categorie / Genre"]
      Director: &director //a[@title="Director"]
      Duration:
        selector: //div[contains(text(),"Length:")]/text()[1] | //td[@class="de1"][contains(., "Length:")]/following-sibling::td
        postProcess:
          - replace:
              - regex: ^\[(.+)\]$
                with: $1
              - regex: ^[^\d]*(\d+)\s*min.*
                with: "$1:00"
  sceneScraper:
    scene:
      Title: *title
      URLs: *url
      Date: *date
      Studio: *studio
      Details: *details
      Image: //img[contains(@class,"mainimage")][@rel="1"]/@src
      Performers:
        Name: //a[@title="Cast"]
        URLs:
          selector: //a[@title="Cast"]/@href
          postProcess:
            - replace:
                - regex: ^
                  with: "https://www.jeedoo.com"
      Tags: *tags
      Director: *director
  sceneSearch:
    common:
      $searchItem: //a[contains(@href,"/product/")]/img/..
    scene:
      Title:
        selector: $searchItem/img/@alt
        postProcess:
          - replace:
              - regex: ^(DVD|HD-DVD|Blu-ray|VHS-Video)\s+
                with: ""
      URLs:
        selector: $searchItem/@href
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.jeedoo.com"
      Image: $searchItem/img/@data-src

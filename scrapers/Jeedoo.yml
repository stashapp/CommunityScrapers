name: Jeedoo

sceneByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: movieScraper
# Jeedoo's listing and search pages answer Cloudflare's "Just a moment..."
# challenge (HTTP 403) to non-browser clients, so the site's search results page
# cannot be scraped and CDP does not clear it (headless fingerprint:
# navigator.webdriver=true, window.chrome undefined - reproduced 2026-11-13
# against the chrome-cdp service on LOGOS). The site's own search box uses the
# AJAX endpoint below, which is NOT challenged, so name search goes through it.
sceneByName:
  action: scrapeJson
  queryURL: https://www.jeedoo.com/ajax/suggest/titles/?q={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  movieScraper:
    group:
      Name: &title
        selector: //meta[@property="og:title"]/@content
        postProcess:
          - javascript: |
              let v = value.replace(/\s+/g, " ").trim();
              v = v.replace(/\s+[-–]\s+(DVD|HD-DVD|VHS-Video|Blu-ray)$/i, "");
              v = v.replace(/\s+[-–]\s+Stream\s*&\s*Download$/i, "");
              return v.trim();
      Date: &date
        selector: >-
          (//dt[normalize-space()="Release date"] | //dt[normalize-space()="Erscheinungsdatum"])/following-sibling::dd[1]
        postProcess:
          - javascript: |
              const en = ["January", "February", "March", "April", "May", "June", "July",
                "August", "September", "October", "November", "December"];
              const de = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli",
                "August", "September", "Oktober", "November", "Dezember"];
              const pad = (n) => (n < 10 ? "0" + n : "" + n);
              const v = value.replace(/\s+/g, " ").trim();
              let m;
              if ((m = v.match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/))) {
                const i = en.indexOf(m[1]);
                if (i >= 0) return m[3] + "-" + pad(i + 1) + "-" + pad(m[2]);
              }
              if ((m = v.match(/^(\d{1,2})\.\s*([A-Za-zÄÖÜäöüß]+)\s+(\d{4})$/))) {
                const i = de.indexOf(m[2]);
                if (i >= 0) return m[3] + "-" + pad(i + 1) + "-" + pad(m[1]);
              }
              if ((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) {
                return m[3] + "-" + pad(m[1]) + "-" + pad(m[2]);
              }
              return "";
      Studio: &studio
        Name: (//dt[normalize-space()="Studio"])/following-sibling::dd[1]
      Synopsis: &details (//div[contains(@class,"pp-description")]/p)[1]
      FrontImage: &frontimage //meta[@property="og:image"]/@content
      BackImage: (//div[@data-pp-gallery]//a[contains(@class,"pp-slide")])[2]/@href
      URLs: &url //link[@rel="alternate"][@hreflang="en"]/@href
      Tags: &tags
        Name: >-
          (//dt[normalize-space()="Genre"] | //dt[normalize-space()="Categories"] | //dt[normalize-space()="Kategorien"])/following-sibling::dd[1]//a
      Director: &director
        selector: (//dt[normalize-space()="Director"] | //dt[normalize-space()="Regie"])/following-sibling::dd[1]
      Duration:
        selector: >-
          (//dt[normalize-space()="Runtime"] | //dt[normalize-space()="Laufzeit"])/following-sibling::dd[1]
        postProcess:
          - javascript: |
              const v = value.replace(/\s+/g, " ").trim();
              let m;
              if ((m = v.match(/(\d+)\s*(?:Std\.?|h|hr)\b/i))) {
                const h = parseInt(m[1], 10);
                const mm = v.match(/(\d+)\s*(?:Min\.?|min)\b/i);
                return (h * 60 + (mm ? parseInt(mm[1], 10) : 0)) + ":00";
              }
              if ((m = v.match(/(\d+)/))) return m[1] + ":00";
              return "";
  sceneScraper:
    scene:
      Title: *title
      URLs: *url
      Date: *date
      Studio: *studio
      Details: *details
      Image: *frontimage
      Tags: *tags
      Director: *director

# sceneSearch maps the AJAX suggest payload. Suggestion rows that point at
# studio/performer filter pages (?label= / ?actor=) carry no price, so the
# price filter keeps only real titles (DVD product and stream-download pages).
jsonScrapers:
  sceneSearch:
    common:
      $items: items.#(price!="")#
    scene:
      Title: $items.name
      URLs:
        selector: $items.link
        postProcess:
          - replace:
              - regex: ^
                with: https://www.jeedoo.com
      Image: $items.image

# Last Updated 2026-11-13

name: Jeedoo

sceneByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - jeedoo.com
    scraper: movieScraper
sceneByName:
  action: scrapeJson
  queryURL: https://www.jeedoo.com/ajax/suggest/titles/?q={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  movieScraper:
    group:
      Name: &title
        selector: //meta[@property="og:title"]/@content
        postProcess:
          - replace:
              - regex: \s+[-–]\s+(DVD|HD-DVD|VHS-Video|Blu-ray|Stream\s*&\s*Download)$
                with: ""
      Date: &date
        selector: //dt[normalize-space()="Release date" or normalize-space()="Erscheinungsdatum"]/following-sibling::dd[1]
        postProcess:
          - javascript: |
              const german = { "mär": "mar", mai: "may", okt: "oct", dez: "dec" };
              const month = (name) => {
                const abbr = name.toLowerCase().slice(0, 3);
                const i = "janfebmaraprmayjunjulaugsepoctnovdec".indexOf(german[abbr] || abbr);
                return String(i / 3 + 1).padStart(2, "0");
              };
              let m;
              if ((m = value.match(/^([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/)))
                return `${m[3]}-${month(m[1])}-${m[2].padStart(2, "0")}`;
              if ((m = value.match(/^(\d{1,2})\.\s*(\S+)\s+(\d{4})$/)))
                return `${m[3]}-${month(m[2])}-${m[1].padStart(2, "0")}`;
              return "";
      Studio: &studio
        Name: //dd/a[contains(@href, "?label=")]
      Synopsis: &details (//div[contains(@class,"pp-description")]/p)[1]
      FrontImage: &frontimage //meta[@property="og:image"]/@content
      BackImage: (//div[@data-pp-gallery]//a[contains(@class,"pp-slide")])[2]/@href
      URLs: &url //link[@rel="alternate"][@hreflang="en"]/@href
      Tags: &tags
        Name: //dd/a[contains(@href, "/browse") and contains(@href, "C=")]
      Director: &director //dd/a[contains(@href, "?autor=")]
      Duration:
        selector: //dt[normalize-space()="Runtime" or normalize-space()="Laufzeit"]/following-sibling::dd[1]
        postProcess:
          - replace:
              - regex: (?i)^(\d+)\s*min.*
                with: $1:00
  sceneScraper:
    scene:
      Title: *title
      URLs: *url
      Date: *date
      Studio: *studio
      Details: *details
      Image: *frontimage
      Performers:
        Name: //dd/a[contains(@href, "?actor=")]
      Tags: *tags
      Director: *director

jsonScrapers:
  sceneSearch:
    common:
      $items: items.#(price!="")#
    scene:
      Title: $items.name
      URLs:
        selector: $items.link
        postProcess:
          - replace:
              - regex: ^
                with: https://www.jeedoo.com
      Image: $items.image

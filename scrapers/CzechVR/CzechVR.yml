name: CzechVR
sceneByName:
  action: scrapeXPath
  scraper: sceneByName
  queryURL: https://www.czechvr.com/searching?search={}

sceneByQueryFragment:
  action: scrapeXPath
  scraper: sceneScraper
  queryURL: "{url}"

sceneByURL:
  - action: scrapeXPath
    url:
      - czechar.com
      - czechvr.com
      - czechvrcasting.com
      - czechvrfetish.com
      - czechvrnetwork.com
      - vrintimacy.com
    scraper: sceneScraper
groupByURL:
  - action: scrapeXPath
    url:
      - czechar.com
      - czechvr.com
      - czechvrcasting.com
      - czechvrfetish.com
      - czechvrnetwork.com
      - vrintimacy.com
    scraper: movieScraper

xPathScrapers:
  sceneByName:
    common:
      $card: //div[contains(concat(' ',normalize-space(@class),' '),' postTag ')]
    scene:
      Title: $card//h2
      URLs:
        selector: $card//div[@class='desktop']/a/@href
        postProcess:
          - replace:
              - regex: ^\.
                with: https://www.czechvr.com
      Image:
        selector: $card//div[@class='desktop']/a/img/@src
        postProcess:
          - replace:
              - regex: ^\.
                with: https://www.czechvr.com

  sceneScraper:
    common:
      $info: &infoSel //div[@class="post"]
    scene:
      URLs: //link[@rel='canonical']/@href
      Title: &title
        selector: &titleSel $info//h1|$info//h2
        postProcess:
          - replace:
              - regex: ^.*?\d+ - (.*)$
                with: $1
      Code:
        selector: *titleSel
        postProcess:
          - replace:
              - regex: ^.*?(\d+) - .*$
                with: $1
      Date: &date
        selector: $info//div[@class="datum"]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: &detailsSel //div[@class="text"]/text()
      Tags:
        Name: //div[@class="tag new"]/a
      Performers:
        Name: $info//div[@class="modelky"]//a//span
      Studio: &studio
        Name:
          selector: //title | $info//h1
          concat: __SEP__
          postProcess:
            - replace:
                - regex: ^.* - Czech VR Network__SEP__(\w+) \d+ - .*$
                  with: $1
                - regex: "^.* - (.+?)(?: Porn Videos)?__SEP__.*$"
                  with: $1
            - map:
                CAR: Czech AR
                CVC: Czech VR Casting
                CVF: Czech VR Fetish
                CVR: Czech VR
                VRI: VR Intimacy
      Image: &image
        selector: //link[@rel='canonical']/@href|//dl8-video/@poster|//commedia-player/@poster
        concat: " "
        postProcess:
          - replace:
              - regex: /detail-\S*\s(/cdn-cgi/image/[^/]+/)?\./category
                with: /category
              - regex: //
                with: /
              - regex: :/
                with: ://
  movieScraper:
    common:
      $info: *infoSel
    group:
      Name: *title
      Duration: $info//div[@class="cas"]/text()
      Date: *date
      Studio: *studio
      Synopsis: *detailsSel
      FrontImage: *image

driver:
  cookies:
    - CookieURL: https://www.czechvr.com
      Cookies:
        - Name: iagree
          Domain: .czechvr.com
          Value: ano
          Path: /
  useSurf: true

name: Trans500
sceneByURL:
  - action: scrapeXPath
    url:
      - trans500.com/tour/
      - trans500.com/tour3/
      - trans500.com/trailers/
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - transatplay.com/tour/
    queryURL: "{url}"
    queryURLReplace:
      # transatplay sends a broken redirect but we can rewrite it
      url:
        - regex: transatplay\.com
          with: trans500.com
    scraper: sceneScraper
  - action: scrapeXPath
    url:
      - behindtrans500.com/tour/
      - ikillitts.com/tour/
      - trans500.com/tourespanol
      - tsgirlfriendexperience.com/tour/
    scraper: sceneScraperEspanol

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="col-sm-12"]/p/../h2
      Details: //p[@class="description"]
      Image:
        selector: &imageSel //video[contains(@id, "my-video")]/@poster
        postProcess:
          - replace:
              - regex: ^
                with: "https://www.trans500.com"
      Studio:
        Name: //p[@class="pull-right"]/b/text()
      Code:
        selector: *imageSel
        postProcess: &codePostProcess
          - replace:
              - regex: .*/([^/]+)/.*
                with: $1

  sceneScraperEspanol:
    scene:
      Title:
        selector: //header[@id="scene-info"]/h1/text()[contains(., ":")]
        postProcess:
          - replace:
              - regex: .*:.
                with:
      Date:
        selector: //div[contains(text(), "Added:")]
        postProcess:
          - replace:
              - regex: ".*:"
                with:
          - parseDate: 01/02/2006
      Performers:
        Name: //div[@class="scene-infobrick"][contains(text(), "TSGirls:")]/a
      Details: //section[@id="scene-desc"]/p
      Image:
        selector: &imageSelEspanol //video/@poster|//meta[@name="twitter:image0"]/@content
        postProcess:
          - replace:
              - regex: "^http:"
                with: "https:"
      Studio:
        Name:
          selector: //div[@class="scene-infobrick"][contains(text(), "Categories:")]/a
          concat: ","
          postProcess:
            - replace:
                - regex: .*(superramon).*
                  with: "Super Ramon"
                - regex: .*(tsgirlfriendexperience).*|.*(TSGFE).*
                  with: "TS Girlfriend Experience"
                - regex: .*(ikillitts).*|.*(I Kill it TS).*|.*(IKI).*
                  with: "I Kill It TS"
                - regex: .*(transatplay).*|.*(TAP).*|.*(trans at play).*
                  with: "Trans at Play"
                - regex: .*(behindtrans500).*|.*(behind the scenes).*
                  with: "Behind Trans500"
      Tags: # Either //meta[@name="keywords"]/@content OR: //div[@class="scene-infobrick"][contains(text(), "Categories:")]/a
        Name: //div[@class="scene-infobrick"][contains(text(), "Categories:")]/a
      Code:
        selector: *imageSelEspanol
        postProcess: *codePostProcess

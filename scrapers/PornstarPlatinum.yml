name: "PornstarPlatinum"
sceneByURL:
  - action: scrapeXPath
    url:
      - pornstarplatinum.com/tour/model/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $panel: //div[@class="panel-content"]
    scene:
      Title: //div[contains(@class,"video-slider-meta")]/h3
      Date: $panel/div[contains(@class,"video-author")]/span[2]
      Details: $panel/p
      Tags:
        Name: $panel//div[@class="tagcloud"]/a
      Studio:
        Name:
          fixed: "Pornstar Platinum"
      Image: //div[@class="otplayer-wrapper text-center f"]/a/img[not(contains(@src,"trailer-placeholder"))]/@src

name: mypervmom.com

# Wordpress REST API for JSON
sceneByURL:
  - action: scrapeJson
    url:
      - boyfriendsharing.com
      - brattyfamily.com
      - gostuckyourself.net
      - hugecockbreak.com
      - littlefromasia.com
      - mommysboy.net
      - momxxx.org
      - mybadmilfs.com
      - mydaughterswap.com
      - mypervmom.com
      - mysislovesme.com
      - youngerloverofmine.com
    queryURL: "{url}"
    queryURLReplace:
      url:
        # last path segment is the slug - some domains use flat /slug/
        # permalinks, others use dated /YYYY/MM/DD/slug/ permalinks
        - regex: '^https?://(?:www\.)?([^/]+)/(?:.*/)?([^/]+)/?$'
          with: "https://${1}/wp-json/wp/v2/posts?_embed=1&_fields=title,date,link,_links,_embedded,meta&slug=${2}"
    scraper: sceneScraper

jsonScrapers:
  sceneScraper:
    scene:
      Title:
        selector: 0.title.rendered
        postProcess:
          - &decodeEntities
            javascript: |
              var entities = {
                "&#8216;": "‘",
                "&#8217;": "’",
                "&#8220;": "“",
                "&#8221;": "”",
                "&#8211;": "–",
                "&#8212;": "—",
                "&#8230;": "…",
                "&hellip;": "…",
                "&#39;": "'",
                "&#039;": "'",
                "&apos;": "'",
                "&quot;": "\"",
                "&#160;": " ",
                "&nbsp;": " ",
                "\u00A0": " ",
                "&#038;": "&",
                "&amp;": "&"
              };
              return value.replace(/&#?\w+;|\u00A0/g, function (m) {
                return entities[m] || m;
              });
      Details:
        selector: 0.meta.description
        postProcess:
          - *decodeEntities
          - javascript: |
              // some posts store a literal `\r\n`/`\n` in the description
              // text itself rather than a real line break
              return value.replace(/\\r\\n/g, "\n").replace(/\\n/g, "\n");
      Date:
        selector: 0.date
        postProcess:
          - parseDate: 2006-01-02T15:04:05
      Performers:
        Name:
          selector: "0._embedded.wp:term.1.#.name"
          postProcess:
            - *decodeEntities
      Image: "0._embedded.wp:featuredmedia.0.source_url"
      URLs: 0.link
      Studio:
        Name:
          selector: 0.link
          postProcess:
            - replace:
                - regex: '^https?://(?:www\.)?([^/]+)/.*$'
                  with: "${1}"
            - map:
                boyfriendsharing.com: Share My BF
                brattyfamily.com: Bratty Sis
                gostuckyourself.net: Go Stuck Yourself
                hugecockbreak.com: Don't Break Me
                littlefromasia.com: Little Asians
                mommysboy.net: Mommy's Boy
                momxxx.org: Mom XXX
                mybadmilfs.com: Bad MILFs
                mydaughterswap.com: Daughter Swap
                mypervmom.com: PervMom
                mysislovesme.com: Sis Loves Me
                youngerloverofmine.com: My Younger Lover

name: gelbooru-xpath
# for gelbooru 0.2+
# https://github.com/stashapp/CommunityScrapers/issues/2273
# loosely based on danbooru

# intended to capture filename as produced by gallery-dl (gelbooru_<id>_<hash>.<ext>)
sceneByFragment: &fragementscraper
  action: scrapeXPath
  queryURL: "{filename}{checksum}"
  queryURLReplace:
    filename:
      - regex: "[^a-zA-Z\\d\\-._~]" # clean filename so that it can construct a valid url
        with: ""
      - regex: "^gelbooru_(.*)" # map to domain by prefix
        with: "https://gelbooru.com/index.php?page=post&s=view&id=$1"
      - regex: "^tbib_(.*)" # map to domain by prefix
        with: "https://tbib.org/index.php?page=post&s=view&id=$1"
      - regex: "^xbooru_(.*)" # map to domain by prefix
        with: "https://xbooru.com/index.php?page=post&s=view&id=$1"
      - regex: "^safebooru_(.*)" # map to domain by prefix
        with: "https://safebooru.org/index.php?page=post&s=view&id=$1"
      - regex: "^hypnohub_(.*)" # map to domain by prefix
        with: "https://hypnohub.net/index.php?page=post&s=view&id=$1"
      - regex: "^(.*&id=)([0-9]+)_.*$" # capture numeric sequence at begining as ID
        with: "$1$2"
      - regex: "^(https://.+)$"
        with: "$1#"
      - regex: "^[^#]*$"
        with: ""
    checksum:
      - regex: "^(.+)$"
        with: "https://gelbooru.com/index.php?page=post&s=list&md5=$1"
  scraper: postScraper
imageByFragment: *fragementscraper

sceneByURL:
  - action: scrapeXPath
    url: &urls
      - https://gelbooru.com
      - https://tbib.org
      - https://xbooru.com
      - https://safebooru.org
      - https://hypnohub.net
    scraper: postScraper
imageByURL:
  - action: scrapeXPath
    url: *urls
    scraper: postScraper

xPathScrapers:
  postScraper:
    common:
      $post: //div[(@id="post-view" or @id="container") and .//li[contains(text(),"Posted")]]
    image:
      # title intentionally excluded
      #Title: &title
      #  selector: //title
      Date: &date
        selector: $post//li[contains(text(),"Posted")]/text()[1]
        postProcess:
          - replace:
              - regex: "Posted:"
                with: ""
              - regex: \d{2}:\d{2}:\d{2}$
                with: ""
          - parseDate: 2006-01-02
      Performers: &performers
        Name: $post//li[contains(@class,"tag-type-character")]/a[last()]
      Studio: &artist
        Name: $post//li[contains(@class,"tag-type-artist")]/a[last()]
      Tags: &tag_string
        Name:
          # Variant A: only pull tags
          #selector: $post//li[contains(@class,"tag-type-general")]/a[last()]
          # Variant B: also pull metadata tags (like 2D, 3D, AI generated)
          selector: $post//li[contains(@class,"tag-type-general") or contains(@class,"tag-type-metadata")]/a[last()]
      URLs: &source //link[@rel="alternate" and @hreflang="en" and //li[contains(text(),"Posted")]]/@href | $post//li[contains(text(),"Source:")]/a/@href
      # pulls note overlay texts (translations) into Details box
      Details:
        selector: $post//div[contains(@class,"note-body")]/text()
        concat: "\n"
    scene:
      # title intentionally excluded
      #Title: *title
      Date: *date
      Performers: *performers
      Studio: *artist
      Tags: *tag_string
      URLs: *source

driver:
  headers:
    - Key: User-Agent
      Value: stashapp/stash scraper

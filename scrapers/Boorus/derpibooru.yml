name: derpibooru
sceneByURL:
  - action: scrapeJson
    url: &urls
      - https://derpibooru.org/images/
      - https://furbooru.org/images/
    queryURL: "{url}"
    queryURLReplace: &apiURL
      url:
        - regex: ^(https://[^/]+)/images/(\d+).*$
          with: $1/api/v1/json/images/$2
    scraper: postScraper
imageByURL:
  - action: scrapeJson
    url: *urls
    queryURL: "{url}"
    queryURLReplace: *apiURL
    scraper: postScraper
jsonScrapers:
  postScraper:
    image:
      Date: &date
        selector: image.created_at
        postProcess:
          - replace:
              - regex: T.+
                with: ""
          - parseDate: 2006-01-02
      Studio: &artist
        Name:
          selector: image.tags.#(%"artist:*")
          postProcess:
            - replace:
                - regex: "^artist:"
                  with: ""
      Tags: &tags
        Name: image.tags.#(!%"*:*")#
      URLs: &source image.source_urls
      Details: &details image.description
    scene:
      Date: *date
      Studio: *artist
      Tags: *tags
      URLs: *source
      Details: *details
driver:
  headers:
    - Key: User-Agent
      Value: stash-scraper/1.0

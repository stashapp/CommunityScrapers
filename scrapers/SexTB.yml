name: SexTB
sceneByURL:
  - action: scrapeXPath
    url:
      - sextb.net
      - sextb.date
    scraper: sceneScraper
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://sextb.net/search/{}
  scraper: searchScraper
xPathScrapers:
  sceneScraper:
    common:
      $title: //h1[@class="film-info-title"]/strong
      $fileinfo: //div[@id="infomation"]/div[@class="col-7"]
    scene:
      Title: $title/text()[1]
      Code: $title/a[1]
      URLs: //link[@rel="canonical"]/@href
      Director: $fileinfo/div[contains(.,"Director:")]/a/strong
      Date:
        selector: $fileinfo/div[contains(.,"Release Date:")]/strong
        postProcess:
          - parseDate: Jan. 2, 2006
          - parseDate: Jan 2, 2006
      Image: //div[@id="infomation"]/div[contains(@class,"covert")]/img/@data-src
      Studio:
        Name: $fileinfo/div[contains(.,"Studio:")]/a/strong
      Tags:
        Name: $fileinfo/div[contains(.,"Genre(s):")]/a/strong
      Performers:
        Name: $fileinfo/div[contains(.,"Cast(s):")]/a/strong
  searchScraper:
    common:
      $description: //div[@class="tray-item-description"]
    scene:
      Title: $description/div[@class="tray-item-title"]
      Code: $description/div[@class="tray-item-meta-info"]/div[@class="tray-item-code"]
      URLs:
        selector: //div[contains(@class,"tray-item")]/a/@href
        postProcess:
          - replace:
              - regex: "^"
                with: "https://sextb.net"
driver:
  useSurf: true

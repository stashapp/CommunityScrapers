name: UltraFilms
sceneByURL:
  - action: scrapeXPath
    url:
      - ultrafilms.xxx
    scraper: sceneScraper

xPathScrapers:
  sceneScraper:
    scene:
      Title: //div[@class="title-block box-shadow"]
      Image: //meta[@property="og:image"]/@content
      Date:
        selector: //script[@type="application/ld+json"]/text()
        postProcess:
          - replace:
              - regex: '.*(datePublished":")(\d{4}-\d{2}-\d{2}).*'
                with: $2
          - parseDate: 2006-01-02
      Performers:
        Name: //*[@id="video-actors"]/a
      Tags:
        Name:
          selector: //*[@id="video-about"]/div[@class="tags"]/div/a
          postProcess:
            - replace:
                - regex: " (Movies|Pictures)$"
                  with: ""
      URLs: //meta[@property="og:url"]/@content
      Studio:
        Name:
          fixed: Ultra Films

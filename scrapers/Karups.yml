name: Karups
sceneByURL:
  - action: scrapeXPath
    url:
      - karups.com/video/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - karups.com/gallery/
    scraper: galleryScraper

xPathScrapers:
  sceneScraper:
    scene:
      Studio: &studio
        Name:
          selector: //span[@class="sup-title"]/span/@class
          postProcess:
            - replace:
                - regex: ^site\s+
                  with: ""
            - map:
                kow: Karups Older Women
                kha: Karups Hometown Amateurs
                kpc: Karups Private Collection
      Title: &title //h1[@class="page-heading"]/span[@class="title"]
      Details: &details
        selector: //div[@class="tour-detail-description-body"]/text()
        concat: "\n\n"
      Date: &date
        selector: //span[@class="date"]/span[@class="content"]
        postProcess:
          - parseDate: 02 Jan 2006
      Performers: &performers
        Name: //span[@class="models"]/span[@class="content"]//a
      Image:
        selector: //video[@id="player"]/@poster|//div[@class="video-poster"]/img/@src
        postProcess:
          - replace:
              - regex: \/thumbs_pg\/
                with: /thumbs/

  galleryScraper:
    gallery:
      Studio: *studio
      Title: *title
      Details: *details
      Date: *date
      Performers: *performers

driver:
  cookies:
    - CookieURL: "https://www.karups.com"
      Cookies:
        - Name: "warningHidden"
          Domain: "www.karups.com"
          Value: "true"
          Path: "/"

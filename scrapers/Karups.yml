name: Karups
sceneByURL:
  - action: scrapeXPath
    url:
      - karups.com/video/
    scraper: sceneScraper
galleryByURL:
  - action: scrapeXPath
    url:
      - karups.com/gallery/
    scraper: galleryScraper

xPathScrapers:
  sceneScraper:
    scene:
      # Studio badge is missing as of 2026-09-06
      # but it might return in the future
      Studio: &studio
        Name:
          selector: //span[@class="sup-title"]/span
          postProcess:
            - map:
                kow: Karups Older Women
                kha: Karups Hometown Amateurs
                kpc: Karups Private Collection
      Title: &title //h1[@class="page-heading"]/span[@class="title"]
      Details: //div[@class="content-information-description"]/p
      Date: &date
        selector: //span[@class="date"]/span[@class="content"]
        postProcess:
          - replace:
              - regex: (st|nd|rd|th)\,
                with: ","
          - parseDate: Jan 02, 2006
      Performers: &performers
        Name: //span[@class="models"]/span[@class="content"]//a
      Image:
        selector: //video[@id="player"]/@poster|//div[@class="video-poster"]/img/@src
        postProcess:
          - replace:
              - regex: \/thumbs_pg\/
                with: /thumbs/

  galleryScraper:
    gallery:
      Studio: *studio
      Title: *title
      Date: *date
      Performers: *performers

driver:
  cookies:
    - CookieURL: "https://www.karups.com"
      Cookies:
        - Name: "warningHidden"
          Domain: "www.karups.com"
          Value: "true"
          Path: "/"

name: Karups
sceneByURL:
  - action: scrapeXPath
    url:
      - karups.com/video/
    scraper: sceneScraper
    # Members pages redirect to a login form; scrape the public page instead
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^https?://members\.karups\.com/
          with: https://www.karups.com/
galleryByURL:
  - action: scrapeXPath
    url:
      - karups.com/gallery/
    scraper: galleryScraper
performerByURL:
  - action: scrapeXPath
    url:
      - karups.com/model/
      - karups.com/models/
    scraper: performerScraper
    # Members model pages hold the same data; scrape the public page instead
    queryURL: "{url}"
    queryURLReplace:
      url:
        - regex: ^https?://members\.karups\.com/
          with: https://www.karups.com/

xPathScrapers:
  sceneScraper:
    scene:
      Studio: &studio
        Name:
          selector: //span[@class="sup-title"]/span
          postProcess:
            - map:
                KarupsOW: Karups Older Women
                KarupsHA: Karups Hometown Amateurs
                KarupsPC: Karups Private Collection
      Title: &title //h1[@class="page-heading"]/span[@class="title"]/text()
      Details: &details
        selector: //div[@class="content-information-description"]/p/text()
      Date: &date
        selector: //span[@class="date"]/span[@class="content"]/text()
        postProcess:
          - replace:
              - regex: (st|nd|rd|th)\,
                with: ","
          - parseDate: 02 Jan 2006
      Performers: &performers
        Name: //span[@class="models"]/span[@class="content"]//a/text()
      Image:
        selector: //video[@id="player"]/@poster|//div[@class="video-poster"]/img/@src
        postProcess:
          - replace:
              - regex: \/thumbs_pg\/
                with: /thumbs/

  galleryScraper:
    gallery:
      Studio: *studio
      Title: *title
      Date: *date
      Performers: *performers
      Details: *details

  performerScraper:
    performer:
      # Model pages only list a name, photo and join date
      Name: //h1//span[@class="title"]
      Gender:
        fixed: Female
      Image: //div[@class="model-thumb"]/img/@src

driver:
  cookies:
    - CookieURL: "https://www.karups.com"
      Cookies:
        - Name: "warningHidden"
          Domain: "www.karups.com"
          Value: "true"
          Path: "/"

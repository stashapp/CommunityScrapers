name: Pornbox

sceneByURL:
  - action: scrapeJson
    url:
      - pornbox.com/application/watch-page
    scraper: sceneScraper
    queryURL: "https://pornbox.com/contents/{url}"
    queryURLReplace:
      url:
        - regex: '.+/(\d+)$'
          with: "$1"

sceneByName:
  action: scrapeJson
  scraper: sceneSearch
  queryURL: "https://www.pornbox.com/store/search?q={}&skip=0"

sceneByQueryFragment:
  action: scrapeJson
  queryURL: "{url}"
  queryURLReplace:
    url:
      - regex: '^.*\/([0-9]*)$'
        with: https://pornbox.com/contents/$1/
  scraper: sceneScraper

jsonScrapers:
  sceneScraper:
    scene:
      Title: scene_name
      Date:
        selector: publish_date
        postProcess: &cetDate
          - javascript: |
              return new Date(Date.parse(value) + 2 * 3600 * 1000).toISOString().slice(0, 10);
      Code:
        selector: scene_name
        postProcess:
          - replace:
              - regex: ^.*?\b([A-Z]{2,4}\d{2,4})\s*$|.*
                with: $1
      Tags:
        Name: niches.#.niche
      Performers:
        Name: "[models.#.model_name,male_models.#.model_name].@flatten"
        # https://github.com/stashapp/stash/pull/5100
        Gender:
          selector: "[models.#.sex,male_models.#.sex].@flatten"
          postProcess:
            - map:
                female: FEMALE
                gay: MALE
                male: MALE
      Image: player_poster
      Details:
        selector: small_description
        postProcess:
          - replace:
              - regex: ^none$
                with: ""
              - regex: "&amp;"
                with: "&"
              - regex: " *<\\s*/?br\\s*/?\\s*>"
                with: "\n"
      Studio:
        Name: studio
      URLs:
        selector: id
        postProcess:
          - replace:
              - regex: ^
                with: https://pornbox.com/application/watch-page/

  sceneSearch:
    common:
      $contents: content.contents.#
    scene:
      Title: $contents.scene_name
      Image: $contents.thumbnail.large
      Date:
        selector: $contents.publish_date
        postProcess: *cetDate
      URLs:
        selector: $contents.id
        postProcess:
          - replace:
              - regex: ^
                with: https://pornbox.com/application/watch-page/

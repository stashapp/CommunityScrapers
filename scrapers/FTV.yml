name: FTV
sceneByURL:
  - action: scrapeXPath
    url:
      - ftvgirls.com/update
      - ftvmilfs.com/update
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title:
        selector: //meta[@name="description"]/@content
        postProcess:
          - replace:
              - regex: ^([^:]+).+
                with: $1
      Details: //div[@class="OneHeader"]/p
      Date:
        selector: //title
        postProcess:
          - replace:
              - regex: ^.+Released\s*([a-zA-Z0-9,\s]+).*
                with: $1
          - parseDate: Jan 2, 2006
      Image:
        # They have a typo in their classname and it really is 'Portait' without the r
        selector: //img[@id="Magazine" or @id="MagazinePortait"]/@src
        postProcess:
          - replace:
              # MagazinePortrait images are named tourup so we
              # can't blindly replace 'touru'
              - regex: touru\.
                with: episode.
      Studio:
        Name:
          selector: //title
          postProcess:
            - replace:
                - regex: ^.+on\s*(.+)\.com.+
                  with: $1

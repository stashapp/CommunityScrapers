name: UnderHentai
sceneByFragment:
  action: scrapeXPath
  queryURL: https://www.underhentai.net/{filename}
  queryURLReplace:
    filename:
      - regex: \..+$|\d+
        with: ""
      - regex: \s+
        with: "-"
  scraper: sceneScraper
sceneByURL:
  - action: scrapeXPath
    url:
      - underhentai.net/
    scraper: sceneScraper
sceneByName:
  action: scrapeXPath
  queryURL: https://www.underhentai.net/?s={}
  scraper: sceneSearch
sceneByQueryFragment:
  action: scrapeXPath
  queryURL: "{url}"
  scraper: sceneScraper

xPathScrapers:
  sceneSearch:
    common:
      $result: //article[contains(@class, "post-card")][a[not(starts-with(@href, "http"))]]
    scene:
      Title: $result//h3
      URLs:
        selector: $result/a/@href
        postProcess:
          - replace:
              - regex: ^
                with: https://www.underhentai.net/
      Image: $result//img/@src
  sceneScraper:
    common:
      $row: //div[@class="grid-row"]
    scene:
      Title: //h1
      Date:
        selector: $row[span[@class="row-label"]="Aired"]/span[contains(@class, "row-value")]
        postProcess:
          - parseDate: Jan 2, 2006
      Details: //div[contains(@class, "row-desc")]/p
      URLs: //link[@rel="canonical"]/@href
      # Site uses cyrillic homoglyphs so we need to translate them back
      Tags:
        Name:
          selector: //ul[@class="tags-list"]/li/a
          postProcess:
            - javascript: |
                var latin = { "а": "a", "е": "e", "о": "o", "р": "p", "с": "c", "у": "y", "х": "x",
                  "А": "A", "В": "B", "Е": "E", "К": "K", "М": "M", "Н": "H", "О": "O", "Р": "P",
                  "С": "C", "Т": "T", "Х": "X" };
                return value.replace(/[аеорсухАВЕКМНОРСТХ]/g, function (c) { return latin[c]; });
      Studio:
        Name: $row[span[@class="row-label"]="Brand"]//a
      Image: //meta[@property="og:image"]/@content

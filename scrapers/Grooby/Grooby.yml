          //video[not(//dl8-video)]/@data-poster
          |
          //script[contains(., "player.poster")][not(//dl8-video) and not(//video/@data-poster)]/text()
        concat: __SEP__
        postProcess:
          - replace:
              - regex: (__SEP__).*player\.poster\s*=\s*['"]([^'"]+)['"].*$
                with: $1$2
              - regex: ^//
                with: https://
              - regex: ^(https://[^/]+/tour/)__SEP__(https://.+)$
                with: $2
              - regex: ^(https://[^/]+)/tour/__SEP__/?tour/(.+)$
                with: $1/tour/$2
              - regex: content//
                with: content/
      Tags: *tagsVR

  sceneSearchResultsScraper:

              - regex: ^\/\/
                with: "https://"

  sceneScraperGroobyVR:
    scene:
      Title: *titleMain
      Date: &dateVR
        selector: //div[@class="set_meta"]//b[contains(.,"Added")]/following-sibling::text()[1]
        postProcess:
          - parseDate: January 2, 2006
      Details: &detailsVR
        selector: //div[contains(@class,"trailerpage_description")]//*/text()
        concat: "\n\n"
      Performers: &performersVR
        Name: //div[@class="trailer_toptitle_left"]//a/text()
      Studio: *studio
      Image:
        selector: >-
          //base/@href
          |
          //dl8-video/@poster
          |
          //meta[@property="og:image"][not(//dl8-video)]/@content
          |
          //img[contains(@class, "mainThumb")][not(//dl8-video) and not(//meta[@property="og:image"])]/@src
        concat: __SEP__
        postProcess: &imagePostProcessVR
          - replace:
              # base href is protocol-relative; normalize first
              - regex: ^//
                with: https://
              # if the winning candidate is already a full URL, use just that
              - regex: ^(https://[^/]+/tour/)__SEP__(https://.+)$
                with: $2
              # otherwise it's a site-relative /tour/... path and we
              # join it onto the base, collapsing the duplicate /tour segment
              - regex: ^(https://[^/]+)/tour/__SEP__/?tour/(.+)$
                with: $1/tour/$2
              # errant double slash
              - regex: content//
                with: content/
              # the full variant should be the original unscaled image
              - regex: (\d+)(-\dx)?\.(jpg|jpeg|png|gif)$
                with: $1-full.$3
      Tags: &tagsVR
        Name:
          selector: >-
            //div[@class="set_tags"]/ul/li/text()
            |
            //div[@class="set_tags"]/ul/li//a/text()
          postProcess:
            - map:
                Tags for This Scene: Virtual Reality
    gallery:
      Title: *titleMain
      Date: *dateVR
      Details: *detailsVR
      Performers: *performersVR
      Studio: *studio
      Tags: *tagsVR

  sceneScraperTransVR:
    scene:
      Title:
        selector: //meta[@property="og:title"]/@content
        postProcess:

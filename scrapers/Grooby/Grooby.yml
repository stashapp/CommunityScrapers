xPathScrapers:
  clubScraper:
    scene:
      Title: &title //div[@class="trailer_toptitle_left"]
      Date: &date
        selector: //b[contains(.,"Added")]/following-sibling::text()[1]
        postProcess:
          - replace:
              - regex: ^-
                with: ""
          - parseDate: January 2, 2006
      Details: &details
        selector: //div[@class="trailerpage_info"]/p/text()
        concat: " "
      Performers: &performers
        Name: //div[@class="setdesc"]//a[contains(@href, "models")]/text()
      Studio: &studioClub
        Name: //div[@class="sitename"]/a/text() | //meta[@name="author"]/@content
      URLs: &url //link[@rel="canonical"]/@href
      Image: &image
        selector: //meta[@property="og:image"]/@content
        postProcess:
          - replace:
              - regex: ^//
                with: https://
      Tags:
        Name: &tagsSel //div[@class="set_tags"]/ul/li//a/text()
    gallery:
      Title: *title
      Date: *date
      Details: *details
      Performers: *performers
      Studio: *studioClub
      Tags:
        Name: *tagsSel

  substudioScraper:
    scene:
      Title: *title
      Date: *date
      Details: *details
      Performers: *performers
      Studio: &studioSub
        Name: //meta[@name="author"]/@content
      URLs: *url
      Image: *image
      # Tags for these subsites only appear on grooby.club as of 2023-08-15
      # but we have to extend the subScraper functionality in Stash
      # if we want to be able to scrape more than just a single field
      # TODO: write a python scraper, merge with the rest of this file?
      Tags:
        Name:
          selector: //link[@rel="canonical"]/@href
          postProcess:
            - replace:
                - regex: ^.+/tour
                  with: https://grooby.club/tour
            - subScraper: *tagsSel
    gallery:
      Title: *title
      Date: *date
      Details: *details
      Performers: *performers
      Studio: *studioSub
      Tags:
        Name: *tagsSel

  sceneScraper:
    scene:
      Title: &titleMain
        # Some sites nest the actual title text inside a child span
        # (e.g. <div class="trailer_toptitle_left"><a>Model</a> in
        # <span class="title">Real Title</span></div>), which the plain
        # text()[last()] selector above doesn't reach so we fall back to it
        selector: //p[@class="trailertitle"]/text()|//div[@class="trailer_toptitle_left"]/text()[last()]|//div[@class="trailer_toptitle_left"]//span[@class="title"]/text()
        postProcess:
          - replace:
              # Strips the curly quotes used by some sites
              - regex: ^\s*in\s*[\x{201C}"](.+)[\x{201D}"]\s*$
                with: $1
      Date: &dateMain
        selector: //div[@class="setdesc"]//b[contains(.,"Added")]/following-sibling::text()[1]
        postProcess:
          - parseDate: January 2, 2006
      Details: &detailsMain
        # Grooby Network sites use a p tag for the scene description, where each subsequent
        # paragraph is a nested span tag, so they need to be captured separately.
        # There doesn't appear to be a way to capture the text of all child elements
        # (e.g. <a> <em> <strong>) to get the full text of each paragraph, while also
        # ignoring the nested span tags.
        # So instead, the entire text of the p tag is captured, and then the newlines are
        # recreated in the post-processing step.
        # Some sites nest the description p tag inside setdesc rather than
        # as a direct child of trailerpage_info - fall back to that too.
        selector: //div[@class="trailerpage_info"]/p[not(@class)]|//div[@class="setdesc"]/p[not(@class)]
        postProcess:
          - javascript: |
              if (value && value.length > 0) {
                const result = [];
                for (let i = 0; i < value.length; i++) {
                  const character = value[i];
                  if (
                    character === '.'
                    && i !== value.length - 1 // not the last character
                    && !value.slice(i + 1).startsWith('XXX') // not a .XXX domain
                    && !value.slice(i + 1).startsWith('com') // not a .com domain
                    && !value.slice(i + 1).startsWith(' ') // not the end of a sentence
                    && !value.slice(i + 1).startsWith('.') // not consecutive dots
                  ) {
                    result.push(character, '\n\n');
                  } else {
                    result.push(character);
                  }
                }
                return result.join('').trim();
              }
              return value;
      Performers: &performersMain
        Name: //div[@class="setdesc"]//a/text()
      Studio: &studio
        Name:
          # A handful of sites echo their own TLD onto the end of an
          # otherwise-clean author name (e.g. "TGirls.XXX" instead of
          # "TGirls", unlike sibling sites like femout.xxx's "Femout")
          selector: //meta[@name="author"]/@content
          postProcess:
            - replace:
                - regex: (?i)\.(xxx|com|porn|net)$
                  with: ""
            # t.porn's real brand name IS "T.Porn" (matches its domain
            # exactly) - the generic strip above wrongly reduces it to "T"
            - map:
                T: T.Porn
        URL:
          selector: //link[@rel="canonical"]/@href
          postProcess:
            - replace:
                - regex: (https://[^/]*)/.*
                  with: $1
      Image:
        selector: >-
          //link[@rel="canonical"]/@href
          |
          //div[@class="player-thumb"]/img[contains(@class, "thumbs stdimage")]/@src
          |
          //div[@class="player-thumb"]/img[contains(@class, "thumbs stdimage")]/@src0_1x
          |
          //div[@class="trailerposter"]/img/@src0
          |
          //div[@id="fakeplayer"]//img/@src
          |
          //div[@class="trailer_video"]//video/@data-poster
          |
          //script[contains(., "player.poster")]/text()
        concat: __SEPARATOR__
        postProcess:
          - replace:
              - regex: (__SEPARATOR__).*player\.poster\s*=\s*['"]([^'"]+)['"].*$
                with: __SEPARATOR__$2
              - regex: ^.*__SEPARATOR__// # img urls without protocol, but with domain, e.g. //bobstgirls.com/whatever
                with: "https://"
              - regex: ^(https://[^/]*)/.*(__SEPARATOR__.*)$ # remove any path part from canonical URL
                with: $1$2
              - regex: content// # remove errant double slash in image URL
                with: content/
              - regex: __SEPARATOR__ # remove the separator we added to process the canonical link and relative image URL together
                with: ""
              - regex: (\d+).jpg
                with: $1-full.jpg # get the highest res version of the image
      Tags:
        Name:
          selector: &tagsSelMain //div[@class="set_tags"]/ul/li//a/text()
  galleryScraper:
    gallery:
      Title: *titleMain
      Date: *dateMain
      Details: *detailsMain
      Performers: *performersMain
      Studio: *studio
      Tags:
        Name: *tagsSelMain


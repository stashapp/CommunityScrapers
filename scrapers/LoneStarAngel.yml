name: LoneStarAngel
sceneByURL:
  - action: scrapeXPath
    url:
      - lonestarangel.com
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    scene:
      Title: //span[@class="update_title"]
      Details:
        selector: //span[@class="latest_update_description"]
        postProcess:
          - javascript: |
              return value.replace(/([\p{Ll}\d)][.!?…]["”]?)(?=\p{Lu})/gu, "$1\n\n");
      URLs: //link[@rel="canonical"]/@href
      Date:
        selector: //span[@class="availdate"]
        postProcess:
          - parseDate: 01/02/2006
      Tags:
        Name: //span[@class="update_tags"]/a
      Image: //meta[@property="og:image"]/@content
      Performers:
        Name:
          fixed: Lone Star Angel
      Studio:
        Name:
          fixed: Lone Star Angel

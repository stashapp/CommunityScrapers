name: MyDirtyHobby
sceneByURL:
  - action: scrapeXPath
    url:
      - mydirtyhobby.com/profil/
      - mydirtyhobby.de/profil/
    scraper: sceneScraper
xPathScrapers:
  sceneScraper:
    common:
      $script: //script[contains(text(),"profile_page")]/text()
    scene:
      Title:
        selector: $script
        postProcess:
          - replace:
              - regex: '.*"title":{"text":"([^"]+)"},"subtitle".*'
                with: $1
          - &decodeUnicodeEscapes
            javascript: |
              return value.replace(/\\u([0-9a-fA-F]{4})/g, function (m, hex) {
                return String.fromCharCode(parseInt(hex, 16));
              });
          - &uncensorGerman
            javascript: |
              var patterns = [
                ["fi\\*\\*", "fick"],
                ["pi\\*\\*", "piss"],
                ["pu\\*\\*y", "pussy"],
                ["lec\\*", "leck"],
                ["wi\\*\\*", "wich"],
                ["ti\\*ten", "titten"],
                ["schwä\\*\\*e", "schwänze"],
                ["schw\\*\\*z", "schwanz"],
                ["fo\\*\\*e", "fotze"],
                ["ars\\*\\*", "arsch"],
                ["musc\\*\\*", "muschi"],
                ["w\\*x", "wix"],
                ["dil\\*o", "dildo"],
                ["fin\\*\\*r", "finger"],
                ["ana\\*", "anal"],
                ["bl\\*wjob", "blowjob"],
                ["hard\\*\\*re", "hardcore"],
                ["naturs\\*\\*\\*", "natursekt"],
                ["spri\\*\\*", "spritz"],
                ["bla\\*", "blas"],
                ["hur\\*", "hure"],
                ["schl\\*\\*k", "schluck"],
                ["gangba\\*g", "gangbang"],
                ["str\\*ps", "straps"],
                ["präsenti\\*rt", "präsentiert"],
                ["sper\\*a", "sperma"],
                ["s\\*x", "sex"],
                ["befrie\\*\\*\\*ng", "befriedigung"],
              ];
              return patterns.reduce(function (acc, pair) {
                var re = new RegExp(pair[0], "gi");
                return acc.replace(re, function (match) {
                  var real = pair[1];
                  if (
                    match === match.toUpperCase() &&
                    match !== match.toLowerCase()
                  ) {
                    return real.toUpperCase();
                  }
                  return match[0] === match[0].toUpperCase()
                    ? real[0].toUpperCase() + real.slice(1)
                    : real;
                });
              }, value);

      Details:
        selector: $script
        postProcess:
          - replace:
              - regex: '.*"description":{"text":"(.+)","moreText.*'
                with: $1
              - regex: "&#39;"
                with: "'"
              - regex: '<a[^>]+>([^<]+)<\\/a>' #anchors
                with: "$1"
          - *decodeUnicodeEscapes
          - *uncensorGerman
      Date:
        selector: $script
        postProcess:
          - replace:
              - regex: '.*"subtitle":{"text":"([^"]+)"},"rating".*'
                with: $1
          - javascript: |
              var months = {
                Januar: "Jan",
                Februar: "Feb",
                "März": "Mar",
                April: "Apr",
                Mai: "May",
                Juni: "Jun",
                Juli: "Jul",
                August: "Aug",
                September: "Sep",
                Oktober: "Oct",
                November: "Nov",
                Dezember: "Dec",
              };
              return value.replace(
                /Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember/,
                function (m) {
                  return months[m];
                }
              );
          - parseDate: 02 Jan 2006
          - parseDate: 02 Jan. 2006
      Performers:
        Name:
          selector: $script
          postProcess:
            - replace:
                - regex: '.*"thumbImg":{"title":"([^"]+)".*'
                  with: $1
            - *decodeUnicodeEscapes
            - *uncensorGerman
      Tags:
        Name:
          selector: $script
          postProcess:
            - replace:
                - regex: '.*"(?:K|C)ategorie(?:n|s)","items":\[([^]]+)\].*'
                  with: $1
                - regex: '{"text":"([^"]+)","href":"[^"]+"}'
                  with: $1
            - *decodeUnicodeEscapes
            - *uncensorGerman
          split: ","
      Image:
        selector: $script
        postProcess:
          - replace:
              - regex: '.*?"thumbnail":\s*{[^}]+"src":\s*"([^"]+)".*'
                with: $1
              - regex: '\\/'
                with: "/"
      Studio:
        Name:
          selector: $script
          postProcess:
            - replace:
                - regex: '.*"thumbImg":{"title":"([^"]+)".*'
                  with: $1
            - *decodeUnicodeEscapes
            - *uncensorGerman

driver:
  cookies:
    - CookieURL: "https://www.mydirtyhobby.com"
      Cookies:
        - Name: "AGEGATEPASSED"
          Domain: ".mydirtyhobby.com"
          Value: "1"
          Path: "/"
    - CookieURL: "https://www.mydirtyhobby.de"
      Cookies:
        - Name: "AGEGATEPASSED"
          Domain: ".mydirtyhobby.de"
          Value: "1"
          Path: "/"
